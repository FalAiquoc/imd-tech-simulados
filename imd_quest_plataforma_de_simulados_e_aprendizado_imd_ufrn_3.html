após a transpilação para .js.", "Porque arquivos .ts não podem ser importados.", "Porque o ponto é proibido em strings.", "Porque só funciona com .html."], "answer": 0, "explanation": "Omitir a extensão permite que o JS transpilado localize './carro.js' sem erro.", "id": "poo_a13_e09"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "facil", "question": "Qual é a aplicação prática desenvolvida nas Aulas 14 e 15 da disciplina de POO?", "options": ["Uma aplicação web de cadastro e listagem de livros estruturada com TypeScript e POO.", "Um jogo 3D em WebGL.", "Uma planilha de Excel offline.", "Um editor de imagens."], "answer": 0, "explanation": "O projeto prático consolida classes, módulos, encapsulamento e integração HTML + TS no cadastro de livros.", "id": "poo_a14_e01"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "facil", "question": "Qual carregador de módulos (module loader) foi configurado na Aula 14 para carregar módulos JS compilados no navegador?", "options": ["SystemJS", "jQueryUI", "BootstrapJS", "FlashLoader"], "answer": 0, "explanation": "SystemJS carrega dinamicamente o ponto de entrada js/app.js e suas dependências de módulos no navegador.", "id": "poo_a14_e02"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "medio", "question": "No tsconfig.json do projeto prático (Aula 14), qual opção informa ao compilador TypeScript para gerar módulos compatíveis com SystemJS?", "options": ["\"module\": \"system\"", "\"loader\": \"systemjs\"", "\"target\": \"system\"", "\"outDir\": \"system\""], "answer": 0, "explanation": "Definir \"module\": \"system\" instrui o tsc a emitir módulos no formato System.register consumido pelo SystemJS.", "id": "poo_a14_e03"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "facil", "question": "No index.html do projeto de cadastro de livros (Aula 14), quais quatro campos de entrada compõem o formulário?", "options": ["Título, Autor, Editora e Ano.", "Nome, CPF, Senha e CEP.", "Marca, Modelo, Placa e Cor.", "Nota 1, Nota 2, Média e Situação."], "answer": 0, "explanation": "O formulário coleta titulo, autor, editora e ano para instanciar objetos Livro.", "id": "poo_a14_e04"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "facil", "question": "Qual elemento HTML foi preparado abaixo do formulário na Aula 14 para exibir a listagem dos livros cadastrados?", "options": ["Uma tabela (\u003ctable\u003e) com colunas Título, Autor, Editora e Ano.", "Um Carousel.", "Uma tag \u003cvideo\u003e.", "Um \u003cselect\u003e."], "answer": 0, "explanation": "Os livros cadastrados são renderizados dinamicamente como linhas da tabela HTML.", "id": "poo_a14_e05"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "medio", "question": "No script de inicialização do SystemJS no HTML da Aula 14, o que faz System.import('js/app.js').catch(err =\u003e console.error(err))?", "options": ["Carrega o módulo principal app.js da pasta js/ e registra eventuais erros de carregamento no console.", "Apaga o arquivo app.js.", "Compila TypeScript dentro do navegador.", "Envia o formulário automaticamente."], "answer": 0, "explanation": "System.import inicia a execução da aplicação modular a partir de app.js.", "id": "poo_a14_e06"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "facil", "question": "Qual é o foco principal das Aulas 14 e 15 segundo a apresentação do material?", "options": ["Aplicar os conceitos de Programação Orientada a Objetos por trás da interface, e não focar em design avançado.", "Criar animações complexas em CSS.", "Estudar apenas banco de dados SQL.", "Fazer tradução de textos em inglês."], "answer": 0, "explanation": "A interface HTML é propositalmente simples para destacar a arquitetura OO em TypeScript.", "id": "poo_a14_e07"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "medio", "question": "Por que o pacote concurrently ou dois terminais (tsc -w e live-server) são úteis durante o desenvolvimento do projeto prático?", "options": ["Permitem transpilar o TypeScript automaticamente e atualizar o navegador em paralelo a cada alteração salva.", "Para rodar dois bancos de dados.", "Para converter HTML em PDF.", "Para desativar o Node.js."], "answer": 0, "explanation": "Executar tsc -w junto com live-server cria um fluxo contínuo de compilação e recarregamento.", "id": "poo_a14_e08"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "facil", "question": "Qual atributo do botão \u003cbutton type='submit'\u003eCadastrar\u003c/button\u003e dispara o evento de envio do formulário de livros?", "options": ["type=\"submit\"", "type=\"reset\"", "type=\"text\"", "type=\"button\""], "answer": 0, "explanation": "type='submit' dispara o evento submit no \u003cform\u003e, que será interceptado pelo Controller.", "id": "poo_a14_e09"}, {"subject": "poo", "lessonNum": 14, "lesson": "Aula 14 — Projeto Prático - Parte 1", "official": false, "difficulty": "medio", "question": "Qual arquivo na pasta raiz controla as dependências instaladas (como live-server e systemjs) e os scripts npm do projeto?", "options": ["package.json", "tsconfig.json", "index.html", "app.ts"], "answer": 0, "explanation": "package.json gerencia dependências e scripts do Node/npm; tsconfig.json configura o compilador tsc.", "id": "poo_a14_e10"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "facil", "question": "Qual classe arquitetural foi criada na Aula 15 para intermediar a comunicação entre o formulário HTML e os modelos/dados TypeScript?", "options": ["Uma classe Controller (ex.: LivroController).", "Uma classe StyleSheet.", "Uma classe BrowserWindow.", "Uma classe DatabaseSQL."], "answer": 0, "explanation": "O Controller captura os eventos e campos do formulário, instancia o modelo Livro e atualiza a visualização.", "id": "poo_a15_e01"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "facil", "question": "Na arquitetura MVC simplificada aplicada no projeto prático, qual é o papel da classe modelo Livro?", "options": ["Representar a entidade de dados de um livro (título, autor, editora, ano) com seus atributos e getters.", "Desenhar o CSS da página.", "Subir o servidor HTTP.", "Carregar o SystemJS."], "answer": 0, "explanation": "A classe modelo encapsula a estrutura e regras de um livro individual.", "id": "poo_a15_e02"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "facil", "question": "Qual estrutura de classe costuma encapsular a coleção (array) de livros cadastrados para armazenar e listar os dados em memória?", "options": ["Uma classe de coleção (ex.: Livros) contendo um array privado Livro[] e métodos para adicionar e listar.", "Uma variável booleana simples.", "Um arquivo de imagem.", "Uma tag \u003cmeta\u003e."], "answer": 0, "explanation": "Encapsular o array Livro[] em uma classe própria protege a lista contra mutações externas indevidas.", "id": "poo_a15_e03"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "medio", "question": "Ao capturar o evento submit do formulário no TypeScript (Aula 15), por que o método do Controller chama event.preventDefault()?", "options": ["Para evitar que o navegador recarregue a página e apague a lista de livros armazenada em memória.", "Para apagar os campos antes de ler.", "Para impedir o botão de ser clicado.", "Para fechar a aba do navegador."], "answer": 0, "explanation": "Sem preventDefault(), o reload padrão do formulário destruiria todo o estado da aplicação.", "id": "poo_a15_e04"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "medio", "question": "Em TypeScript com tipagem estrita, ao buscar um campo do DOM com querySelector para '#titulo', por que costuma-se fazer casting para \u003cHTMLInputElement\u003e (ou as HTMLInputElement)?", "options": ["Porque querySelector retorna Element | null, e a propriedade .value só existe em subtipos específicos como HTMLInputElement.", "Porque document não existe em TypeScript.", "Para converter o campo em botão.", "Para mudar a cor do input."], "answer": 0, "explanation": "A asserção para HTMLInputElement informa ao compilador que o elemento selecionado possui .value.", "id": "poo_a15_e05"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "facil", "question": "Na comunicação entre HTML e TypeScript, como o Controller lê o valor digitado no campo Ano e o converte para número?", "options": ["Acessando this._inputAno.value e convertendo com parseInt(...) ou Number(...).", "Acessando this._inputAno.innerHTML.", "Usando Math.random().", "Lendo direto do arquivo tsconfig.json."], "answer": 0, "explanation": "Inputs HTML retornam strings em .value, exigindo conversão numérica para atributos tipados como number.", "id": "poo_a15_e06"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "medio", "question": "Para que serve retornar uma cópia segura ou ReadonlyArray no método listar() da coleção de livros?", "options": ["Impedir que código externo altere diretamente o array interno (ex.: com push ou pop fora do método adicionar), preservando o encapsulamento.", "Deixar o array sempre vazio.", "Duplicar os livros na tela.", "Permitir apagar tudo de fora."], "answer": 0, "explanation": "Proteger a referência do array interno garante que todas as inclusões passem pelas regras da classe.", "id": "poo_a15_e07"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "facil", "question": "Como a classe View (ou o método de exibição) atualiza a tabela HTML sempre que um novo livro é cadastrado?", "options": ["Montando o template HTML das linhas \u003ctr\u003e\u003ctd\u003e...\u003c/td\u003e\u003c/tr\u003e a partir da lista de livros e atribuindo ao innerHTML do elemento alvo.", "Recarregando o servidor Node.js.", "Salvando um arquivo .pdf.", "Alterando o arquivo package.json."], "answer": 0, "explanation": "Renderizar o template dinâmico no innerHTML reflete imediatamente cada novo cadastro na tabela.", "id": "poo_a15_e08"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "medio", "question": "No arquivo app.ts (ponto de entrada do projeto prático), qual é a responsabilidade principal?", "options": ["Instanciar o Controller e conectar o evento submit do formulário ao método de cadastro do Controller.", "Declarar todas as classes no mesmo arquivo gigante.", "Escrever todo o CSS do site.", "Substituir o index.html."], "answer": 0, "explanation": "app.ts faz a ligação (wiring) inicial entre a página e o Controller.", "id": "poo_a15_e09"}, {"subject": "poo", "lessonNum": 15, "lesson": "Aula 15 — Projeto Prático - Parte 2", "official": false, "difficulty": "facil", "question": "Qual benefício prático de separar o projeto em pastas/arquivos como models/, controllers/ e views/?", "options": ["Separação de responsabilidades: facilita localizar bugs, evoluir a interface sem quebrar regras de negócio e trabalhar em equipe.", "Deixa o código impossível de depurar.", "Obriga a escrever mais código duplicado.", "Elimina a necessidade de TypeScript."], "answer": 0, "explanation": "Organização modular (MVC) é a aplicação direta dos princípios de POO em projetos reais.", "id": "poo_a15_e10"}, {"id": "ing01", "subject": "ing", "lesson": "Aula 01 — Working with Noun Phrases", "difficulty": "facil", "question": "Em Inglês Técnico, onde geralmente se localiza o núcleo (head noun) de um grupo nominal (noun phrase) como \"dominant role\" ou \"high-level programming languages\"?", "options": ["No início da expressão, antes dos modificadores.", "Após as palavras que o modificam (geralmente na última palavra do grupo nominal).", "Sempre no meio da frase, após o verbo auxiliar.", "Não existe núcleo em grupos nominais em inglês."], "answer": 1, "explanation": "Em inglês, ao contrário do português, os modificadores (adjetivos e outros substantivos) vêm antes do núcleo. Em \"dominant role\", o núcleo é \"role\" (papel dominante).", "official": true, "lessonNum": 1}, {"id": "ing02", "subject": "ing", "lesson": "Aula 01 — Working with Noun Phrases", "difficulty": "medio", "question": "No texto \"Computers for the disabled\" (Aula 01), qual recurso combina com um \"speech synthesizer\" para converter o conteúdo da tela em palavras faladas para usuários com deficiência visual?", "options": ["Screen reader", "Braille embosser", "On-screen keyboard", "Visual alert"], "answer": 0, "explanation": "Um speech synthesizer (sintetizador de voz) trabalha em conjunto com um screen reader (leitor de tela) para ler em voz alta o conteúdo exibido no monitor.", "official": true, "lessonNum": 1}, {"id": "ing03", "subject": "ing", "lesson": "Aula 01 — Working with Noun Phrases", "difficulty": "facil", "question": "De acordo com o texto \"How Do Autonomous Cars Work?\", qual tipo de sensor emite pulsos de luz para medir distâncias, detectar bordas da pista e identificar faixas?", "options": ["Radar sensors", "Lidar sensors", "Ultrasonic sensors", "Video cameras"], "answer": 1, "explanation": "No texto da Aula 01: \"Lidar (light detection and ranging) sensors bounce pulses of light off the car's surroundings to measure distances, detect road edges, and identify lane markings.\"", "official": true, "lessonNum": 1}, {"subject": "ing", "lessonNum": 1, "lesson": "Aula 01 — Working with Noun Phrases", "official": false, "difficulty": "facil", "question": "No grupo nominal (noun phrase) 'wireless local area network', qual palavra é o núcleo (head noun)?", "options": ["wireless", "local", "area", "network"], "answer": 3, "explanation": "Em inglês, os modificadores precedem o núcleo. O núcleo é 'network' (rede de área local sem fio).", "id": "ing_a01_e01"}, {"subject": "ing", "lessonNum": 1, "lesson": "Aula 01 — Working with Noun Phrases", "official": false, "difficulty": "facil", "question": "Qual é a tradução mais precisa do grupo nominal 'machine learning systems' (visto no texto Autonomous Cars)?", "options": ["Sistemas de aprendizado de máquina", "Máquinas que aprendem sistemas", "Aprendizado de sistemas mecânicos", "Sistemas de máquinas lentas"], "answer": 0, "explanation": "Traduz-se partindo do núcleo à direita ('systems') voltando para os modificadores ('machine learning').", "id": "ing_a01_e02"}, {"subject": "ing", "lessonNum": 1, "lesson": "Aula 01 — Working with Noun Phrases", "official": false, "difficulty": "facil", "question": "Quais duas estratégias de leitura instrumental são retomadas na Aula 01 para localizar a ideia geral e informações específicas em textos técnicos?", "options": ["Skimming (leitura rápida para ideia geral) e Scanning (busca por dados específicos).", "Writing e Speaking.", "Coding e Debugging.", "Translating e Memorizing."], "answer": 0, "explanation": "Skimming capta o sentido global; Scanning localiza datas, nomes, siglas e fatos pontuais.", "id": "ing_a01_e03"}, {"subject": "ing", "lessonNum": 1, "lesson": "Aula 01 — Working with Noun Phrases", "official": false, "difficulty": "medio", "question": "No vocabulário de acessibilidade da Aula 01 ('Computers for the disabled'), o que é um 'screen magnifier'?", "options": ["Um software ampliador de tela que facilita a leitura para usuários com baixa visão.", "Uma impressora em Braille.", "Um teclado físico gigante.", "Um tipo de antivírus."], "answer": 0, "explanation": "screen magnifier = ampliador de tela; Braille embosser = impressora Braille; on-screen keyboard = teclado virtual.", "id": "ing_a01_e04"}, {"subject": "ing", "lessonNum": 1, "lesson": "Aula 01 — Working with Noun Phrases", "official": false, "difficulty": "medio", "question": "Qual é a tradução adequada do grupo nominal 'obstacle avoidance algorithms' (texto Autonomous Cars)?", "options": ["Algoritmos de desvio/evitação de obstáculos", "Obstáculos que evitam algoritmos", "Algoritmos de aceleração de obstáculos", "Sensores de velocidade"], "answer": 0, "explanation": "Núcleo: algorithms; modificadores: obstacle avoidance (evitação de obstáculos).", "id": "ing_a01_e05"}, {"subject": "ing", "lessonNum": 1, "lesson": "Aula 01 — Working with Noun Phrases", "official": false, "difficulty": "facil", "question": "No grupo nominal 'complex computer network security policies', qual palavra funciona como núcleo?", "options": ["complex", "computer", "security", "policies"], "answer": 3, "explanation": "'policies' (políticas) é o núcleo modificado por todo o bloco anterior (políticas complexas de segurança de redes de computadores).", "id": "ing_a01_e06"}, {"subject": "ing", "lessonNum": 1, "lesson": "Aula 01 — Working with Noun Phrases", "official": false, "difficulty": "medio", "question": "De acordo com o texto 'How Do Autonomous Cars Work?', qual é a função dos 'ultrasonic sensors' localizados nas rodas?", "options": ["Detectar meios-fios (curbs) e outros veículos durante manobras de estacionamento.", "Ler placas de trânsito à distância.", "Controlar o rádio do carro.", "Medir a temperatura do motor."], "answer": 0, "explanation": "Texto da Aula 01: 'Ultrasonic sensors in the wheels detect curbs and other vehicles when parking.'", "id": "ing_a01_e07"}, {"id": "ing04", "subject": "ing", "lesson": "Aula 02 — Using Pronoun Reference", "difficulty": "facil", "question": "Na referência pronominal em inglês, qual é o uso correto dos pronomes relativos who, which e where?", "options": ["who refere-se a lugares; which a pessoas; where a animais.", "who refere-se a pessoas; which a animais e coisas; where a lugares.", "who e which referem-se apenas a objetos inanimados.", "where substitui exclusivamente pronomes possessivos."], "answer": 1, "explanation": "Conforme a Aula 02: who refere-se a pessoas, that a pessoas/animais/coisas, which a animais/coisas, e where a lugares.", "official": true, "lessonNum": 2}, {"id": "ing05", "subject": "ing", "lesson": "Aula 02 — Using Pronoun Reference", "difficulty": "medio", "question": "Leia o trecho da Aula 02: \"A computer can't think. It merely performs the instructions given by the programmer. It is the programmer then who thinks...\" A que se referem respectivamente \"It\" (1ª ocorrência) e \"who\"?", "options": ["instructions e computer", "a computer e the programmer", "the programmer e instructions", "problem e flowchart"], "answer": 1, "explanation": "O primeiro \"It\" substitui \"A computer\" (sujeito da frase anterior), e o pronome relativo \"who\" retoma \"the programmer\" (pessoa).", "official": true, "lessonNum": 2}, {"id": "ing06", "subject": "ing", "lesson": "Aula 02 — Using Pronoun Reference", "difficulty": "facil", "question": "Na frase \"This is my book. Yours is on the table.\", qual a função gramatical de \"my\" e \"Yours\"?", "options": ["my é adjetivo possessivo (acompanha o substantivo book) e Yours é pronome possessivo (substitui o substantivo).", "Ambos são pronomes demonstrativos.", "my é pronome relativo e Yours é pronome interrogativo.", "Ambos são verbos auxiliares."], "answer": 0, "explanation": "Adjetivos possessivos (my, your, his...) antecedem um substantivo; pronomes possessivos (mine, yours, hers...) substituem o substantivo para evitar repetição.", "official": true, "lessonNum": 2}, {"subject": "ing", "lessonNum": 2, "lesson": "Aula 02 — Using Pronoun Reference", "official": false, "difficulty": "facil", "question": "Por que os pronomes são fundamentais na coesão de textos técnicos em inglês?", "options": ["Porque substituem substantivos ou ideias já mencionadas, evitando repetições excessivas e conectando as frases.", "Porque eliminam a necessidade de verbos.", "Porque sempre indicam tempo futuro.", "Porque só aparecem em títulos."], "answer": 0, "explanation": "Identificar a referência pronominal evita perder o fio condutor ao ler manuais e artigos de TI.", "id": "ing_a02_e01"}, {"subject": "ing", "lessonNum": 2, "lesson": "Aula 02 — Using Pronoun Reference", "official": false, "difficulty": "facil", "question": "Quais são os pronomes demonstrativos (demonstrative pronouns) em inglês?", "options": ["this, that, these, those", "who, which, where, that", "my, your, his, her", "I, you, he, she"], "answer": 0, "explanation": "this/these indicam proximidade (singular/plural); that/those indicam distância (singular/plural).", "id": "ing_a02_e02"}, {"subject": "ing", "lessonNum": 2, "lesson": "Aula 02 — Using Pronoun Reference", "official": false, "difficulty": "medio", "question": "Na frase 'The mother decided to take the kids to the park. This made them happy.', a que se referem respectivamente 'This' e 'them'?", "options": ["This refere-se à ideia completa de levar as crianças ao parque; them refere-se a 'the kids'.", "This refere-se ao parque; them refere-se à mãe.", "Ambos referem-se à mãe.", "This não tem referente."], "answer": 0, "explanation": "Conforme a Aula 02, 'this' e 'that' podem retomar uma oração/ideia inteira, não apenas uma palavra isolada.", "id": "ing_a02_e03"}, {"subject": "ing", "lessonNum": 2, "lesson": "Aula 02 — Using Pronoun Reference", "official": false, "difficulty": "facil", "question": "Qual pronome relativo completa corretamente a frase: 'The software _____ we installed yesterday is open source.'?", "options": ["which (ou that)", "who", "where", "whose"], "answer": 0, "explanation": "Como 'software' é uma coisa, usa-se which ou that (who é usado para pessoas e where para lugares).", "id": "ing_a02_e04"}, {"subject": "ing", "lessonNum": 2, "lesson": "Aula 02 — Using Pronoun Reference", "official": false, "difficulty": "facil", "question": "Qual pronome relativo completa corretamente: 'That is the laboratory _____ the servers are hosted.'?", "options": ["where", "who", "which", "whom"], "answer": 0, "explanation": "'laboratory' indica lugar, exigindo o pronome relativo where.", "id": "ing_a02_e05"}, {"subject": "ing", "lessonNum": 2, "lesson": "Aula 02 — Using Pronoun Reference", "official": false, "difficulty": "medio", "question": "No trecho da Aula 02: 'The logical sequence of these instructions can be described by a flowchart.', o que significa o pronome demonstrativo 'these'?", "options": ["Retoma no plural as instruções passo a passo mencionadas imediatamente antes.", "Indica uma única instrução distante.", "Refere-se ao fluxograma.", "É um verbo auxiliar."], "answer": 0, "explanation": "these = estas (plural próximo), retomando 'instructions'.", "id": "ing_a02_e06"}, {"subject": "ing", "lessonNum": 2, "lesson": "Aula 02 — Using Pronoun Reference", "official": false, "difficulty": "medio", "question": "Qual a diferença entre 'their' e 'theirs' em inglês?", "options": ["their é adjetivo possessivo (usado antes de substantivo: their phones); theirs é pronome possessivo (usado sozinho substituindo o substantivo).", "their é singular e theirs é plural.", "theirs é um verbo no presente.", "Não existe diferença."], "answer": 0, "explanation": "Adjetivos possessivos acompanham o substantivo; pronomes possessivos o substituem.", "id": "ing_a02_e07"}, {"id": "ing07", "subject": "ing", "lesson": "Aula 03 — Forming Words in English", "difficulty": "facil", "question": "Quais são os três processos de formação de palavras estudados na Aula 03, exemplificados por \"prehistoric\", \"smartpen\" e \"play (verbo/substantivo)\"?", "options": ["Affixation (afixação), Compounding (composição) e Conversion (conversão).", "Translation, Repetition e Negation.", "Collocation, Modality e Interrogation.", "Prediction, Skimming e Scanning."], "answer": 0, "explanation": "prehistoric = prefixo pre- + raiz (Affixation); smartpen = smart + pen (Compounding); play como verbo e substantivo sem mudar forma = Conversion.", "official": true, "lessonNum": 3}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "facil", "question": "Qual processo de formação de palavras ocorre em 'notebook' (note + book) e 'high-contrast' (high + contrast)?", "options": ["Compounding (composição)", "Conversion (conversão)", "Prefixation (prefixação)", "Suffixation (sufixação)"], "answer": 0, "explanation": "Compounding une duas ou mais bases (com ou sem hífen) formando uma nova palavra.", "id": "ing_a03_e01"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "facil", "question": "Qual processo de formação ocorre quando a mesma palavra 'limit' ou 'use' atua ora como verbo (limitar/usar) ora como substantivo (limite/uso) sem mudar sua grafia?", "options": ["Conversion (conversão)", "Compounding (composição)", "Affixation (afixação)", "Abbreviation"], "answer": 0, "explanation": "Na conversão (zero derivation), a palavra muda de classe gramatical sem adicionar prefixos ou sufixos.", "id": "ing_a03_e02"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "facil", "question": "Qual processo forma a palavra 'microscope' (micro- + scope) e 'infrastructure' (infra- + structure)?", "options": ["Prefixation (afixação por prefixo)", "Suffixation", "Compounding", "Conversion"], "answer": 0, "explanation": "micro- e infra- são prefixos anexados antes da raiz.", "id": "ing_a03_e03"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "facil", "question": "Qual processo forma as palavras 'operation' (operate + -ion) e 'specialist' (special + -ist)?", "options": ["Suffixation (afixação por sufixo)", "Prefixation", "Compounding", "Conversion"], "answer": 0, "explanation": "-ion e -ist são sufixos adicionados ao final da raiz.", "id": "ing_a03_e04"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "medio", "question": "Na evolução ortográfica destacada na Aula 03 ('Saiba Mais!'), como evoluiu o termo composto 'Web site' ao longo do tempo?", "options": ["Começou separado ('Web site'), passou a usar hífen ('web-site') e hoje é escrito como uma única palavra ('website').", "Deixou de existir na língua inglesa.", "Virou um prefixo obrigatório.", "Passou a se escrever com três palavras."], "answer": 0, "explanation": "Palavras compostas em inglês podem evoluir de abertas → hifenizadas → fechadas conforme o uso.", "id": "ing_a03_e05"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "medio", "question": "Sobre o significado de palavras formadas por composição (Compounding), qual afirmação da Aula 03 está correta?", "options": ["O significado pode ser a soma direta das bases (ex.: playground = área de brincar) ou assumir um sentido diferente/idiomático.", "O significado é sempre impossível de deduzir.", "Toda palavra composta tem hífen obrigatório.", "Apenas verbos formam palavras compostas."], "answer": 0, "explanation": "Muitas palavras compostas de TI são transparentes (smartpen, notebook, keyboard), mas outras ganham sentido próprio.", "id": "ing_a03_e06"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "medio", "question": "Em 'The History of Pen and Paper' (Aula 03), quais limitações do papel e caneta são citadas pelo texto da Livescribe?", "options": ["Documentos em papel são estáticos, difíceis de compartilhar amplamente, suscetíveis a perda/dano e não têm conectividade.", "O papel é caro demais para escolas.", "A caneta não escreve em cadernos modernos.", "O texto diz que o papel não tem nenhuma limitação."], "answer": 0, "explanation": "O texto destaca falta de conectividade, natureza estática e vulnerabilidade a danos/perdas.", "id": "ing_a03_e07"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "medio", "question": "A partir da raiz 'blog', 'mail' e 'print', quais formas derivadas/convertidas exemplificam a família de palavras da Aula 03?", "options": ["blogger (sufixação), to mail (conversão para verbo) e printout (composição).", "bloging, maileds e printering.", "Todas são apenas prefixações.", "Nenhuma muda de classe gramatical."], "answer": 0, "explanation": "Uma mesma raiz de TI gera substantivos, agentes (-er), verbos e compostos.", "id": "ing_a03_e08"}, {"subject": "ing", "lessonNum": 3, "lesson": "Aula 03 — Forming Words in English", "official": false, "difficulty": "dificil", "question": "Classifique corretamente o processo predominante em: 1) solid-state | 2) electronically | 3) reprogrammed | 4) drive (substantivo/verbo):", "options": ["1-Compounding, 2-Suffixation, 3-Prefixation/Affixation, 4-Conversion", "1-Conversion, 2-Compounding, 3-Conversion, 4-Prefixation", "Todas são Compounding", "Todas são Suffixation"], "answer": 0, "explanation": "solid+state = composição; electronic+-ally = sufixação; re-+program+-ed = afixação; drive = conversão.", "id": "ing_a03_e09"}, {"id": "ing08", "subject": "ing", "lesson": "Aula 04 — Word Formation: Affixes", "difficulty": "facil", "question": "Sobre os sufixos em inglês, qual alternativa explica corretamente o papel de -ful, -less, -ment e -ly?", "options": ["-ful indica ausência; -less indica excesso; -ment cria verbos; -ly cria substantivos.", "-ful indica presença/qualidade (careful); -less indica ausência (careless); -ment forma substantivos a partir de verbos (attachment); -ly transforma adjetivos em advérbios (obviously).", "Todos os quatro sufixos servem apenas para colocar verbos no passado.", "-ly indica negação assim como o prefixo un-."], "answer": 1, "explanation": "Na Aula 04: -ful (com/cheio de) opõe-se a -less (sem/ausência); -ment nominaliza verbos (attach → attachment); -ly forma advérbios de modo (obvious → obviously).", "official": true, "lessonNum": 4}, {"id": "ing09", "subject": "ing", "lesson": "Aula 04 — Word Formation: Affixes", "difficulty": "medio", "question": "Na palavra \"replaceable\" (re + place + able) e em \"independent\" (in + dependent), quais processos morfológicos ocorrem?", "options": ["replaceable combina prefixo e sufixo na mesma raiz; independent utiliza apenas prefixo negativo (in-).", "Ambas são palavras compostas por dois substantivos.", "Ambas são formadas por conversão.", "independent possui o sufixo -ent como prefixo."], "answer": 0, "explanation": "replaceable tem prefixo re- + raiz place + sufixo -able. Já independent recebe o prefixo in- antes da raiz dependent.", "official": true, "lessonNum": 4}, {"id": "ing10", "subject": "ing", "lesson": "Aula 04 — Word Formation: Affixes", "difficulty": "medio", "question": "De acordo com o texto \"Computer graphics\" (Aula 04), qual a diferença entre gráficos Raster (bitmaps) e gráficos Vector?", "options": ["Raster é armazenado como pixels (pode serrilhar ao ampliar); Vector usa equações matemáticas e objetos geométricos (pode ser escalado sem perder qualidade).", "Vector usa pixels (JPEG/GIF) e perde qualidade ao ampliar; Raster usa equações matemáticas.", "Raster é usado apenas em CAD 3D; Vector apenas em fotografias.", "Não há diferença de qualidade ao redimensionar ambos."], "answer": 0, "explanation": "Bitmaps (JPEG, GIF, TIFF) dependem da densidade de pixels; gráficos vetoriais (Illustrator, Corel, EPS) usam pontos, linhas e curvas matemáticas sem perder nitidez ao escalar.", "official": true, "lessonNum": 4}, {"subject": "ing", "lessonNum": 4, "lesson": "Aula 04 — Word Formation: Affixes", "official": false, "difficulty": "facil", "question": "Qual é a diferença de posição entre um prefixo (prefix) e um sufixo (suffix)?", "options": ["O prefixo é adicionado no INÍCIO da raiz (geralmente altera o sentido); o sufixo é adicionado no FINAL (frequentemente altera a classe gramatical).", "O sufixo vem no início e o prefixo no final.", "Ambos vão no meio da palavra.", "Prefixos só existem em português."], "answer": 0, "explanation": "Ex.: un-happy (prefixo muda sentido); happy → happiness (sufixo muda adjetivo para substantivo).", "id": "ing_a04_e01"}, {"subject": "ing", "lessonNum": 4, "lesson": "Aula 04 — Word Formation: Affixes", "official": false, "difficulty": "facil", "question": "Qual função desempenha o sufixo -er em palavras de TI como 'programmer', 'compiler', 'debugger' e 'consumer'?", "options": ["Indica o agente (pessoa ou ferramenta/programa que realiza a ação do verbo).", "Indica o tempo passado do verbo.", "Indica negação.", "Transforma substantivo em advérbio."], "answer": 0, "explanation": "program → programmer (quem programa); compile → compiler (o que compila).", "id": "ing_a04_e02"}, {"subject": "ing", "lessonNum": 4, "lesson": "Aula 04 — Word Formation: Affixes", "official": false, "difficulty": "medio", "question": "Na frase 'Businesspeople use graphics to make information more interesting visually', qual é a função gramatical da forma -ing em 'interesting'?", "options": ["Adjetivo (qualificando information como 'interessante').", "Gerúndio contínuo.", "Substantivo.", "Infinitivo."], "answer": 0, "explanation": "Conforme a Aula 04, palavras terminadas em -ing podem atuar como Gerúndio, Substantivo, Adjetivo ou Infinitivo (após preposição).", "id": "ing_a04_e03"}, {"subject": "ing", "lessonNum": 4, "lesson": "Aula 04 — Word Formation: Affixes", "official": false, "difficulty": "medio", "question": "Na frase 'Graphs and diagrams can be more effective ways of communicating with clients', como a forma -ing 'communicating' (logo após a preposição 'of') é traduzida/classificada?", "options": ["Infinitivo ('de comunicar / de se comunicar').", "Adjetivo.", "Passado simples.", "Pronome relativo."], "answer": 0, "explanation": "Após preposições (of, by, for, without), o verbo em -ing em inglês equivale frequentemente ao infinitivo em português.", "id": "ing_a04_e04"}, {"subject": "ing", "lessonNum": 4, "lesson": "Aula 04 — Word Formation: Affixes", "official": false, "difficulty": "medio", "question": "Na frase 'She is designing a logo for the company', qual é a função de 'designing' (acompanhado do verbo to be 'is')?", "options": ["Gerúndio (ação em andamento: 'está projetando').", "Adjetivo.", "Substantivo.", "Infinitivo."], "answer": 0, "explanation": "Verbo to be + verbo-ing forma o tempo contínuo (gerúndio).", "id": "ing_a04_e05"}, {"subject": "ing", "lessonNum": 4, "lesson": "Aula 04 — Word Formation: Affixes", "official": false, "difficulty": "facil", "question": "Qual o sentido do prefixo 'micro-' em 'microscope' e do sufixo '-age' em 'storage'?", "options": ["micro- significa 'pequeno'; -age forma substantivo (armazenamento).", "micro- significa 'grande'; -age forma verbo.", "micro- significa 'novo'; -age indica negação.", "Ambos indicam plural."], "answer": 0, "explanation": "Exercício da Aula 04: micro- (small) e store + -age = storage (substantivo).", "id": "ing_a04_e06"}, {"subject": "ing", "lessonNum": 4, "lesson": "Aula 04 — Word Formation: Affixes", "official": false, "difficulty": "medio", "question": "Quais formatos de arquivo de imagem são citados no texto 'Computer graphics' como formatos RASTER populares e qual como formato VECTOR popular?", "options": ["Raster: JPEG, GIF e TIFF; Vector: EPS.", "Raster: EPS e PDF; Vector: JPEG e GIF.", "Raster: MP3 e WAV; Vector: HTML.", "Todos os formatos citados são raster."], "answer": 0, "explanation": "Texto da Aula 04: JPEG, GIF e TIFF são bitmaps/raster; EPS é o formato vetorial citado para troca de desenhos.", "id": "ing_a04_e07"}, {"id": "ing11", "subject": "ing", "lesson": "Aula 05 — Using Modal Verbs", "difficulty": "facil", "question": "Qual característica estrutural é verdadeira para os verbos modais (can, could, may, might, must, should) em inglês?", "options": ["São seguidos pelo verbo principal no infinitivo SEM a partícula \"to\" (ex.: You must have the right plug-in).", "Exigem sempre \"to\" antes do verbo principal (ex.: You must to have).", "Recebem -s na 3ª pessoa do singular (ex.: He cans).", "Só podem ser usados em frases negativas."], "answer": 0, "explanation": "Modal verbs adicionam sentido extra (habilidade, permissão, obrigação, conselho, possibilidade) e vêm sempre seguidos do infinitivo sem \"to\".", "official": true, "lessonNum": 5}, {"id": "ing12", "subject": "ing", "lesson": "Aula 05 — Using Modal Verbs", "difficulty": "medio", "question": "Associe corretamente o sentido do modal em cada frase:\n1. \"You must have Adobe Reader to view a PDF.\"\n2. \"Before going live, you should check all links.\"\n3. \"May I use your mobile phone?\"", "options": ["1: obrigação/necessidade; 2: conselho (advice); 3: pedido formal de permissão.", "1: pedido de permissão; 2: habilidade no passado; 3: obrigação.", "1: conselho; 2: possibilidade fraca; 3: proibição.", "1: habilidade; 2: obrigação; 3: conselho."], "answer": 0, "explanation": "must expressa obrigação/necessidade; should expressa conselho/recomendação; may em perguntas expressa pedido de permissão mais formal que can/could.", "official": true, "lessonNum": 5}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "facil", "question": "Na frase 'He has hurt his foot but he CAN still play soccer', qual sentido o verbo modal 'can' expressa?", "options": ["Ability (habilidade/capacidade)", "Obligation (obrigação)", "Prohibition (proibição)", "Advising (conselho)"], "answer": 0, "explanation": "Autoavaliação da Aula 05: 'can' neste contexto expressa habilidade física.", "id": "ing_a05_e01"}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "facil", "question": "Na pergunta 'Can you please pass that pencil?', qual função o modal 'Can' exerce?", "options": ["Requesting (fazer um pedido)", "Obligation (obrigação)", "Ability (habilidade)", "Prohibition (proibição)"], "answer": 0, "explanation": "Can/Could em perguntas com 'please' expressam pedidos educados (requesting).", "id": "ing_a05_e02"}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "facil", "question": "No diálogo 'A: She's very late. B: She MAY come tomorrow.', qual sentido o modal 'may' expressa?", "options": ["Possibility (possibilidade)", "Obligation (obrigação)", "Ability (habilidade)", "Giving permission (dar permissão)"], "answer": 0, "explanation": "may / might em afirmações expressam possibilidade futura ou presente.", "id": "ing_a05_e03"}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "medio", "question": "No diálogo 'A: There's a woman outside who wants to speak to you. B: She CAN come tomorrow.', qual função 'can' expressa aqui?", "options": ["Giving permission (conceder permissão)", "Obligation (obrigação)", "Requesting (pedido)", "Prohibition (proibição)"], "answer": 0, "explanation": "Autoavaliação da Aula 05: 'She can come tomorrow' concede permissão para ela vir amanhã.", "id": "ing_a05_e04"}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "facil", "question": "Na frase 'I like movies with very much action. — Then you MUST see Lethal Weapon!', qual nuance de sentido o modal 'must' expressa?", "options": ["Advising / recomendação forte ('você tem que assistir').", "Pedido de permissão.", "Habilidade no passado.", "Impossibilidade."], "answer": 0, "explanation": "Embora 'must' indique obrigação em regras, em recomendações entusiasmadas funciona como conselho forte (advising).", "id": "ing_a05_e05"}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "medio", "question": "Como se forma a negativa e a interrogativa de uma frase com verbo modal (como 'You should update the antivirus')?", "options": ["Negativa adiciona 'not' direto no modal (should not / shouldn't); interrogativa inverte o modal para antes do sujeito (Should you update...?), sem usar do/does.", "Usa-se 'don't should' e 'Do you should?'.", "Adiciona-se 'to not' após o verbo.", "Modais não têm forma negativa."], "answer": 0, "explanation": "Verbos modais funcionam como seus próprios auxiliares na negativa e na interrogativa.", "id": "ing_a05_e06"}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "medio", "question": "De acordo com Martin Parrott (citado na Aula 05), os verbos modais dividem-se em 'modais puros' (can, must, should) e 'semimodais' (como have to, ought to). Qual característica distingue 'have to'?", "options": ["'have to' exige a partícula 'to' e flexiona conforme sujeito/tempo (has to, had to), enquanto modais puros são invariáveis e sem 'to'.", "'have to' não expressa obrigação.", "Modais puros sempre usam 'to'.", "Não há diferença gramatical."], "answer": 0, "explanation": "have to flexiona (has to / did you have to?), ao contrário de must/should.", "id": "ing_a05_e07"}, {"subject": "ing", "lessonNum": 5, "lesson": "Aula 05 — Using Modal Verbs", "official": false, "difficulty": "facil", "question": "Qual modal é mais adequado para dar uma recomendação técnica educada em um manual: 'Users _____ back up their files regularly'?", "options": ["should", "mustn't", "may not", "couldn't"], "answer": 0, "explanation": "should expressa conselho/boa prática ('deveriam fazer backup regularmente').", "id": "ing_a05_e08"}, {"id": "ing13", "subject": "ing", "lesson": "Aula 06 — About Phrasal Verbs", "difficulty": "medio", "question": "Em phrasal verbs transitivos separáveis (como \"pick up\"), qual forma está GRAMATICALMENTE CORRETA quando o objeto é um pronome (\"them\")?", "options": ["Can you pick up them?", "Can you pick them up?", "Can you up pick them?", "Ambas \"pick up them\" e \"pick them up\" estão corretas."], "answer": 1, "explanation": "Regra de ouro da Aula 06: quando o objeto de um phrasal verb separável é um pronome (them, it, him, her), ele DEVE ficar obrigatoriamente entre o verbo e a partícula (\"pick them up\").", "official": true, "lessonNum": 6}, {"id": "ing14", "subject": "ing", "lesson": "Aula 06 — About Phrasal Verbs", "difficulty": "medio", "question": "A respeito dos phrasal verbs no trecho: \"It has been possible to opt in to encrypted messages... Meta is choosing to roll out end-to-end encryption\", qual o significado de \"opt in\" e \"roll out\"?", "options": ["opt in = escolher/aderir; roll out = implementar/lançar gradualmente.", "opt in = cancelar; roll out = deletar permanentemente.", "opt in = desligar; roll out = reiniciar o servidor.", "Nenhum dos dois é phrasal verb."], "answer": 0, "explanation": "No questionário da Aula 06: \"opt in\" significa escolher/aderir voluntariamente, e \"roll out\" significa implementar/disponibilizar um recurso ou produto.", "official": true, "lessonNum": 6}, {"id": "ing15", "subject": "ing", "lesson": "Aula 06 — About Phrasal Verbs", "difficulty": "dificil", "question": "Combine corretamente os phrasal verbs com seus significados:\nA) break down | B) call off | C) bring up | D) get along | E) turn up\n1) ter boa relação | 2) cancelar | 3) chegar/aparecer | 4) parar de funcionar por defeito | 5) mencionar um assunto", "options": ["1-A, 2-C, 3-B, 4-D, 5-E", "1-D, 2-B, 3-E, 4-A, 5-C", "1-B, 2-D, 3-C, 4-E, 5-A", "1-E, 2-A, 3-D, 4-C, 5-B"], "answer": 1, "explanation": "get along (D) = dar-se bem; call off (B) = cancelar; turn up (E) = chegar/aparecer; break down (A) = quebrar/parar de funcionar; bring up (C) = puxar/mencionar um assunto.", "official": true, "lessonNum": 6}, {"subject": "ing", "lessonNum": 6, "lesson": "Aula 06 — About Phrasal Verbs", "official": false, "difficulty": "facil", "question": "Como é estruturalmente formado um Phrasal Verb na língua inglesa?", "options": ["Por um verbo principal combinado com um advérbio e/ou uma preposição, frequentemente gerando um novo significado diferente do verbo isolado.", "Por dois substantivos unidos por hífen.", "Por um adjetivo seguido de -ly.", "Por um pronome seguido de ponto de interrogação."], "answer": 0, "explanation": "Ex.: look (olhar) → look for (procurar), look after (cuidar de), look up (consultar em dicionário).", "id": "ing_a06_e01"}, {"subject": "ing", "lessonNum": 6, "lesson": "Aula 06 — About Phrasal Verbs", "official": false, "difficulty": "facil", "question": "Em textos de redes e computação (Aula 06 - Networking FAQs), o que significam respectivamente 'log on', 'log off' e 'set up'?", "options": ["Conectar-se/entrar no sistema, desconectar-se/sair e configurar/instalar.", "Apagar arquivos, imprimir e reiniciar.", "Comprar, vender e alugar.", "Criptografar, compactar e excluir."], "answer": 0, "explanation": "São phrasal verbs essenciais de TI presentes no texto Networking FAQs (Esteras).", "id": "ing_a06_e02"}, {"subject": "ing", "lessonNum": 6, "lesson": "Aula 06 — About Phrasal Verbs", "official": false, "difficulty": "medio", "question": "No texto da Aula 06: 'An open line increases the risk of viruses, and hackers might BREAK INTO your computer to steal confidential data.' O que significa 'break into'?", "options": ["Invadir (entrar sem autorização em um sistema ou computador).", "Consertar o computador.", "Desligar dos estudantes?", "options": ["Retirar ou tirar (os celulares dos estudantes).", "Permitir o uso livre.", "Consertar o aparelho.", "Carregar a bateria."], "answer": 0, "explanation": "Questão oficial do Moodle de Inglês Técnico 2: 'take off' = retirar/tirar.", "id": "ing_a06_e07"}, {"id": "ing16", "subject": "ing", "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "difficulty": "facil", "question": "Complete corretamente as frases técnicas da Aula 07 (impressoras): \"A laser printer is generally _____ (quiet) than an inkjet, and imagesetters produce _____ (high) resolution.\"", "options": ["more quiet / the most high", "quieter / the highest", "quietest / higher", "more quieter / highest than"], "answer": 1, "explanation": "Adjetivos curtos recebem -er no comparativo (quieter than) e the + -est no superlativo (the highest). Adjetivos longos usam more / the most (ex.: more expensive).", "official": true, "lessonNum": 7}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "facil", "question": "Como se forma o comparativo de superioridade de adjetivos CURTOS (1 sílaba, como fast, cheap, quiet) em inglês?", "options": ["Adicionando o sufixo -er ao adjetivo + than (ex.: faster than).", "Colocando 'more' antes do adjetivo (ex.: more fast).", "Adicionando -est ao adjetivo.", "Colocando 'the most' antes."], "answer": 0, "explanation": "Adjetivos curtos recebem -er + than no comparativo (faster than, quieter than).", "id": "ing_a07_e01"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "facil", "question": "Como se forma o comparativo de superioridade de adjetivos LONGOS (2+ sílabas, como expensive, accurate, reliable)?", "options": ["Colocando 'more' antes do adjetivo + than (ex.: more expensive than).", "Adicionando -er (ex.: expensiver).", "Adicionando -est (ex.: accuratest).", "Colocando 'the' antes do adjetivo."], "answer": 0, "explanation": "Adjetivos longos usam more ... than no comparativo e the most ... no superlativo.", "id": "ing_a07_e02"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "facil", "question": "Quais são as formas irregulares de comparativo e superlativo do adjetivo 'good'?", "options": ["better / the best", "gooder / the goodest", "more good / the most good", "worse / the worst"], "answer": 0, "explanation": "good → better → the best; bad → worse → the worst.", "id": "ing_a07_e03"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "facil", "question": "Quais são as formas irregulares de comparativo e superlativo do adjetivo 'bad'?", "options": ["worse / the worst", "badder / the baddest", "less / the least", "better / the best"], "answer": 0, "explanation": "bad é irregular: worse (pior) e the worst (o pior).", "id": "ing_a07_e04"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "medio", "question": "Como se forma o comparativo de um adjetivo terminado em consoante + y, como 'heavy' (pesado) ou 'easy' (fácil)?", "options": ["Troca-se o -y por -ier (heavier, easier).", "Mantém-se o y e adiciona -er (heavyer).", "Usa-se sempre more heavy.", "Remove-se a última letra sem sufixo."], "answer": 0, "explanation": "Exercício da Aula 07: 'An imagesetter is heavier than a laser printer.'", "id": "ing_a07_e05"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "medio", "question": "Como expressar comparativo de igualdade ou desigualdade em inglês (ex.: 'não tão caro quanto')?", "options": ["not as expensive as", "not more expensive as", "not expensive than", "as expensiver as"], "answer": 0, "explanation": "A estrutura de igualdade é as + adjetivo + as (na negativa: not as + adjetivo + as).", "id": "ing_a07_e06"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "facil", "question": "Como se forma o superlativo de adjetivos curtos (ex.: high, fast) e longos (ex.: suitable)?", "options": ["the + adjetivo-est (the highest) e the most + adjetivo (the most suitable).", "more + adjetivo-est.", "adjetivo-er + the.", "very + adjetivo."], "answer": 0, "explanation": "Superlativo destaca o grau extremo em um grupo: the highest, the fastest, the most suitable.", "id": "ing_a07_e07"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "medio", "question": "Complete corretamente a frase técnica da Aula 07: 'Laser printers are generally _____ (accurate) than dot-matrix printers.'", "options": ["more accurate", "accurater", "the most accurate", "accurate than"], "answer": 0, "explanation": "accurate é um adjetivo longo, exigindo 'more accurate' antes de 'than'.", "id": "ing_a07_e08"}, {"subject": "ing", "lessonNum": 7, "lesson": "Aula 07 — Adjectives: Comparatives and Superlatives", "official": false, "difficulty": "medio", "question": "Em um adjetivo curto terminado em CVC (consoante-vogal-consoante tônica) como 'big' ou 'thin', o que acontece ao adicionar -er / -est?", "options": ["Dobra-se a consoante final: bigger / the biggest; thinner / the thinnest.", "Apenas adiciona -er: biger / thiner.", "Troca-se a última letra por i.", "Usa-se more big."], "answer": 0, "explanation": "Regra ortográfica CVC dobra a consoante final antes de -er/-est.", "id": "ing_a07_e09"}, {"id": "ing17", "subject": "ing", "lesson": "Aula 08 — Collocations: English in Use", "difficulty": "facil", "question": "Qual sequência de verbos forma corretamente as collocations técnicas da Aula 08?\n\"Computers help students to ___ mathematical operations, word processors to ___ letters, mobiles to ___ calls, and banks to ___ information and ___ bills.\"", "options": ["perform; write; make; store; pay", "do; draw; say; keep; buy", "make; type; talk; save; give", "run; print; speak; hold; send"], "answer": 0, "explanation": "No texto \"The Digital Age\" (Esteras / IMDTEC): perform operations, write letters, make voice calls, store information e pay bills.", "official": true, "lessonNum": 8}, {"id": "ing18", "subject": "ing", "lesson": "Aula 08 — Collocations: English in Use", "difficulty": "medio", "question": "Qual combinação apresenta APENAS collocations naturais em inglês vistas na Aula 08?", "options": ["access databases, enter a PIN, keep records, transfer money", "do a mistake, make a break, say a presentation, enter money", "catch records, play a database, make a PIN, store calls", "write a call, pay a database, transfer a PIN, give operations"], "answer": 0, "explanation": "As combinações corretas (collocations) extraídas da Aula 08 são: give presentations, keep records, access databases, enter a PIN e transfer money.", "official": true, "lessonNum": 8}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "facil", "question": "O que são 'Collocations' na língua inglesa?", "options": ["Combinações naturais e frequentes de palavras que costumam andar juntas (como 'perform operations' ou 'make a call'), soando naturais aos falantes nativos.", "Erros de tradução literal.", "Apenas siglas de computação.", "Sinônimos de verbos modais."], "answer": 0, "explanation": "Aprender collocations evita traduções literais artificiais e acelera a leitura técnica.", "id": "ing_a08_e01"}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "facil", "question": "Qual verbo combina naturalmente na collocation técnica '_____ the Internet' (acessar a internet) e '_____ databases'?", "options": ["access", "enter", "give", "transfer"], "answer": 0, "explanation": "Texto da Aula 08: 'access the Internet' e 'access databases'.", "id": "ing_a08_e02"}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "facil", "question": "Qual verbo completa corretamente a collocation '_____ a PIN' (digitar/inserir um código PIN)?", "options": ["enter", "give", "keep", "make"], "answer": 0, "explanation": "Exercício da Aula 08: enter a PIN, transfer money, keep records, give presentations.", "id": "ing_a08_e03"}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "medio", "question": "Qual sequência completa corretamente as collocations comuns: '_____ a mistake', '_____ homework', '_____ a break', '_____ a cold'?", "options": ["make; do; have (ou take); catch", "do; make; catch; have", "have; catch; make; do", "catch; do; make; take"], "answer": 0, "explanation": "Collocations clássicas cobradas no Moodle da Aula 08: make a mistake, do homework/exercises, have/take a break, catch a cold.", "id": "ing_a08_e04"}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "medio", "question": "Relacione corretamente as collocations idiomáticas do Moodle da Aula 08:\nI. take a break | II. break the ice | III. catch someone's attention | IV. keep an eye on | V. hit the road", "options": ["I-fazer uma pausa; II-quebrar o gelo/iniciar conversa; III-chamar atenção; IV-ficar de olho em; V-pegar a estrada/partir.", "I-quebrar algo; II-congelar; III-pegar um objeto; IV-fechar os olhos; V-bater no chão.", "Todas significam descansar.", "Apenas I e V existem em inglês."], "answer": 0, "explanation": "Essas cinco expressões são collocations de alta frequência no inglês cotidiano e profissional.", "id": "ing_a08_e05"}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "facil", "question": "No texto da Aula 08 ('The Digital Age'), qual collocation significa 'realizar transações' bancárias?", "options": ["carry out transactions", "do transactions out", "say transactions", "keep transactions"], "answer": 0, "explanation": "carry out transactions / transfer money são expressões fixas do vocabulário técnico-financeiro.", "id": "ing_a08_e06"}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "facil", "question": "Qual collocation da Aula 08 significa 'exibir dados' na tela e 'enviar mensagens de texto'?", "options": ["display data e send texts", "show up data e throw texts", "open data e speak texts", "give data e play texts"], "answer": 0, "explanation": "Lista oficial da Aula 08 (Esteras): display data, send texts, store information, complete exercises.", "id": "ing_a08_e07"}, {"subject": "ing", "lessonNum": 8, "lesson": "Aula 08 — Collocations: English in Use", "official": false, "difficulty": "medio", "question": "Qual verbo combina com 'research' na collocation técnica da Aula 08 ('fazer pesquisa')?", "options": ["do research", "make research", "give research", "enter research"], "answer": 0, "explanation": "Em inglês diz-se 'do research' (nunca 'make research').", "id": "ing_a08_e08"}, {"id": "ing19", "subject": "ing", "lesson": "Aula 09 — Asking Questions", "difficulty": "medio", "question": "Identifique os verbos auxiliares presentes nas perguntas abaixo:\nI. What devices should I use?\nII. When is the Hour of Code?\nIII. Can I still host an event?", "options": ["use - is - host", "should - is - can", "What - When - Can", "devices - is - event"], "answer": 1, "explanation": "Os verbos auxiliares (ou modais atuando como auxiliares na inversão interrogativa) são should (I), is (II) e can (III). \"use\" e \"host\" são os verbos principais.", "official": true, "lessonNum": 9}, {"subject": "ing", "lessonNum": 9, "lesson": "Aula 09 — Asking Questions", "official": false, "difficulty": "facil", "question": "Como se transforma em pergunta a frase afirmativa no Simple Present: 'The Hour of Code takes place each year.'?", "options": ["Usando o auxiliar DOES: 'Does the Hour of Code take place each year?'", "Usando IS: 'Is the Hour of Code takes place?'", "Usando DID: 'Did the Hour of Code takes place?'", "Apenas colocando '?' sem auxiliar."], "answer": 0, "explanation": "No Simple Present (3ª pessoa do singular com verbo principal comum), usa-se o auxiliar 'does' e o verbo principal volta à forma base ('take').", "id": "ing_a09_e01"}, {"subject": "ing", "lessonNum": 9, "lesson": "Aula 09 — Asking Questions", "official": false, "difficulty": "facil", "question": "Qual verbo auxiliar é usado para transformar em pergunta uma frase no Simple Past como 'The Hour of Code started as a one-hour introduction.'?", "options": ["Did ('Did the Hour of Code start...?')", "Does", "Was", "Have"], "answer": 0, "explanation": "No Simple Past de verbos comuns, usa-se 'Did' no início e o verbo principal volta ao infinitivo sem 'to' ('start').", "id": "ing_a09_e02"}, {"subject": "ing", "lessonNum": 9, "lesson": "Aula 09 — Asking Questions", "official": false, "difficulty": "facil", "question": "Qual verbo auxiliar já está presente na frase 'The 2023 Computer Science Education Week will be September 5' e vai para o início na pergunta?", "options": ["will", "do", "does", "did"], "answer": 0, "explanation": "Quando a frase já tem auxiliar (will, can, should, is, are, has), basta invertê-lo para antes do sujeito.", "id": "ing_a09_e03"}, {"subject": "ing", "lessonNum": 9, "lesson": "Aula 09 — Asking Questions", "official": false, "difficulty": "medio", "question": "Na frase 'It has since become a worldwide effort' (Present Perfect), qual palavra atua como verbo auxiliar ao formar uma pergunta?", "options": ["has ('Has it since become...?')", "does", "did", "become"], "answer": 0, "explanation": "No Present Perfect // ============================================================
// 2. STATE & PERSISTENCE
// ============================================================
const STORAGE_STATS_KEY = 'imd_quest_stats_v1';
const STORAGE_PREFS_KEY = 'imd_quest_prefs_v1';

function loadStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

function saveStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    // Ignored safely in restricted environments
  }
}

const defaultStats = {
  history: [],      // [{ date, mode, orderMode, total, correct, score, elapsedSec, bySubject }]
  wrongIds: [],     // array of question IDs missed recently
  seenIds: [],      // array of seen question IDs
  bySubject: {}     // { pe: { correct: 0, total: 0 }, ... }
};

const defaultPrefs = {
  theme: 'paper',   // 'paper' | 'dark'
  fontScale: 1      // 0.9, 1, 1.1, 1.2
};

const state = {
  view: 'config', // 'config' | 'quiz' | 'results' | 'history'
  lastRenderedView: null,
  prefs: Object.assign({}, defaultPrefs, loadStorage(STORAGE_PREFS_KEY, {})),
  stats: Object.assign({}, defaultStats, loadStorage(STORAGE_STATS_KEY, {})),
  config: {
    mode: 'explicado',        // 'rapido' | 'explicado' | 'prova'
    count: 20,                // 10 | 20 | 30 | 40 | 50
    subjects: ['pe', 'fe1', 'fe2', 'poo', 'ing'], // ordered list of selected subject IDs
    orderMode: 'segmentado',  // 'segmentado' | 'mesclado'
    shuffleInsideBlock: false,
    bankFilter: 'all',        // 'all' (700) | 'official' (100)
    lessonFilter: 'all',      // 'all' | 1..15
    difficulty: 'all',        // 'all' | 'facil' | 'medio' | 'dificil'
    prioritizeErrors: false,
    timerMode: 'up'           // 'off' | 'up' | 'down'
  },
  session: null,
  resultsFilter: 'all', // 'all' | 'wrong' | 'correct' | 'flagged'
  showQuickKeyInResults: true,
  chartInstance: null,
  trendChartInstance: null,
  activeSavedSession: null,
  analytics: null,
  dbEngine: 'indexeddb',
  modalCallback: null
};

// ============================================================
// 3. HELPERS
// ============================================================
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

function shuffleArray(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function showToast(msg) {
  const box = document.getElementById('toastBox');
  box.textContent = msg;
  box.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => box.classList.add('hidden'), 3000);
}

function openModal({ title, body, confirmText = 'Confirmar', onConfirm }) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  document.getElementById('modalConfirmBtn').textContent = confirmText;
  state.modalCallback = onConfirm;
  const ov = document.getElementById('modalOverlay');
  ov.classList.remove('hidden');
  ov.classList.add('flex');
}

function closeModal() {
  const ov = document.getElementById('modalOverlay');
  ov.classList.add('hidden');
  ov.classList.remove('flex');
  state.modalCallback = null;
}

function applyPrefs() {
  document.documentElement.setAttribute('data-theme', state.prefs.theme === 'dark' ? 'dark' : 'paper');
  document.documentElement.style.setProperty('--font-scale', String(state.prefs.fontScale));
  const btn = document.getElementById('themeToggleBtn');
  if (btn) {
    btn.innerHTML = state.prefs.theme === 'dark'
      ? '<i data-lucide="sun" class="w-4 h-4"></i>'
      : '<i data-lucide="moon" class="w-4 h-4"></i>';
  }
  saveStorage(STORAGE_PREFS_KEY, state.prefs);
  if (window.lucide) lucide.createIcons();
}

function getPoolForConfig() {
  const { subjects, difficulty, bankFilter, lessonFilter } = state.config;
  return QUESTION_BANK.filter(q => {
    if (!subjects.includes(q.subject)) return false;
    if (bankFilter === 'official' && !q.official) return false;
    if (subjects.length === 1 && lessonFilter !== 'all' && q.lessonNum !== Number(lessonFilter)) return false;
    if (difficulty !== 'all' && q.difficulty !== difficulty) return false;
    return true;
  });
}

function buildQuestionList(customIds = null) {
  if (customIds && customIds.length > 0) {
    const byId = Object.fromEntries(QUESTION_BANK.map(q => [q.id, q]));
    let list = customIds.map(id => byId[id]).filter(Boolean);
    if (state.config.orderMode === 'segmentado') {
      const orderIdx = Object.fromEntries(SUBJECTS.map((s, idx) => [s.id, idx]));
      list.sort((a, b) => (orderIdx[a.subject] - orderIdx[b.subject]));
    } else {
      list = shuffleArray(list);
    }
    return list;
  }

  const { subjects, count, orderMode, shuffleInsideBlock, difficulty, prioritizeErrors, bankFilter, lessonFilter } = state.config;
  const wrongSet = new Set(state.stats.wrongIds || []);
  const seenSet = new Set(state.stats.seenIds || []);

  const scorePriority = (q) => {
    if (!prioritizeErrors) return 0;
    if (wrongSet.has(q.id)) return 2;
    if (!seenSet.has(q.id)) return 1;
    return 0;
  };

  // Group available questions per selected subject in user's chosen order
  const poolsBySubject = subjects.map(subId => {
    let items = QUESTION_BANK.filter(q => q.subject === subId && (bankFilter !== 'official' || q.official) && (subjects.length !== 1 || lessonFilter === 'all' || q.lessonNum === Number(lessonFilter)) && (difficulty === 'all' || q.difficulty === difficulty));
    if (orderMode === 'mesclado' || shuffleInsideBlock) {
      items = shuffleArray(items);
    }
    if (prioritizeErrors) {
      items.sort((a, b) => scorePriority(b) - scorePriority(a));
    }
    return { subId, items };
  }).filter(p => p.items.length > 0);

  const totalAvailable = poolsBySubject.reduce((acc, p) => acc + p.items.length, 0);
  const target = Math.min(count, totalAvailable);
  if (target === 0) return [];

  // Distribute target count evenly across selected subjects
  const allocations = poolsBySubject.map(p => ({ subId: p.subId, items: p.items, take: 0 }));
  let remaining = target;
  while (remaining > 0) {
    let progressed = false;
    for (const a of allocations) {
      if (remaining > 0 && a.take < a.items.length) {
        a.take++;
        remaining--;
        progressed = true;
      }
    }
    if (!progressed) break;
  }

  let selected = [];
  if (orderMode === 'segmentado') {
    for (const a of allocations) {
      const chunk = a.items.slice(0, a.take);
      // Keep chronological/lesson order inside block unless shuffleInsideBlock is true
      selected.push(...chunk);
    }
  } else {
    for (const a of allocations) {
      selected.push(...a.items.slice(0, a.take));
    }
    selected = shuffleArray(selected);
  }
  return selected;
}

// ============================================================
// 4. TIMER MANAGEMENT
// ============================================================
function clearQuizTimer() {
  if (state.session && state.session.timerId) {
    clearInterval(state.session.timerId);
    state.session.timerId = null;
  }
}

function startQuizTimer() {
  clearQuizTimer();
  if (!state.session || state.config.timerMode === 'off') return;
  state.session.timerId = setInterval(() => {
    if (!state.session || state.session.paused || state.session.finished) return;
    state.session.elapsedSec++;
    if (state.config.timerMode === 'down') {
      state.session.remainingSec--;
      if (state.session.remainingSec <= 0) {
        state.session.remainingSec = 0;
        updateTimerDom();
        showToast('Tempo esgotado! Finalizando e corrigindo seu teste.');
        finishSession();
        return;
      }
    }
    updateTimerDom();
  }, 1000);
}

function updateTimerDom() {
  const el = document.getElementById('quizTimerValue');
  if (!el || !state.session) return;
  if (state.config.timerMode === 'down') {
    el.textContent = formatTime(state.session.remainingSec);
    if (state.session.remainingSec <= 60) {
      el.classList.add('text-red-600', 'font-bold');
    }
  } else {
    el.textContent = formatTime(state.session.elapsedSec);
  }
}

// ============================================================
// 5. SESSION FLOW
// ============================================================
function startSession(customIds = null, overrideLabel = null) {
  const questions = buildQuestionList(customIds);
  if (questions.length === 0) {
    showToast('Selecione pelo menos uma matéria com questões disponíveis.');
    return;
  }

  // Compute section metadata for segmented mode
  const sections = [];
  if (state.config.orderMode === 'segmentado') {
    let startIdx = 0;
    while (startIdx < questions.length) {
      const subId = questions[startIdx].subject;
      let endIdx = startIdx;
      while (endIdx + 1 < questions.length && questions[endIdx + 1].subject === subId) {
        endIdx++;
      }
      sections.push({
        subId,
        name: SUBJECT_MAP[subId].name,
        short: SUBJECT_MAP[subId].short,
        start: startIdx,
        end: endIdx,
        count: endIdx - startIdx + 1
      });
      startIdx = endIdx + 1;
    }
  }

  const downMinutes = Math.max(5, Math.round(questions.length * 1.5));
  state.session = {
    label: overrideLabel,
    questions,
    sections,
    currentIndex: 0,
    answers: {},
    flagged: new Set(),
    startedAt: Date.now(),
    elapsedSec: 0,
    remainingSec: downMinutes * 60,
    paused: false,
    timerId: null,
    finished: false,
    drawerOpen: false
  };

  state.view = 'quiz';
  render();
  startQuizTimer();
  persistActiveSessionSnapshot();
}

function persistActiveSessionSnapshot() {
  const s = state.session;
  if (!s || s.finished || !window.IMDQuestDB) return;
  const snapshot = {
    label: s.label,
    questionIds: s.questions.map(q => q.id),
    currentIndex: s.currentIndex,
    answers: s.answers,
    flagged: Array.from(s.flagged),
    elapsedSec: s.elapsedSec,
    remainingSec: s.remainingSec,
    mode: state.config.mode,
    orderMode: state.config.orderMode,
    timerMode: state.config.timerMode,
    savedAt: new Date().toISOString()
  };
  state.activeSavedSession = snapshot;
  window.IMDQuestDB.saveActiveSession(snapshot);
}

function clearActiveSessionSnapshot() {
  state.activeSavedSession = null;
  if (window.IMDQuestDB) {
    window.IMDQuestDB.clearActiveSession();
  }
}

function resumeSavedSession() {
  const snap = state.activeSavedSession;
  if (!snap || !Array.isArray(snap.questionIds) || snap.questionIds.length === 0) return;

  const bankMap = Object.fromEntries(QUESTION_BANK.map(q => [q.id, q]));
  const questions = snap.questionIds.map(id => bankMap[id]).filter(Boolean);
  if (questions.length === 0) {
    clearActiveSessionSnapshot();
    render();
    return;
  }

  if (snap.mode) state.config.mode = snap.mode;
  if (snap.orderMode) state.config.orderMode = snap.orderMode;
  if (snap.timerMode) state.config.timerMode = snap.timerMode;

  const sections = [];
  if (state.config.orderMode === 'segmentado') {
    let startIdx = 0;
    while (startIdx < questions.length) {
      const subId = questions[startIdx].subject;
      let endIdx = startIdx;
      while (endIdx + 1 < questions.length && questions[endIdx + 1].subject === subId) {
        endIdx++;
      }
      sections.push({
        subId,
        name: SUBJECT_MAP[subId].name,
        short: SUBJECT_MAP[subId].short,
        start: startIdx,
        end: endIdx,
        count: endIdx - startIdx + 1
      });
      startIdx = endIdx + 1;
    }
  }

  state.session = {
    label: snap.label || null,
    questions,
    sections,
    currentIndex: Math.min(Number(snap.currentIndex || 0), questions.length - 1),
    answers: Object.assign({}, snap.answers || {}),
    flagged: new Set(snap.flagged || []),
    startedAt: Date.now(),
    elapsedSec: Number(snap.elapsedSec || 0),
    remainingSec: Number(snap.remainingSec || Math.max(5, Math.round(questions.length * 1.5)) * 60),
    paused: false,
    timerId: null,
    finished: false,
    drawerOpen: false
  };

  state.view = 'quiz';
  render();
  startQuizTimer();
}

function selectOption(optionIdx) {
  const s = state.session;
  if (!s || s.finished || s.paused) return;
  const q = s.questions[s.currentIndex];
  const mode = state.config.mode;

  // In rapido & explicado modes, lock once answered
  if ((mode === 'rapido' || mode === 'explicado') && s.answers[q.id] !== undefined) {
    return;
  }
  s.answers[q.id] = optionIdx;
  persistActiveSessionSnapshot();
  render();
}

function finishSession() {
  const s = state.session;
  if (!s || s.finished) return;
  clearQuizTimer();
  s.finished = true;

  // Calculate metrics
  let correct = 0;
  const bySubject = {};
  const byDifficulty = { facil: { correct: 0, total: 0 }, medio: { correct: 0, total: 0 }, dificil: { correct: 0, total: 0 } };
  const byLesson = {};
  const items = [];
  const wrongSet = new Set(state.stats.wrongIds || []);
  const seenSet = new Set(state.stats.seenIds || []);

  for (const q of s.questions) {
    seenSet.add(q.id);
    if (!bySubject[q.subject]) bySubject[q.subject] = { correct: 0, total: 0 };
    bySubject[q.subject].total++;

    if (!state.stats.bySubject[q.subject]) {
      state.stats.bySubject[q.subject] = { correct: 0, total: 0 };
    }
    state.stats.bySubject[q.subject].total++;

    const diff = byDifficulty[q.difficulty] ? q.difficulty : 'medio';
    byDifficulty[diff].total++;

    const lessonKey = `${q.subject}::${q.lesson}`;
    if (!byLesson[lessonKey]) byLesson[lessonKey] = { subject: q.subject, lesson: q.lesson, lessonNum: q.lessonNum, correct: 0, total: 0 };
    byLesson[lessonKey].total++;

    const chosen = s.answers[q.id];
    const isCorrect = chosen === q.answer;
    if (isCorrect) {
      correct++;
      bySubject[q.subject].correct++;
      byDifficulty[diff].correct++;
      byLesson[lessonKey].correct++;
      state.stats.bySubject[q.subject].correct++;
      wrongSet.delete(q.id);
    } else {
      wrongSet.add(q.id);
    }

    items.push({
      qId: q.id,
      subject: q.subject,
      lesson: q.lesson,
      lessonNum: q.lessonNum,
      difficulty: diff,
      chosen: chosen !== undefined ? chosen : null,
      correct: q.answer,
      isCorrect,
      flagged: s.flagged.has(q.id)
    });
  }

  const total = s.questions.length;
  const score = total > 0 ? Number(((correct / total) * 10).toFixed(1)) : 0;
  const accuracy = total > 0 ? Number(((correct / total) * 100).toFixed(1)) : 0;
  const sessionRecord = {
    date: new Date().toISOString(),
    mode: state.config.mode,
    orderMode: state.config.orderMode,
    label: s.label || null,
    total,
    correct,
    score,
    accuracy,
    elapsedSec: s.elapsedSec,
    bySubject,
    byDifficulty,
    byLesson,
    items
  };

  state.stats.wrongIds = Array.from(wrongSet);
  state.stats.seenIds = Array.from(seenSet);
  state.stats.history.unshift(sessionRecord);
  if (state.stats.history.length > 100) state.stats.history.length = 100;
  saveStorage(STORAGE_STATS_KEY, state.stats);

  state.activeSavedSession = null;
  if (window.IMDQuestDB) {
    window.IMDQuestDB.recordSession(sessionRecord).then(async () => {
      state.analytics = await window.IMDQuestDB.getAnalytics();
      if (state.view === 'history') render();
    }).catch(() => {});
  }

  state.resultsFilter = 'all';
  state.view = 'results';
  render();
}

function updateNavActive() {
  const cfgBtn = document.getElementById('navConfigBtn');
  const histBtn = document.getElementById('navHistoryBtn');
  cfgBtn.classList.toggle('bg-accent-soft', state.view === 'config');
  cfgBtn.classList.toggle('border-accent', state.view === 'config');
  histBtn.classList.toggle('bg-accent-soft', state.view === 'history');
  histBtn.classList.toggle('border-accent', state.view === 'history');
}

function render() {
  updateNavActive();
  const main = document.getElementById('appMain');
  const isViewChange = state.lastRenderedView !== state.view;
  state.lastRenderedView = state.view;
  if (state.chartInstance) {
    state.chartInstance.destroy();
    state.chartInstance = null;
  }
  if (state.trendChartInstance) {
    state.trendChartInstance.destroy();
    state.trendChartInstance = null;
  }

  if (state.view === 'config') {
    main.innerHTML = renderConfigView();
    bindConfigEvents();
  } else if (state.view === 'quiz') {
    main.innerHTML = renderQuizView();
    bindQuizEvents();
  } else if (state.view === 'results') {
    main.innerHTML = renderResultsView();
    bindResultsEvents();
    renderResultsChart();
  } else if (state.view === 'history') {
    main.innerHTML = renderHistoryView();
    bindHistoryEvents();
    renderHistoryChart();
  }

  if (!isViewChange && main.firstElementChild) {
    main.firstElementChild.classList.remove('fade-in');
  }

  if (window.lucide) lucide.createIcons();
}
