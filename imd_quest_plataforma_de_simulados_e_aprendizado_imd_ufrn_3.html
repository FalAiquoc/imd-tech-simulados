sson": "Aula 01 — Revisão de JavaScript", "official": false, "difficulty": "facil", "question": "Qual boa prática moderna de declaração de variáveis é recomendada na Aula 01 de Front-end II?", "options": ["Usar const por padrão, let apenas quando a variável precisar ser reatribuída, e evitar var em projetos novos.", "Usar apenas var em todo o projeto.", "Nunca declarar variáveis.", "Usar const apenas para números."], "answer": 0, "explanation": "const e let possuem escopo de bloco e evitam problemas de içamento (hoisting) comuns com var.", "id": "fe2_a01_e04"}, {"subject": "fe2", "lessonNum": 1, "lesson": "Aula 01 — Revisão de JavaScript", "official": false, "difficulty": "facil", "question": "Qual é a diferença entre null e undefined em JavaScript?", "options": ["null é um valor nulo atribuído deliberadamente; undefined indica normalmente uma variável ou propriedade não inicializada.", "Ambos indicam erro de sintaxe.", "undefined representa o número zero.", "null só existe em arrays."], "answer": 0, "explanation": "null expressa ausência intencional de valor; undefined significa que nenhum valor foi atribuído.", "id": "fe2_a01_e05"}, {"subject": "fe2", "lessonNum": 1, "lesson": "Aula 01 — Revisão de JavaScript", "official": false, "difficulty": "medio", "question": "Qual será o resultado das comparações 123 == '123' e 123 === '123', respectivamente?", "options": ["true e false", "false e true", "true e true", "false e false"], "answer": 0, "explanation": "== converte tipos (coerção) retornando true; === exige valor e tipo idênticos, retornando false.", "id": "fe2_a01_e06"}, {"id": "fe2_05", "subject": "fe2", "lesson": "Aula 02 — Funções em JavaScript", "difficulty": "medio", "question": "Analise o trecho de código abaixo. Qual será a saída no console?", "code": "function listaDeCompras(item1 = 'leite', item2 = 'pão', item3 = 'ovos') {\n  console.log('Comprar ' + item1 + ', ' + item2 + ' e ' + item3);\n}\nlistaDeCompras('feijão', 'arroz');", "options": ["Comprar feijão, arroz e undefined", "Comprar feijão, arroz e ovos", "Comprar feijão, arroz e null", "Comprar feijão, pão e ovos"], "answer": 1, "explanation": "Quando um argumento é omitido, o parâmetro assume seu valor padrão (ES6). Assim, item1=\"feijão\", item2=\"arroz\" e item3 mantém \"ovos\".", "official": true, "lessonNum": 2}, {"id": "fe2_06", "subject": "fe2", "lesson": "Aula 02 — Funções em JavaScript", "difficulty": "facil", "question": "Qual é a diferença entre parâmetro e argumento em uma função JavaScript?", "options": ["Parâmetro é a variável declarada na assinatura da função; argumento é o valor real passado quando a função é chamada.", "Não há diferença, são termos sinônimos.", "Parâmetro é o retorno da função; argumento é a entrada.", "Parâmetro só existe em arrow functions; argumento só existe em function."], "answer": 0, "explanation": "Na declaração function soma(a, b), a e b são parâmetros. Na chamada soma(3, 5), 3 e 5 são argumentos.", "official": true, "lessonNum": 2}, {"id": "fe2_07", "subject": "fe2", "lesson": "Aula 02 — Funções em JavaScript", "difficulty": "medio", "question": "Analise a arrow function abaixo. Qual será o retorno de calcularDelta(1, -14, 50)?", "code": "var calcularDelta = (a, b, c) =\u003e {\n  let delta = b*b - 4*a*c;\n  return delta;\n  if (delta \u003c 0) {\n    return 'a equação não possui resultados reais';\n  }\n  return 'a equação possui dois resultados reais';\n};", "options": ["-4 a equação não possui resultados reais", "a equação não possui resultados reais", "-4", "a equação possui dois resultados reais"], "answer": 2, "explanation": "delta = (-14)² - 4×1×50 = 196 - 200 = -4. Como há um return delta; logo antes do if, a função encerra ali e devolve -4; o restante é código inalcançável.", "official": true, "lessonNum": 2}, {"id": "fe2_08", "subject": "fe2", "lesson": "Aula 02 — Funções em JavaScript", "difficulty": "medio", "question": "Observe o código abaixo. Qual alternativa NÃO corresponde a uma chamada válida de adicionarContato?", "code": "function adicionarContato(id, atualizarCallback) {\n  console.log(id);\n  atualizarCallback();\n}\nfunction atualizarListaDeContatos() {\n  console.log('Atualização feita!');\n}", "options": ["adicionarContato(1, () =\u003e console.log('Atualizado!'));", "adicionarContato(1, function() { console.log('Feito!'); });", "adicionarContato(1, atualizarListaDeContatos);", "adicionarContato(1, 'Olá Mundo!');"], "answer": 3, "explanation": "Como o segundo parâmetro é invocado como função (atualizarCallback()), passar a string \"Olá Mundo!\" gera TypeError: atualizarCallback is not a function.", "official": true, "lessonNum": 2}, {"subject": "fe2", "lessonNum": 2, "lesson": "Aula 02 — Funções em JavaScript", "official": false, "difficulty": "facil", "question": "Qual das opções corresponde a uma forma correta de declarar uma função tradicional em JavaScript?", "options": ["def nomeDaFuncao(): {}", "func nomeDaFuncao(): {}", "fun nomeDaFuncao() -\u003e {}", "function nomeDaFuncao() {}"], "answer": 3, "explanation": "Em JS usa-se a palavra-chave function seguida do identificador, parênteses e chaves.", "id": "fe2_a02_e01"}, {"subject": "fe2", "lessonNum": 2, "lesson": "Aula 02 — Funções em JavaScript", "official": false, "difficulty": "facil", "question": "Analise o código abaixo. Qual será a saída ao chamar listaDeCompras('feijão')?", "options": ["Comprar feijão, null e null", "Comprar feijão, pão e ovos", "Comprar feijão, undefined e undefined", "Comprar leite, pão e ovos"], "answer": 1, "explanation": "item1 recebe 'feijão'; item2 e item3 assumem os valores padrão 'pão' e 'ovos'.", "code": "function listaDeCompras(item1 = 'leite', item2 = 'pão', item3 = 'ovos') {\n  console.log('Comprar ' + item1 + ', ' + item2 + ' e ' + item3);\n}\nlistaDeCompras('feijão');", "id": "fe2_a02_e02"}, {"subject": "fe2", "lessonNum": 2, "lesson": "Aula 02 — Funções em JavaScript", "official": false, "difficulty": "facil", "question": "Qual alternativa apresenta uma chamada válida da arrow function var calcularDelta = (a, b, c) =\u003e b*b - 4*a*c;?", "options": ["calcularDelta(1, 12, -13);", "function.calcularDelta(1, 12, -13);", "calcularDelta.function(1, 12, -13);", "call calcularDelta(1, 12, -13);"], "answer": 0, "explanation": "Funções atribuídas a variáveis são invocadas pelo nome da variável seguido dos argumentos entre parênteses.", "id": "fe2_a02_e03"}, {"subject": "fe2", "lessonNum": 2, "lesson": "Aula 02 — Funções em JavaScript", "official": false, "difficulty": "facil", "question": "Qual é a sintaxe reduzida (condensada) válida de uma arrow function com um único parâmetro e retorno implícito?", "options": ["const dobro = n =\u003e n * 2;", "const dobro = (n) -\u003e n * 2;", "const dobro = function =\u003e n * 2;", "const dobro = n =\u003e { n * 2 };"], "answer": 0, "explanation": "Com 1 parâmetro e 1 expressão, podem-se omitir os parênteses, as chaves e a palavra return.", "id": "fe2_a02_e04"}, {"subject": "fe2", "lessonNum": 2, "lesson": "Aula 02 — Funções em JavaScript", "official": false, "difficulty": "medio", "question": "Como se chamam funções que são invocadas dentro de outras funções para quebrar tarefas complexas em etapas menores?", "options": ["Funções auxiliares", "Funções globais", "Construtores", "Métodos destrutivos"], "answer": 0, "explanation": "Funções auxiliares promovem reuso e clareza ao dividir cálculos em passos menores.", "id": "fe2_a02_e05"}, {"subject": "fe2", "lessonNum": 2, "lesson": "Aula 02 — Funções em JavaScript", "official": false, "difficulty": "medio", "question": "Qual característica especial das declarações tradicionais (function ola() {}) permite chamá-las antes da linha onde foram escritas no código?", "options": ["Hoisting (içamento de declaração de função).", "Recursão mútua.", "Coerção de tipos.", "Callback hell."], "answer": 0, "explanation": "Declarações de função são içadas pelo motor JS antes da execução do escopo.", "id": "fe2_a02_e06"}, {"id": "fe2_09", "subject": "fe2", "lesson": "Aula 03 — Arrays em JavaScript", "difficulty": "facil", "question": "Qual par de métodos de Array em JavaScript remove e adiciona elementos no INÍCIO da lista, respectivamente?", "options": ["pop() e push()", "shift() e unshift()", "slice() e splice()", "find() e filter()"], "answer": 1, "explanation": "shift() remove o primeiro elemento do array (e o retorna), enquanto unshift() adiciona um ou mais elementos no início. push()/pop() operam no final.", "official": true, "lessonNum": 3}, {"id": "fe2_10", "subject": "fe2", "lesson": "Aula 03 — Arrays em JavaScript", "difficulty": "medio", "question": "Qual a diferença prática entre os métodos find() e filter() em arrays JavaScript?", "options": ["find() retorna apenas o primeiro elemento que satisfaz a condição; filter() retorna um novo array com todos os elementos que passam no teste.", "filter() modifica o array original; find() cria uma cópia completa.", "find() retorna sempre true ou false; filter() retorna o índice.", "Ambos retornam exatamente o mesmo tipo de dado."], "answer": 0, "explanation": "find() para na primeira ocorrência válida e retorna o valor encontrado (ou undefined). filter() percorre o array inteiro e devolve um novo array com todos os itens aprovados.", "official": true, "lessonNum": 3}, {"id": "fe2_11", "subject": "fe2", "lesson": "Aula 03 — Arrays em JavaScript", "difficulty": "medio", "question": "Sobre os métodos every(), some() e reduce(), qual afirmação está CORRETA?", "options": ["every() exige que ao menos um elemento satisfaça a condição.", "some() retorna true se ao menos um elemento satisfizer a condição, e reduce() agrega os itens em um único valor final.", "reduce() sempre retorna um array com o dobro do tamanho.", "every() e some() retornam o índice do elemento encontrado."], "answer": 1, "explanation": "every() exige que TODOS satisfaçam o critério; some() exige que AO MENOS UM satisfaça; reduce() percorre o array acumulando tudo em um único resultado.", "official": true, "lessonNum": 3}, {"subject": "fe2", "lessonNum": 3, "lesson": "Aula 03 — Arrays em JavaScript", "official": false, "difficulty": "facil", "question": "Arrays em JavaScript podem armazenar diferentes tipos de dados simultaneamente (ex.: ['domingo', 3, true]). Como é chamado esse tipo de array?", "options": ["Array heterogêneo", "Array estático", "Array imutável", "Array tipado"], "answer": 0, "explanation": "Arrays com valores do mesmo tipo são homogêneos; com tipos mistos são heterogêneos.", "id": "fe2_a03_e01"}, {"subject": "fe2", "lessonNum": 3, "lesson": "Aula 03 — Arrays em JavaScript", "official": false, "difficulty": "facil", "question": "Por que os métodos push(), pop(), shift(), unshift() e splice() são chamados de 'métodos destrutivos' na Aula 03?", "options": ["Porque modificam diretamente o array original em que são chamados.", "Porque apagam todo o arquivo JavaScript.", "Porque retornam sempre null.", "Porque removem o navegador da memória."], "answer": 0, "explanation": "Métodos destrutivos (mutáveis) alteram o array original in-place, ao contrário de slice() ou concat().", "id": "fe2_a03_e02"}, {"subject": "fe2", "lessonNum": 3, "lesson": "Aula 03 — Arrays em JavaScript", "official": false, "difficulty": "medio", "question": "Qual será o valor de resultado no código abaixo?", "options": ["['b', 'c', 'd']", "['a', 'b', 'c', 'd']", "['b', 'c', 'd', 'e']", "['c', 'd']"], "answer": 0, "explanation": "slice(1, 4) copia do índice 1 ('b') até o índice 3 ('d'), excluindo o índice final 4 ('e').", "code": "const letras = ['a', 'b', 'c', 'd', 'e', 'f'];\nlet resultado = letras.slice(1, 4);", "id": "fe2_a03_e03"}, {"subject": "fe2", "lessonNum": 3, "lesson": "Aula 03 — Arrays em JavaScript", "official": false, "difficulty": "medio", "question": "No método forEach((elemento, indice) =\u003e { ... }), quais são os dois primeiros parâmetros recebidos pela função de callback?", "options": ["O valor do elemento atual e o seu índice numérico.", "O tamanho do array e o último elemento.", "Apenas o índice e um booleano.", "O nome da variável e o tipo."], "answer": 0, "explanation": "forEach passa (elemento, indice, arrayOriginal) em cada iteração.", "id": "fe2_a03_e04"}, {"subject": "fe2", "lessonNum": 3, "lesson": "Aula 03 — Arrays em JavaScript", "official": false, "difficulty": "medio", "question": "Qual a diferença entre find() e findIndex() em arrays JavaScript?", "options": ["find() retorna o valor do primeiro elemento que satisfaz a condição; findIndex() retorna o índice (posição) dessa primeira ocorrência.", "findIndex() retorna todos os índices em um array.", "find() só busca strings.", "Não existe diferença."], "answer": 0, "explanation": "Ambos param na primeira correspondência: find devolve o elemento, findIndex devolve o índice (ou -1).", "id": "fe2_a03_e05"}, {"subject": "fe2", "lessonNum": 3, "lesson": "Aula 03 — Arrays em JavaScript", "official": false, "difficulty": "dificil", "question": "No encadeamento abaixo (exemplo da Aula 03), qual valor é exibido no console?", "options": ["28.8", "32.0", "27.5", "16.5"], "answer": 0, "explanation": "filter \u003e 15 -\u003e [32, 27.5, 16.5]; desconto 10% -\u003e [28.8, 24.75, 14.85]; reduce(Math.max) -\u003e 28.8.", "code": "const precos = [7.50, 32.00, 12.50, 27.50, 16.50, 9.90];\nconst maior = precos\n  .filter(p =\u003e p \u003e 15)\n  .map(p =\u003e p - 0.1 * p)\n  .reduce((a, b) =\u003e Math.max(a, b));\nconsole.log(maior);", "id": "fe2_a03_e06"}, {"subject": "fe2", "lessonNum": 3, "lesson": "Aula 03 — Arrays em JavaScript", "official": false, "difficulty": "facil", "question": "Qual método ordena os elementos de um array e qual inverte a ordem atual dos elementos?", "options": ["sort() e reverse()", "order() e invert()", "asc() e desc()", "map() e reduce()"], "answer": 0, "explanation": "sort() ordena e reverse() inverte os elementos do array.", "id": "fe2_a03_e07"}, {"id": "fe2_12", "subject": "fe2", "lesson": "Aula 04 — Objetos em JavaScript", "difficulty": "facil", "question": "Sobre objetos declarados com const em JavaScript (ex.: const carro = { cor: \"prata\" }), o que é permitido fazer?", "options": ["Alterar ou remover suas propriedades (ex.: carro.cor = \"branca\" ou delete carro.cor), mas não reatribuir um novo objeto à variável carro.", "Nada pode ser alterado em suas propriedades.", "Reatribuir carro = {} livremente.", "Acessar propriedades apenas com ponto-final, nunca com colchetes."], "answer": 0, "explanation": "Objetos em JS são mutáveis mesmo quando referenciados por const: suas propriedades podem ser editadas/deletadas, mas a variável não pode apontar para outro objeto.", "official": true, "lessonNum": 4}, {"id": "fe2_13", "subject": "fe2", "lesson": "Aula 04 — Objetos em JavaScript", "difficulty": "medio", "question": "Qual método nativo de Object retorna um array contendo pares [chave, valor] de um objeto?", "options": ["Object.keys()", "Object.values()", "Object.entries()", "Object.assign()"], "answer": 2, "explanation": "Object.entries(obj) devolve um array de pares [chave, valor]. keys() devolve só as chaves, values() só os valores, e assign() copia propriedades para um objeto destino.", "official": true, "lessonNum": 4}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "facil", "question": "Quando uma propriedade de um objeto tem espaço no nome (ex.: 'Missão Ativa': true), qual notação é OBRIGATÓRIA para acessá-la?", "options": ["Notação de colchetes: naveEspacial['Missão Ativa']", "Notação ponto-final: naveEspacial.Missão Ativa", "Notação de parênteses: naveEspacial('Missão Ativa')", "Não é possível acessar propriedades com espaço."], "answer": 0, "explanation": "Notação de colchetes permite chaves com espaços, caracteres especiais ou nomes dinâmicos em variáveis.", "id": "fe2_a04_e01"}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "facil", "question": "Qual palavra-chave remove uma propriedade de um objeto JavaScript?", "options": ["delete (ex.: delete naveEspacial.cor;)", "remove", "pop", "unset"], "answer": 0, "explanation": "O operador delete exclui a chave e seu valor do objeto.", "id": "fe2_a04_e02"}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "facil", "question": "Como chamamos uma função armazenada como valor de uma propriedade dentro de um objeto?", "options": ["Método", "Índice", "Evento", "Seletor"], "answer": 0, "explanation": "Propriedades representam o que o objeto tem; métodos representam o que o objeto faz.", "id": "fe2_a04_e03"}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "medio", "question": "Objetos em JavaScript são passados para funções por referência. O que isso implica quando uma função altera uma propriedade do objeto recebido?", "options": ["A alteração modifica permanentemente o objeto original fora da função.", "A função altera apenas uma cópia descartável.", "O JavaScript gera erro de permissão.", "O objeto original é apagado."], "answer": 0, "explanation": "Como a função recebe a referência na memória, mutações nas propriedades refletem no objeto original.", "id": "fe2_a04_e04"}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "facil", "question": "Qual estrutura de repetição foi apresentada na Aula 04 especificamente para iterar pelas chaves (propriedades) de um objeto?", "options": ["for...in", "while...in", "do...keys", "for...obj"], "answer": 0, "explanation": "for (let chave in objeto) percorre todas as chaves enumeráveis do objeto.", "id": "fe2_a04_e05"}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "facil", "question": "Dentro de um método de objeto, qual palavra-chave referencia o próprio objeto no qual o método foi invocado?", "options": ["this", "self", "me", "object"], "answer": 0, "explanation": "this permite acessar outras propriedades e métodos do mesmo objeto.", "id": "fe2_a04_e06"}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "medio", "question": "Quais são as duas convenções para criar e usar funções construtoras de objetos em JavaScript?", "options": ["Nome iniciado com letra maiúscula e execução com o operador new.", "Nome todo em minúsculas e execução sem parênteses.", "Uso obrigatório da palavra class e sem this.", "Retorno explícito de string JSON."], "answer": 0, "explanation": "Ex.: function FabricaDeRobos(modelo) { this.modelo = modelo; } chamada via new FabricaDeRobos('R2D2').", "id": "fe2_a04_e07"}, {"subject": "fe2", "lessonNum": 4, "lesson": "Aula 04 — Objetos em JavaScript", "official": false, "difficulty": "medio", "question": "O que fazem respectivamente Object.keys(obj), Object.values(obj) e Object.assign(alvo, origem)?", "options": ["Retorna array de chaves, retorna array de valores e copia propriedades de um ou mais objetos para o alvo.", "Apaga chaves, ordena valores e congela o objeto.", "Converte para JSON, XML e HTML.", "Cria funções, arrays e strings."], "answer": 0, "explanation": "São os métodos nativos estáticos de Object estudados na Aula 04.", "id": "fe2_a04_e08"}, {"id": "fe2_14", "subject": "fe2", "lesson": "Aula 05 — Manipulação do DOM", "difficulty": "facil", "question": "Qual a diferença entre document.querySelector(\".card\") e document.querySelectorAll(\".card\")?", "options": ["querySelector() retorna apenas o primeiro elemento correspondente ao seletor CSS; querySelectorAll() retorna todos os elementos correspondentes.", "querySelector() aceita apenas IDs; querySelectorAll() aceita apenas tags.", "querySelectorAll() só funciona com jQuery carregado.", "Não há diferença se houver mais de um elemento com a classe .card."], "answer": 0, "explanation": "Ambos aceitam seletores CSS (#id, .classe, tag), mas querySelector() retorna só o primeiro nó encontrado, enquanto querySelectorAll() retorna uma NodeList com todos.", "official": true, "lessonNum": 5}, {"id": "fe2_15", "subject": "fe2", "lesson": "Aula 05 — Manipulação do DOM", "difficulty": "medio", "question": "Na navegação pelo DOM, por que muitas vezes prefere-se usar a propriedade children em vez de childNodes?", "options": ["Porque childNodes inclui nós de texto (como espaços e quebras de linha da indentação), enquanto children retorna somente elementos HTML.", "Porque childNodes foi removido do HTML5.", "Porque children retorna também o elemento pai.", "Porque childNodes só retorna atributos."], "answer": 0, "explanation": "childNodes lista todos os nós filhos (incluindo quebras de linha e tabulações como nós de texto). children filtra e retorna apenas os elementos HTML filhos.", "official": true, "lessonNum": 5}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "facil", "question": "O que significa a sigla DOM e qual objeto global JavaScript representa a raiz da árvore DOM?", "options": ["Document Object Model; objeto document.", "Data Object Module; objeto window.", "Dynamic Output Manager; objeto html.", "Document Order Map; objeto body."], "answer": 0, "explanation": "O DOM representa a página HTML como uma árvore de nós acessível a partir do objeto document.", "id": "fe2_a05_e01"}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "facil", "question": "Qual método do DOM cria dinamicamente um novo elemento HTML em memória (ex.: um \u003cp\u003e ou \u003cli\u003e) antes de inseri-lo na página?", "options": ["document.createElement('p')", "document.newTag('p')", "document.addElement('p')", "document.build('p')"], "answer": 0, "explanation": "createElement cria o nó; depois appendChild ou insertBefore o insere na árvore DOM.", "id": "fe2_a05_e02"}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "medio", "question": "Qual a diferença entre atribuir conteúdo com textContent versus innerHTML?", "options": ["textContent insere apenas texto puro (escapando tags); innerHTML interpreta e renderiza código HTML.", "innerHTML só funciona em \u003cinput\u003e.", "textContent executa scripts automaticamente.", "Não existe diferença."], "answer": 0, "explanation": "Use textContent para texto seguro e innerHTML apenas quando precisar renderizar marcação HTML.", "id": "fe2_a05_e03"}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "facil", "question": "Qual método insere um nó filho recém-criado ao FINAL de um elemento pai no DOM?", "options": ["appendChild()", "pushNode()", "insertEnd()", "addChild()"], "answer": 0, "explanation": "lista.appendChild(novoItem) anexa o elemento como último filho da lista.", "id": "fe2_a05_e04"}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "facil", "question": "Qual propriedade permite acessar o elemento pai de um nó no DOM?", "options": ["parentNode", "upperNode", "rootElement", "father"], "answer": 0, "explanation": "parentNode sobe um nível na árvore DOM; nextElementSibling e previousElementSibling navegam entre irmãos.", "id": "fe2_a05_e05"}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "medio", "question": "Qual método do objeto classList alterna uma classe CSS (adiciona se não existir e remove se já existir)?", "options": ["classList.toggle('hidden')", "classList.switch('hidden')", "classList.flip('hidden')", "classList.change('hidden')"], "answer": 0, "explanation": "classList oferece add(), remove(), toggle() e replace() para manipular classes sem sobrescrever className.", "id": "fe2_a05_e06"}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "facil", "question": "Como alterar a cor de fundo de um elemento div via propriedade style no DOM?", "options": ["div.style.backgroundColor = 'lightgreen';", "div.style.background-color = 'lightgreen';", "div.css.background = 'lightgreen';", "div.backgroundColor = 'lightgreen';"], "answer": 0, "explanation": "No DOM, propriedades CSS compostas usam camelCase (backgroundColor, fontSize) em vez de hífen.", "id": "fe2_a05_e07"}, {"subject": "fe2", "lessonNum": 5, "lesson": "Aula 05 — Manipulação do DOM", "official": false, "difficulty": "medio", "question": "Quais métodos manipulam atributos HTML (como src ou href) diretamente em um elemento do DOM?", "options": ["hasAttribute(), getAttribute(), setAttribute() e removeAttribute()", "attrGet() e attrSet()", "readAttr() e writeAttr()", "prop() e deleteProp()"], "answer": 0, "explanation": "São os quatro métodos nativos padrão para inspecionar e modificar atributos no DOM.", "id": "fe2_a05_e08"}, {"id": "fe2_16", "subject": "fe2", "lesson": "Aula 06 — Eventos", "difficulty": "facil", "question": "Qual a principal vantagem de usar addEventListener(\"click\", fn) em vez de atribuir diretamente botao.onclick = fn?", "options": ["addEventListener() permite associar múltiplas funções ao mesmo evento no mesmo elemento sem sobrescrever as anteriores.", "onclick não funciona em elementos \u003cbutton\u003e.", "addEventListener() dispensa o uso de funções JavaScript.", "onclick só monitora eventos de teclado."], "answer": 0, "explanation": "Enquanto atribuir .onclick novamente substitui o manipulador anterior, addEventListener() permite registrar múltiplos escutadores para o mesmo evento.", "official": true, "lessonNum": 6}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "facil", "question": "Em JavaScript no navegador, o que é um 'evento'?", "options": ["Qualquer interação ou ocorrência registrada pelo navegador (clique, mover mouse, digitar tecla, carregar página, redimensionar janela).", "Apenas erros de sintaxe no console.", "Somente chamadas ao servidor.", "A declaração de uma variável const."], "answer": 0, "explanation": "Eventos permitem que scripts reajam dinamicamente às ações do usuário e ao ciclo de vida da página.", "id": "fe2_a06_e01"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "facil", "question": "Qual a sintaxe correta para registrar um escutador de evento de clique em um botão usando addEventListener?", "options": ["botao.addEventListener('click', minhaFuncao);", "botao.addEventListener('onclick', minhaFuncao());", "botao.listen('click', minhaFuncao);", "addEventListener(botao, 'click');"], "answer": 0, "explanation": "Passa-se o nome do evento SEM o prefixo 'on' ('click') e a referência da função (sem parênteses para não executar na hora).", "id": "fe2_a06_e02"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "medio", "question": "No exemplo 'Brincando com o cursor do mouse' (Aula 06), quais eventos foram usados respectivamente ao mover o mouse, ao tocar no círculo e ao sair do círculo?", "options": ["mousemove, mouseenter e mouseleave", "hover, click e blur", "keydown, keypress e keyup", "drag, drop e scroll"], "answer": 0, "explanation": "mousemove acompanha as coordenadas, mouseenter dispara ao entrar na área do elemento e mouseleave ao sair.", "id": "fe2_a06_e03"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "medio", "question": "No objeto de evento (e) recebido por um listener de mousemove, quais propriedades informam a posição X e Y do cursor na janela?", "options": ["e.clientX e e.clientY", "e.posX e e.posY", "e.mouseH e e.mouseV", "e.width e e.height"], "answer": 0, "explanation": "clientX e clientY fornecem as coordenadas horizontais e verticais do ponteiro relativas à viewport.", "id": "fe2_a06_e04"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "facil", "question": "Qual evento de formulário dispara quando o usuário altera o valor de um campo (como o CEP) e sai do foco?", "options": ["change", "mousemove", "load", "resize"], "answer": 0, "explanation": "No exemplo ViaCEP, campoCEP.addEventListener('change', atualizarEnderecoPeloCEP) dispara a consulta.", "id": "fe2_a06_e05"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "facil", "question": "Qual evento dispara quando um formulário HTML é enviado pelo usuário?", "options": ["submit", "send", "post", "click-form"], "answer": 0, "explanation": "O evento submit é disparado no elemento \u003cform\u003e ao clicar no botão de envio ou pressionar Enter.", "id": "fe2_a06_e06"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "medio", "question": "Qual método do objeto evento (e) impede o comportamento padrão do navegador (como recarregar a página ao submeter um \u003cform\u003e)?", "options": ["e.preventDefault()", "e.stopBrowser()", "e.cancelReload()", "e.blockDefault()"], "answer": 0, "explanation": "e.preventDefault() cancela a ação padrão do elemento, permitindo tratar o envio via JavaScript.", "id": "fe2_a06_e07"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "facil", "question": "Por que NÃO se deve colocar parênteses ao passar uma função callback em botao.addEventListener('click', revelar)?", "options": ["Porque colocar revelar() executaria a função imediatamente no carregamento da página, em vez de aguardar o clique.", "Porque JavaScript proíbe parênteses em funções.", "Porque o botão desapareceria.", "Porque addEventListener exige strings."], "answer": 0, "explanation": "Passamos a referência da função; o navegador é quem a invocará quando o evento acontecer.", "id": "fe2_a06_e08"}, {"subject": "fe2", "lessonNum": 6, "lesson": "Aula 06 — Eventos", "official": false, "difficulty": "medio", "question": "Quais propriedades do objeto window retornam a largura e a altura internas da janela do navegador?", "options": ["window.innerWidth e window.innerHeight", "window.sizeX e window.sizeY", "document.width e document.height", "screen.pageW e screen.pageH"], "answer": 0, "explanation": "window.innerWidth e window.innerHeight foram usadas no cálculo de posição do círculo na Aula 06.", "id": "fe2_a06_e09"}, {"id": "fe2_17", "subject": "fe2", "lesson": "Aula 07 — JSON", "difficulty": "facil", "question": "Quais funções nativas do JavaScript convertem, respectivamente, uma string JSON em objeto JS e um objeto JS em string JSON?", "options": ["JSON.decode() e JSON.encode()", "JSON.parse() e JSON.stringify()", "JSON.toObject() e JSON.toString()", "JSON.read() e JSON.write()"], "answer": 1, "explanation": "JSON.parse(texto) converte uma string no formato JSON em objeto JavaScript; JSON.stringify(objeto) serializa um objeto JS em string JSON.", "official": true, "lessonNum": 7}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "facil", "question": "O que significa a sigla JSON?", "options": ["JavaScript Object Notation", "Java Standard Object Network", "JavaScript Online Navigator", "Joined Server Object Names"], "answer": 0, "explanation": "JSON é um formato leve de troca de dados baseado na notação literal de objetos JavaScript.", "id": "fe2_a07_e01"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "facil", "question": "Qual regra de sintaxe é OBRIGATÓRIA para as chaves (nomes das propriedades) em um texto JSON válido?", "options": ["Devem estar obrigatoriamente delimitadas por aspas duplas (ex.: \"nome\": \"Peter\").", "Devem usar aspas simples.", "Nunca podem ter aspas.", "Devem começar com cifrão ($)."], "answer": 0, "explanation": "Diferente de objetos literais JS, o padrão JSON exige aspas duplas em todas as chaves e strings.", "id": "fe2_a07_e02"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "facil", "question": "No formato JSON, o que delimita objetos e o que delimita arrays (listas)?", "options": ["Chaves { } definem objetos; colchetes [ ] definem arrays.", "Colchetes [ ] definem objetos; parênteses ( ) definem arrays.", "Aspas definem arrays; chaves definem strings.", "Tags \u003cobj\u003e e \u003carr\u003e."], "answer": 0, "explanation": "Pares chave-valor ficam dentro de { } e coleções ordenadas ficam dentro de [ ].", "id": "fe2_a07_e03"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "facil", "question": "O que significa a sigla API no contexto de desenvolvimento web?", "options": ["Application Programming Interface (Interface para Programação de Aplicações)", "Automatic Page Integration", "Asynchronous Protocol Index", "Array Processing Instruction"], "answer": 0, "explanation": "Uma API define regras e endpoints pelos quais um sistema consome dados ou serviços de outro.", "id": "fe2_a07_e04"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "facil", "question": "Qual é o formato mais popular para troca de dados em APIs REST modernas na web?", "options": ["JSON", "BMP", "DOCX", "SWF"], "answer": 0, "explanation": "APIs REST sobre HTTP adotam amplamente o JSON pela leveza e compatibilidade nativa com JavaScript.", "id": "fe2_a07_e05"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "medio", "question": "No exemplo prático da Aula 07 com a API pública ViaCEP, qual URL é consultada para obter o endereço em JSON?", "options": ["https://viacep.com.br/ws/ + cep + /json/", "https://viacep.com.br/cep.html", "ftp://viacep.com.br/json", "http://localhost/cep"], "answer": 0, "explanation": "A requisição GET para viacep.com.br/ws/{cep}/json/ retorna logradouro, bairro, localidade e uf em JSON.", "id": "fe2_a07_e06"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "medio", "question": "O JSON pode ser utilizado apenas em aplicações escritas em JavaScript?", "options": ["Não; apesar de baseado na sintaxe JS, é independente de linguagem e suportado por Python, Java, PHP, C# e outras.", "Sim; apenas navegadores conseguem ler JSON.", "Sim; JSON é exclusivo do Node.js.", "Não, mas só funciona com jQuery."], "answer": 0, "explanation": "JSON é um padrão universal de serialização de dados usado em praticamente todas as linguagens modernas.", "id": "fe2_a07_e07"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "medio", "question": "Qual dos trechos abaixo é um JSON VÁLIDO?", "options": ["{\"cidade\": \"Natal\", \"inicio\": 2016, \"ativo\": true}", "{cidade: 'Natal', inicio: 2016}", "{'cidade': 'Natal', 'ativo': True}", "{\"cidade\": \"Natal\", \"ativo\": true,}"], "answer": 0, "explanation": "JSON válido exige aspas duplas em chaves e strings, booleanos em minúscula (true/false) e sem vírgula sobrando no final.", "id": "fe2_a07_e08"}, {"subject": "fe2", "lessonNum": 7, "lesson": "Aula 07 — JSON", "official": false, "difficulty": "dificil", "question": "Em um JSON contendo \"membros\": [{ \"nome\": \"Homem-Aranha\", \"poderes\": [\"Voo\", \"Agilidade\"] }], como acessar \"Agilidade\" após fazer const obj = JSON.parse(texto)?", "options": ["obj.membros[0].poderes[1]", "obj.membros[1].poderes[2]", "obj['membros'].poderes[1]", "JSON.get(obj, 'Agilidade')"], "answer": 0, "explanation": "membros[0] acessa o primeiro objeto do array e poderes[1] acessa o segundo item ('Agilidade').", "id": "fe2_a07_e09"}, {"id": "fe2_18", "subject": "fe2", "lesson": "Aula 08 — Ajax", "difficulty": "medio", "question": "Quais são os três estados possíveis de uma Promise em JavaScript (base da API Fetch)?", "options": ["Loading, Ready e Closed", "Pending, Fulfilled (resolved) e Rejected", "Open, Sent e Received", "Start, Wait e Error"], "answer": 1, "explanation": "Uma Promise nasce em Pending (pendente) e pode transitar para Fulfilled (resolvida com sucesso → .then()) ou Rejected (rejeitada com erro → .catch()).", "official": true, "lessonNum": 8}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "facil", "question": "O que permite o uso de Ajax em uma página web?", "options": ["Fazer requisições assíncronas ao servidor e atualizar apenas partes da página sem precisar recarregá-la inteira.", "Substituir o HTML por arquivos PDF.", "Executar código sem conexão com a internet.", "Criar estilos CSS automaticamente."], "answer": 0, "explanation": "Ajax combina JS, DOM, HTTP assíncrono e JSON/XML para atualizar a interface parcialmente sem reload completo.", "id": "fe2_a08_e01"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "facil", "question": "Qual objeto nativo clássico do JavaScript tornou possível as requisições Ajax assíncronas?", "options": ["XMLHttpRequest", "HttpServer", "AjaxLoader", "AsyncDOM"], "answer": 0, "explanation": "XMLHttpRequest (XHR) cria, abre (open) e envia (send) requisições HTTP assíncronas no navegador.", "id": "fe2_a08_e02"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "medio", "question": "No método requisicao.open('GET', url, true) do XMLHttpRequest, o que significa o terceiro argumento (true)?", "options": ["Indica que a requisição será assíncrona (não trava nem recarrega a página).", "Indica que a resposta será criptografada.", "Ativa o modo cache obrigatório.", "Transforma GET em POST."], "answer": 0, "explanation": "true = assíncrono (padrão); false = síncrono (bloqueante).", "id": "fe2_a08_e03"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "facil", "question": "Qual evento do objeto XMLHttpRequest é disparado quando a resposta do servidor é concluída com sucesso?", "options": ["onload", "onclick", "onsend", "onstart"], "answer": 0, "explanation": "requisicao.onload recebe a função manipuladora que lê requisicao.responseText.", "id": "fe2_a08_e04"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "medio", "question": "Qual problema clássico de legibilidade em código assíncrono com muitos callbacks aninhados em formato piramidal a API Fetch ajuda a evitar?", "options": ["Callback hell", "Stack overflow", "Box model", "Hoisting"], "answer": 0, "explanation": "Fetch utiliza Promises (.then/.catch), substituindo pirâmides de callbacks aninhados por encadeamento limpo.", "id": "fe2_a08_e05"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "facil", "question": "Na criação de uma Promise (new Promise((resolve, reject) =\u003e {...})), qual função é chamada em caso de sucesso e qual em caso de falha?", "options": ["resolve(resultado) para sucesso e reject(erro) para falha.", "ok() para sucesso e fail() para falha.", "return() para sucesso e break() para falha.", "then() para sucesso e try() para falha."], "answer": 0, "explanation": "resolve() leva a Promise ao estado Fulfilled (.then); reject() leva a Rejected (.catch).", "id": "fe2_a08_e06"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "medio", "question": "Na API Fetch, qual método da resposta (response) converte o corpo recebido em objeto JavaScript (também retornando uma Promise)?", "options": ["response.json()", "response.parse()", "response.toObj()", "response.xml()"], "answer": 0, "explanation": "fetch(url).then(res =\u003e res.json()).then(data =\u003e ...) lê e converte o JSON da resposta.", "id": "fe2_a08_e07"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "medio", "question": "Para autenticar uma requisição XMLHttpRequest com chave de API (como na Pexels API da Aula 08), qual método adiciona um cabeçalho HTTP?", "options": ["requisicao.setRequestHeader('Authorization', chave_api);", "requisicao.addKey(chave_api);", "requisicao.openHeader('Auth', chave_api);", "requisicao.sendHeader(chave_api);"], "answer": 0, "explanation": "setRequestHeader(nome, valor) define cabeçalhos HTTP antes de chamar send().", "id": "fe2_a08_e08"}, {"subject": "fe2", "lessonNum": 8, "lesson": "Aula 08 — Ajax", "official": false, "difficulty": "facil", "question": "Em uma cadeia de Promises, qual método captura erros caso a requisição falhe ou seja rejeitada?", "options": [".catch()", ".finallyOnly()", ".error()", ".stop()"], "answer": 0, "explanation": ".then() trata sucesso e .catch() trata rejeições/exceções da cadeia.", "id": "fe2_a08_e09"}, {"id": "fe2_19", "subject": "fe2", "lesson": "Aula 09 — Introdução ao jQuery", "difficulty": "facil", "question": "No jQuery, para que serve envolver o código em $(document).ready(function() { ... }), e qual a diferença entre empty() e remove()?", "options": ["Garante que o script só execute após o DOM carregar; empty() remove apenas os filhos/conteúdo, enquanto remove() exclui o próprio elemento selecionado e seus filhos.", "Carrega o Bootstrap; empty() e remove() fazem exatamente a mesma coisa.", "Envia requisições POST; remove() limpa apenas atributos CSS.", "Pausa animações; empty() apaga o arquivo HTML inteiro."], "answer": 0, "explanation": "$(document).ready() evita manipular elementos antes de existirem no DOM. empty() esvazia o conteúdo interno mantendo o elemento pai; remove() apaga o elemento inteiro.", "official": true, "lessonNum": 9}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "facil", "question": "O que é o jQuery?", "options": ["Uma biblioteca de funções JavaScript que simplifica manipulação do DOM, eventos, animações e Ajax no navegador.", "Uma nova linguagem de programação compilada.", "Um banco de dados relacional.", "Um framework exclusivo de CSS sem JavaScript."], "answer": 0, "explanation": "jQuery é uma biblioteca .js que encapsula operações comuns de front-end com sintaxe concisa.", "id": "fe2_a09_e01"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "facil", "question": "Qual símbolo atua como função construtora principal do jQuery para selecionar elementos usando seletores CSS?", "options": ["$()", "@()", "#()", "&()"], "answer": 0, "explanation": "$('p'), $('#id') e $('.classe') selecionam elementos no jQuery.", "id": "fe2_a09_e02"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "facil", "question": "Qual seletor jQuery seleciona todos os elementos HTML que possuem a classe 'exemplo'?", "options": ["$(\".exemplo\")", "$(\"#exemplo\")", "$(\"exemplo\")", "$(\"*exemplo\")"], "answer": 0, "explanation": "Assim como no CSS, ponto (.) seleciona classe e # seleciona ID.", "id": "fe2_a09_e03"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "medio", "question": "O que seleciona o seletor jQuery $(\"[type='text']\")?", "options": ["Qualquer elemento HTML cujo atributo type tenha valor igual a 'text'.", "Apenas parágrafos com a palavra text.", "Todos os elementos com classe text.", "Apenas o primeiro input da página."], "answer": 0, "explanation": "Seletores de atributo entre colchetes filtram elementos por atributo e valor exato.", "id": "fe2_a09_e04"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "facil", "question": "Qual método jQuery permite anexar múltiplos manipuladores de eventos diferentes (como mouseenter, mouseleave e click) de uma só vez?", "options": [".on({ ... })", ".multi()", ".events()", ".bindAll()"], "answer": 0, "explanation": "$('p').on({ mouseenter: fn1, mouseleave: fn2, click: fn3 }) registra vários eventos em um único objeto.", "id": "fe2_a09_e05"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "facil", "question": "Como incluir a biblioteca jQuery em uma página HTML?", "options": ["Baixando localmente (\u003cscript src='jquery.min.js'\u003e) ou carregando via CDN remoto (ex.: Google CDN).", "Apenas via \u003clink rel='stylesheet'\u003e.", "Não precisa incluir, todo navegador já vem com $() nativo.", "Somente dentro de um arquivo .json."], "answer": 0, "explanation": "jQuery é um arquivo JavaScript externo que deve ser carregado via tag \u003cscript\u003e antes do seu script principal.", "id": "fe2_a09_e06"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "medio", "question": "Dentro de um manipulador de evento jQuery (ex.: $('p').click(function() { $(this).css(...); })), a que se refere $(this)?", "options": ["Ao elemento específico que disparou o evento, encapsulado como objeto jQuery.", "Sempre ao elemento \u003cbody\u003e inteiro.", "Ao arquivo CSS externo.", "A todos os parágrafos da página simultaneamente."], "answer": 0, "explanation": "$(this) permite aplicar métodos jQuery apenas no elemento clicado/interagido.", "id": "fe2_a09_e07"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "facil", "question": "O que seleciona o seletor universal $(\"*\") no jQuery?", "options": ["Todos os elementos do DOM.", "Apenas elementos ocultos.", "Apenas links.", "Nenhum elemento."], "answer": 0, "explanation": "Assim como no CSS, * seleciona todos os elementos.", "id": "fe2_a09_e08"}, {"subject": "fe2", "lessonNum": 9, "lesson": "Aula 09 — Introdução ao jQuery", "official": false, "difficulty": "medio", "question": "Qual expressão JavaScript nativa é equivalente ao seletor jQuery $('.classe')?", "options": ["document.querySelectorAll('.classe')", "getElementById para classe", "document.createElement('.classe')", "window.select('.classe')"], "answer": 0, "explanation": "querySelectorAll aceita qualquer seletor CSS e retorna todos os elementos correspondentes.", "id": "fe2_a09_e09"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "facil", "question": "Quais métodos do jQuery escondem, exibem e alternam a visibilidade de um elemento HTML?", "options": ["hide(), show() e toggle()", "off(), on() e switch()", "close(), open() e flip()", "invisible(), visible() e swap()"], "answer": 0, "explanation": "hide() oculta, show() exibe e toggle() alterna automaticamente entre os dois estados.", "id": "fe2_a10_e01"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "facil", "question": "Quais parâmetros de velocidade são aceitos por efeitos jQuery como hide(), fadeOut() e slideUp()?", "options": ["'fast', 'slow' ou um número em milissegundos (ex.: 2000).", "Apenas 'devagar' em português.", "Somente porcentagens como '50%'.", "Não aceitam parâmetros de velocidade."], "answer": 0, "explanation": "Efeitos jQuery aceitam 'fast', 'slow' ou duração numérica em milissegundos.", "id": "fe2_a10_e02"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "facil", "question": "Como funcionam os efeitos fadeIn() e fadeOut() do jQuery?", "options": ["Exibem ou escondem elementos alterando gradualmente sua opacidade (transparência).", "Deslizam o elemento para fora da tela pela esquerda.", "Mudam a cor do texto para branco.", "Removem o elemento permanentemente do DOM."], "answer": 0, "explanation": "Fading atua na propriedade opacity até aparecer ou sumir suavemente.", "id": "fe2_a10_e03"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "facil", "question": "Quais métodos produzem o efeito de deslizamento vertical (abrir/fechar sanfona) no jQuery?", "options": ["slideUp(), slideDown() e slideToggle()", "moveUp(), moveDown() e moveToggle()", "scrollUp() e scrollDown()", "dropUp() e dropDown()"], "answer": 0, "explanation": "slideToggle() foi inclusive usado nos menus laterais do blog dinâmico na Aula 15.", "id": "fe2_a10_e04"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "medio", "question": "Para que serve o método .animate({ width: '300px', opacity: 0.5 }, 'slow') no jQuery?", "options": ["Criar animações customizadas transicionando gradualmente propriedades CSS numéricas do elemento.", "Reproduzir arquivos de vídeo MP4.", "Carregar dados de uma API REST.", "Mudar o título da aba."], "answer": 0, "explanation": "animate() anima gradualmente propriedades CSS especificadas em um objeto.", "id": "fe2_a10_e05"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "medio", "question": "O que acontece quando chamamos .animate() várias vezes seguidas no mesmo elemento jQuery?", "options": ["As animações entram em fila (queue) e são executadas sequencialmente, uma após a outra.", "Apenas a última animação roda e as outras são ignoradas.", "O navegador gera erro de sintaxe.", "Todas terminam instantaneamente em 0ms."], "answer": 0, "explanation": "O jQuery enfileira automaticamente chamadas consecutivas de animate() no mesmo elemento.", "id": "fe2_a10_e06"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "facil", "question": "Qual método jQuery interrompe imediatamente uma animação ou efeito em andamento antes do seu término?", "options": [".stop()", ".pause()", ".cancel()", ".break()"], "answer": 0, "explanation": "$('.box').stop() interrompe animações de fading, sliding ou animate().", "id": "fe2_a10_e07"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "medio", "question": "Por que passamos uma função de callback como último argumento em efeitos como $('.box').animate({...}, 5000, callback)?", "options": ["Porque o JS continua executando a próxima linha imediatamente; o callback garante que um código só rode APÓS a animação terminar.", "Porque sem callback a animação não inicia.", "Para cancelar a animação no meio.", "Para repetir a animação infinitamente."], "answer": 0, "explanation": "Animações são assíncronas; o callback sincroniza ações pós-animação.", "id": "fe2_a10_e08"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "facil", "question": "O que faz o método fadeTo('slow', 0.4) no jQuery?", "options": ["Altera gradualmente a opacidade do elemento até um nível específico (neste caso, 0.4), sem escondê-lo completamente.", "Oculta o elemento com display: none.", "Move o elemento para a posição 0.4px.", "Aumenta a fonte em 40%."], "answer": 0, "explanation": "fadeTo permite parar em qualquer opacidade intermediária entre 0 e 1.", "id": "fe2_a10_e09"}, {"subject": "fe2", "lessonNum": 10, "lesson": "Aula 10 — Efeitos com jQuery", "official": false, "difficulty": "medio", "question": "Se um elemento está atualmente visível na tela e o usuário clica em um botão que executa $('p').toggle(), o que ocorre?", "options": ["toggle() atua como hide() e esconde o elemento.", "toggle() atua como show() e duplica o elemento.", "Nada acontece.", "O elemento muda de cor."], "answer": 0, "explanation": "toggle() inverte o estado atual: visível → oculto; oculto → visível.", "id": "fe2_a10_e10"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "facil", "question": "No jQuery, qual a diferença entre chamar text(), html(), val() ou attr('href') SEM argumento versus COM argumento?", "options": ["Sem argumento funcionam como getters (leitura); com argumento funcionam como setters (atribuição/escrita).", "Sem argumento apagam o elemento.", "Com argumento retornam sempre true.", "Esses métodos só servem para leitura."], "answer": 0, "explanation": "Esse padrão unificado getter/setter é uma das marcas registradas da API do jQuery.", "id": "fe2_a11_e01"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "facil", "question": "Qual método jQuery é usado para ler ou definir o valor atual de campos de formulário como \u003cinput\u003e, \u003cselect\u003e e \u003ctextarea\u003e?", "options": [".val()", ".text()", ".html()", ".input()"], "answer": 0, "explanation": "$('textarea').val() lê o valor; $('textarea').val('Fulano') define o valor.", "id": "fe2_a11_e02"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "facil", "question": "Qual método jQuery lê ou altera um atributo HTML (como o href de um link \u003ca\u003e ou o src de uma \u003cimg\u003e)?", "options": [".attr()", ".propOnly()", ".href()", ".tag()"], "answer": 0, "explanation": "$('a').attr('href') lê o link; $('a').attr('href', 'https://imd.ufrn.br') altera o link.", "id": "fe2_a11_e03"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "medio", "question": "Qual a diferença entre os métodos jQuery append() e prepend()?", "options": ["append() insere conteúdo no FINAL dentro do elemento selecionado; prepend() insere no INÍCIO dentro do elemento.", "append() insere fora do elemento; prepend() remove o elemento.", "prepend() só funciona em tabelas.", "Ambos inserem exatamente no mesmo lugar."], "answer": 0, "explanation": "Ambos inserem dentro do elemento alvo: prepend no começo e append no fim.", "id": "fe2_a11_e04"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "medio", "question": "Qual a diferença entre append()/prepend() e before()/after() no jQuery?", "options": ["append/prepend inserem DENTRO do elemento selecionado; before/after inserem FORA (como irmãos imediatamente antes ou depois).", "before/after só funcionam com CSS.", "Não há diferença.", "after() apaga o elemento anterior."], "answer": 0, "explanation": "before() coloca conteúdo antes da tag de abertura e after() depois da tag de fechamento.", "id": "fe2_a11_e05"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "medio", "question": "O que fazem respectivamente os métodos wrap() e unwrap() no jQuery?", "options": ["wrap() envolve o elemento selecionado com uma nova tag pai (ex.: \u003cstrong\u003e); unwrap() remove o elemento pai do selecionado.", "wrap() quebra linhas de texto; unwrap() junta linhas.", "unwrap() apaga o texto interno.", "wrap() altera a largura da tela."], "answer": 0, "explanation": "$('#principal').wrap('\u003cstrong\u003e\u003c/strong\u003e') envolve o elemento; $('p').unwrap() remove o pai.", "id": "fe2_a11_e06"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "facil", "question": "Qual método jQuery remove um atributo específico (como href) de um elemento selecionado?", "options": [".removeAttr('href')", ".deleteAttr('href')", ".clear('href')", ".empty('href')"], "answer": 0, "explanation": "$('a').removeAttr('href') exclui o atributo href das tags \u003ca\u003e.", "id": "fe2_a11_e07"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "facil", "question": "Quais métodos jQuery adicionam, removem e alternam classes CSS em elementos selecionados?", "options": ["addClass(), removeClass() e toggleClass()", "classAdd(), classDel() e classSwap()", "pushClass() e popClass()", "setStyle() e delStyle()"], "answer": 0, "explanation": "Esses três métodos permitem manipular uma ou múltiplas classes separadas por espaço.", "id": "fe2_a11_e08"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "medio", "question": "Como definir múltiplas propriedades CSS de uma só vez usando o método .css() do jQuery?", "options": ["Passando um objeto: $('.box').css({ 'border-color': 'red', 'border-radius': '20px' });", "Passando um array de números.", "Chamando .css() sem argumentos.", "Não é possível definir mais de uma propriedade."], "answer": 0, "explanation": "O método css() aceita ('prop', 'val') para uma propriedade ou um objeto { prop1: val1, prop2: val2 } para várias.", "id": "fe2_a11_e09"}, {"subject": "fe2", "lessonNum": 11, "lesson": "Aula 11 — Manipulação do DOM com jQuery", "official": false, "difficulty": "facil", "question": "Qual a diferença entre $('#p1').text() e $('#p1').html() ao ler conteúdo?", "options": ["text() retorna apenas o texto puro sem tags; html() retorna o conteúdo incluindo as tags HTML internas.", "html() retorna apenas números.", "text() apaga as tags do DOM.", "São idênticos em qualquer situação."], "answer": 0, "explanation": "html() preserva marcações como \u003cstrong\u003e; text() devolve somente os caracteres de texto.", "id": "fe2_a11_e10"}, {"id": "fe2_20", "subject": "fe2", "lesson": "Aula 12 — Ajax com jQuery", "difficulty": "medio", "question": "Quais métodos do jQuery simplificam requisições Ajax para carregar HTML direto em um elemento, requisitar JSON e enviar dados via HTTP POST?", "options": ["$.fetch(), $.xml() e $.send()", "load(), $.getJSON() (ou $.get()) e $.post()", "$.html(), $.parse() e $.submit()", "$.ready(), $.on() e $.animate()"], "answer": 1, "explanation": "Na Aula 12 e 14 de Front-end II, o jQuery abstrai o Ajax com $(\"#box\").load(), $.get() / $.getJSON() para leitura assíncrona e $.post() para envio de dados.", "official": true, "lessonNum": 12}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "facil", "question": "Por que o jQuery facilita o uso de Ajax em relação ao XMLHttpRequest puro?", "options": ["Abstrai diferenças entre navegadores e oferece métodos curtos e diretos como load(), $.get(), $.post() e $.getJSON().", "Elimina o uso do protocolo HTTP.", "Permite acessar o servidor sem URL.", "Substitui o navegador por um compilador."], "answer": 0, "explanation": "Os utilitários Ajax do jQuery reduzem drasticamente o código repetitivo do XHR.", "id": "fe2_a12_e01"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "facil", "question": "O que faz o método $('#box').load('conteudo-load.html') no jQuery?", "options": ["Busca o arquivo HTML do servidor de forma assíncrona e injeta o resultado diretamente dentro do elemento #box.", "Redireciona o navegador para outra página.", "Faz upload de um arquivo local.", "Esconde o elemento #box."], "answer": 0, "explanation": "load() é a maneira mais simples no jQuery de carregar um fragmento HTML remoto em um contêiner.", "id": "fe2_a12_e02"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "facil", "question": "Qual a diferença de uso entre $.get() e $.post() no jQuery?", "options": ["$.get() é usado para requisitar/buscar dados do servidor; $.post() é usado quando precisamos enviar dados no corpo da requisição.", "$.post() só lê arquivos CSS.", "$.get() nunca aceita função de callback.", "Ambos usam o mesmo método HTTP."], "answer": 0, "explanation": "Seguem a semântica HTTP: GET para consulta e POST para envio/submissão de dados.", "id": "fe2_a12_e03"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "medio", "question": "Na chamada $.get(url, function(resposta, status) { ... }), o que representam os dois parâmetros do callback?", "options": ["resposta contém os dados retornados pelo servidor; status indica o estado da requisição (ex.: 'success').", "resposta é o código HTML da página inteira; status é o tamanho em bytes.", "Ambos são números inteiros.", "resposta é o cabeçalho e status é a URL."], "answer": 0, "explanation": "O callback de $.get e $.post recebe os dados retornados e a string de status.", "id": "fe2_a12_e04"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "medio", "question": "No método $.post(url, dados, callback), o que deve ser passado no segundo parâmetro (dados)?", "options": ["Um objeto JavaScript (ex.: { nome: 'Thomas', cidade: 'Londres' }) contendo os dados a enviar ao servidor.", "Apenas um número booleano.", "O nome de uma classe CSS.", "Um elemento HTML completo."], "answer": 0, "explanation": "O segundo argumento de $.post() carrega o payload de dados enviados no corpo da requisição POST.", "id": "fe2_a12_e05"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "facil", "question": "Qual método específico do jQuery faz uma requisição GET esperando e convertendo automaticamente uma resposta em formato JSON?", "options": ["$.getJSON(url, callback)", "$.loadJSON()", "$.fetchXML()", "$.parseGet()"], "answer": 0, "explanation": "$.getJSON() já entrega o objeto JavaScript pronto no callback, sem precisar chamar JSON.parse().", "id": "fe2_a12_e06"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "facil", "question": "Requisições feitas com $.get(), $.post() e load() recarregam a página inteira no navegador?", "options": ["Não; são requisições Ajax assíncronas executadas em segundo plano.", "Sim, sempre recarregam a aba.", "Apenas $.post() recarrega a página.", "Apenas load() não recarrega."], "answer": 0, "explanation": "Todas essas funções são wrappers assíncronos de Ajax.", "id": "fe2_a12_e07"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "medio", "question": "No exemplo da Aula 12, o que faz $('#filme').text(resposta.Title); dentro do callback de $.get()?", "options": ["Atualiza o texto do elemento com ID 'filme' usando a propriedade Title vinda da resposta JSON do servidor.", "Envia o texto de #filme para o servidor.", "Cria uma nova página chamada filme.html.", "Remove o elemento #filme."], "answer": 0, "explanation": "Integra a resposta assíncrona diretamente à atualização parcial do DOM.", "id": "fe2_a12_e08"}, {"subject": "fe2", "lessonNum": 12, "lesson": "Aula 12 — Ajax com jQuery", "official": false, "difficulty": "medio", "question": "Em qual momento a função callback de $.get(url, callback) é executada?", "options": ["Somente depois que o servidor responde com sucesso à requisição assíncrona.", "Antes de a requisição sair do navegador.", "Apenas quando o usuário fecha a página.", "A cada 1 segundo em loop infinito."], "answer": 0, "explanation": "Como o Ajax é assíncrono, o callback aguarda o retorno bem-sucedido do servidor.", "id": "fe2_a12_e09"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "facil", "question": "No projeto final 'Blog Dinâmico' (Aulas 13–15), qual é o ponto de partida da metodologia?", "options": ["Partir do layout estático HTML/CSS/Bootstrap criado em Front-end I e torná-lo dinâmico com JS, DOM, Ajax, JSON e jQuery.", "Apagar todo o HTML e programar tudo em C.", "Criar um aplicativo mobile nativo em Swift.", "Usar apenas tabelas HTML sem CSS."], "answer": 0, "explanation": "O projeto evolui o blog estático do curso anterior conectando-o a uma API REST real.", "id": "fe2_a13_e01"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "facil", "question": "Na estrutura de diretórios do projeto do Blog Dinâmico (Aula 13), onde ficam os scripts JS próprios da aplicação e onde ficam Bootstrap e jQuery?", "options": ["Scripts próprios em js/ (ex.: js/main.js); bibliotecas externas em vendor/ (vendor/bootstrap e vendor/jquery).", "Tudo solto em uma única pasta imgs/.", "Scripts em css/ e estilos em js/.", "Em um arquivo .docx."], "answer": 0, "explanation": "Separar css/, imgs/, js/ e vendor/ mantém o projeto limpo e organizado.", "id": "fe2_a13_e02"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "facil", "question": "Como o arquivo js/main.js é vinculado ao index.html do blog?", "options": ["\u003cscript src=\"js/main.js\"\u003e\u003c/script\u003e", "\u003clink href=\"js/main.js\"\u003e", "\u003cjs src=\"js/main.js\"\u003e", "\u003cinclude file=\"js/main.js\"\u003e"], "answer": 0, "explanation": "A tag \u003cscript src='js/main.js'\u003e\u003c/script\u003e é posicionada ao final do \u003cbody\u003e após jQuery e Bootstrap.", "id": "fe2_a13_e03"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "medio", "question": "Por que as tags \u003cscript\u003e de vendor/jquery e vendor/bootstrap devem aparecer ANTES de \u003cscript src='js/main.js'\u003e no final do \u003cbody\u003e?", "options": ["Porque main.js depende de funções do jQuery ($); se carregar antes, ocorre erro '$ is not defined'.", "Porque o HTML só permite 1 script por página.", "A ordem das tags \u003cscript\u003e não faz diferença.", "Para que o CSS carregue por último."], "answer": 0, "explanation": "Bibliotecas dependentes precisam estar carregadas antes dos scripts que as consomem.", "id": "fe2_a13_e04"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "facil", "question": "Quais duas páginas HTML principais compõem a estrutura do Blog Dinâmico?", "options": ["index.html (página inicial com lista de resumos) e post.html (página interna de leitura completa da postagem).", "login.html e admin.html.", "home.php e db.sql.", "Apenas um arquivo index.txt."], "answer": 0, "explanation": "index.html lista as postagens e redireciona para post.html?id=... ao clicar em 'Leia Mais'.", "id": "fe2_a13_e05"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "facil", "question": "Qual é a primeira das 8 etapas planejadas na Aula 13 para transformar o blog estático em dinâmico?", "options": ["Conhecer a API REST de consulta de postagens.", "Publicar na loja de aplicativos.", "Desinstalar o Bootstrap.", "Remover todas as imagens."], "answer": 0, "explanation": "Entender os endpoints e o formato JSON da API orienta toda a manipulação de DOM posterior.", "id": "fe2_a13_e06"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "medio", "question": "Qual papel desempenha a pasta css/blog.css no projeto base?", "options": ["Armazenar estilos customizados do blog que complementam os estilos padrão do Bootstrap.", "Substituir o arquivo main.js.", "Guardar as imagens dos autores.", "Armazenar os dados JSON das postagens."], "answer": 0, "explanation": "blog.css ajusta espaçamentos, barra fixa e estilos específicos acima do Bootstrap.", "id": "fe2_a13_e07"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "facil", "question": "Quais tecnologias principais são integradas nas Aulas 13–15 para tornar o blog dinâmico?", "options": ["JavaScript, DOM, Ajax, JSON e jQuery (sobre HTML/CSS/Bootstrap).", "Apenas Flash e XML.", "Python e SQLite no navegador.", "Apenas CSS puro sem scripts."], "answer": 0, "explanation": "O projeto consolida todo o conteúdo prático de Desenvolvimento Front-end II.", "id": "fe2_a13_e08"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "medio", "question": "Na Aula 13, qual é a vantagem de baixar o projeto base por repositório GitHub ou arquivo .zip e explorar a árvore de diretórios antes de codificar?", "options": ["Compreender onde estão HTML, CSS, imagens e bibliotecas (vendor) para referenciar caminhos corretamente sem quebrar links.", "Aumentar o tamanho dos arquivos.", "Evitar escrever qualquer JavaScript.", "Renomear index.html para main.css."], "answer": 0, "explanation": "Conhecer a estrutura de pastas evita erros de caminho 404 ao carregar scripts e imagens.", "id": "fe2_a13_e09"}, {"subject": "fe2", "lessonNum": 13, "lesson": "Aula 13 — Criando um blog dinâmico (parte 1)", "official": false, "difficulty": "facil", "question": "O que diferencia uma página web estática (Front-end I) de uma página web dinâmica (Front-end II)?", "options": ["Na dinâmica, o conteúdo é buscado assincronamente (ex.: API REST) e montado/atualizado no DOM via JavaScript em tempo real.", "Na dinâmica não se usa HTML.", "Na estática não é possível usar CSS.", "A dinâmica só funciona offline."], "answer": 0, "explanation": "Conteúdo dinâmico separa a estrutura visual dos dados, que chegam via API e são injetados no DOM.", "id": "fe2_a13_e10"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "facil", "question": "Na API REST do Blog do IMD (https://autoria-form.vercel.app/api), quais são os dois endpoints disponibilizados?", "options": ["/blog (lista todas as postagens em JSON) e /post/\u003cid\u003e (retorna os detalhes de uma postagem específica).", "/login e /logout.", "/css e /js.", "/delete e /format."], "answer": 0, "explanation": "[GET] /api/blog traz o array de posts; [GET] /api/post/{id} traz um único post pelo ID.", "id": "fe2_a14_e01"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "facil", "question": "Quais campos compõem cada objeto JSON de postagem retornado pela API do blog?", "options": ["id, titulo, dataPublicacao, imagem e corpo.", "cpf, senha, email e telefone.", "width, height, color e font.", "tag, class, style e href."], "answer": 0, "explanation": "Cada objeto do array contém id, titulo, dataPublicacao, imagem e corpo.", "id": "fe2_a14_e02"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "facil", "question": "Qual ID foi adicionado à \u003cdiv\u003e da coluna principal (col-md-8) no index.html para que o JavaScript injete os cards de postagens?", "options": ["id=\"blogEntries\"", "id=\"footer\"", "id=\"sidebar\"", "id=\"navbar\""], "answer": 0, "explanation": "O script seleciona #blogEntries para anexar dinamicamente cada card de postagem.", "id": "fe2_a14_e03"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "medio", "question": "Por que o código da Aula 14 executa posts.map(post =\u003e post.corpo = post.corpo.slice(0, 300)) antes de renderizar os cards da página inicial?", "options": ["Para limitar o texto exibido no card a um resumo de até 300 caracteres.", "Para apagar as primeiras 300 postagens.", "Para aumentar a fonte para 300px.", "Para inverter o texto."], "answer": 0, "explanation": "Na página inicial exibe-se apenas um resumo (excerpt); o texto completo fica na página post.html.", "id": "fe2_a14_e04"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "medio", "question": "Para que serve chamar posts.reverse() antes do laço for que monta os cards no blog?", "options": ["Inverter a ordem do array para exibir primeiro as postagens mais recentes.", "Ordenar os títulos de A a Z.", "Remover as postagens sem imagem.", "Duplicar todas as postagens."], "answer": 0, "explanation": "A API retorna do mais antigo para o mais novo; reverse() coloca os posts mais recentes no topo.", "id": "fe2_a14_e05"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "medio", "question": "Como a Aula 14 formata a data ISO vinda da API (ex.: '2021-03-24T20:39:55.243Z') para o padrão brasileiro (DD/MM/AAAA)?", "options": ["Criando new Date(post.dataPublicacao) e formatando com new Intl.DateTimeFormat('pt-BR').format(data).", "Usando Math.round(post.dataPublicacao).", "Substituindo 'Z' por 'BR'.", "Usando JSON.stringify()."], "answer": 0, "explanation": "Intl.DateTimeFormat('pt-BR') formata objetos Date no padrão local brasileiro.", "id": "fe2_a14_e06"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "facil", "question": "Ao criar um card dinamicamente com jQuery (Aula 14), o que faz var mainDiv = $('\u003cdiv\u003e').addClass('card mb-4');?", "options": ["Cria um elemento \u003cdiv\u003e em memória e aplica as classes Bootstrap 'card' e 'mb-4'.", "Seleciona todas as divs existentes e as apaga.", "Envia uma requisição POST.", "Esconde todas as divs da página."], "answer": 0, "explanation": "Passar uma tag com colchetes angulares $('\u003cdiv\u003e') no construtor jQuery cria um novo nó DOM.", "id": "fe2_a14_e07"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "medio", "question": "Qual link é atribuído ao botão 'Leia Mais →' de cada card para abrir a página interna daquela postagem específica?", "options": ["href=\"post.html?id=\" + post.id", "href=\"index.html\"", "href=\"#blogEntries\"", "href=\"api/blog\""], "answer": 0, "explanation": "O ID da postagem é repassado via query string (?id=...) na URL para post.html.", "id": "fe2_a14_e08"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "facil", "question": "Comparando a criação de cards com JS nativo (createElement / classList.add / appendChild) versus jQuery ($('\u003cdiv\u003e') / addClass / append), qual conclusão a Aula 14 destaca?", "options": ["Ambos produzem o mesmo resultado no DOM, mas o jQuery oferece sintaxe mais curta e legível.", "JS nativo não consegue criar elementos \u003cimg\u003e.", "jQuery não consegue definir atributos src.", "JS nativo só funciona no Firefox."], "answer": 0, "explanation": "A Aula 14 implementa a mesma função nas duas abordagens para comparar a produtividade.", "id": "fe2_a14_e09"}, {"subject": "fe2", "lessonNum": 14, "lesson": "Aula 14 — Criando um blog dinâmico (parte 2)", "official": false, "difficulty": "medio", "question": "Na função carregarResumoPost(posts, indiceInicio, quantidade), por que o laço usa for (let i = indiceInicio; i \u003c quantidade + indiceInicio; i++)?", "options": ["Para carregar lotes paginados (ex.: 3 posts por vez) a partir do índice onde a listagem parou.", "Para sempre carregar apenas o primeiro post.", "Para pular posts ímpares.", "Para criar um loop infinito."], "answer": 0, "explanation": "Controlar indiceInicio e quantidade permite carregar mais posts sob demanda sem repetir os anteriores.", "id": "fe2_a14_e10"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "facil", "question": "Como funciona o botão 'Carregar mais...' (\u003cbutton id='load-more'\u003e) implementado na Aula 15?", "options": ["Ao ser clicado, chama a função de consulta/renderização passando o indicePost atualizado para buscar e anexar mais 3 postagens sem recarregar a página.", "Recarrega a página inteira via F5.", "Apaga os posts anteriores e volta ao topo.", "Abre uma nova aba com o JSON bruto."], "answer": 0, "explanation": "O carregamento assíncrono incremental melhora a experiência e evita recarregar o documento.", "id": "fe2_a15_e01"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "facil", "question": "Qual efeito jQuery foi aplicado aos cabeçalhos dos widgets da sidebar (#header-busca, #header-categoria, #header-autor) na Aula 15?", "options": ["slideToggle() nos respectivos corpos (#body-busca, #body-categoria, #body-autor) ao clicar.", "remove() ao clicar.", "animate() girando em 360 graus.", "load() carregando outra página."], "answer": 0, "explanation": "slideToggle() abre e fecha suavemente cada painel lateral como um acordeão.", "id": "fe2_a15_e02"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "medio", "question": "Na página interna post.html (arquivo js/post.js), qual API nativa do navegador é usada para extrair o parâmetro 'id' da URL (ex.: post.html?id=123)?", "options": ["new URLSearchParams(window.location.search).get('id')", "getElementById para url", "JSON.parse(window.url)", "$('#url').val()"], "answer": 0, "explanation": "URLSearchParams analisa a query string (window.location.search) e extrai qualquer parâmetro pelo nome.", "id": "fe2_a15_e03"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "facil", "question": "Qual endpoint da API é requisitado em js/post.js para carregar os dados completos da postagem selecionada?", "options": ["apiUrl + \"/post/\" + postId", "apiUrl + \"/blog\"", "apiUrl + \"/comments\"", "apiUrl + \"/all\""], "answer": 0, "explanation": "$.getJSON(apiUrl + '/post/' + postId, ...) busca somente o JSON completo daquele post.", "id": "fe2_a15_e04"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "medio", "question": "Como js/post.js transforma o texto longo de dados.corpo (separado por quebras duplas de linha) em parágrafos HTML reais dentro de #postConteudo?", "options": ["Divide com dados.corpo.split('\\n\\n') e usa forEach para dar append('\u003cp\u003e' + paragrafo + '\u003c/p\u003e').", "Usa dados.corpo.reverse().", "Joga tudo dentro de uma tag \u003cimg\u003e.", "Usa JSON.stringify(dados.corpo)."], "answer": 0, "explanation": "Quebrar por '\\n\\n' e envolver cada trecho em \u003cp\u003e garante boa tipografia e espaçamento entre parágrafos.", "id": "fe2_a15_e05"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "facil", "question": "Em carregarPostNaPaginaComJQuery(dados), qual método jQuery preenche a imagem principal do post (#postImagem)?", "options": ["$(\"#postImagem\").attr(\"src\", apiUrl + dados.imagem);", "$(\"#postImagem\").text(dados.imagem);", "$(\"#postImagem\").val(dados.imagem);", "$(\"#postImagem\").addClass(dados.imagem);"], "answer": 0, "explanation": "Imagens exigem alterar o atributo src via .attr('src', ...).", "id": "fe2_a15_e06"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "facil", "question": "Por que o carregamento de post.js dispara requisitarPost(postId) dentro de $(document).ready(function() { ... })?", "options": ["Para garantir que #postTitulo, #postImagem e #postConteudo já existam no DOM antes de preenchê-los.", "Para atrasar o site em 10 segundos.", "Porque $.getJSON não funciona fora de $(document).ready().", "Para desativar o Bootstrap."], "answer": 0, "explanation": "Esperar o DOM estar pronto evita seletores vazios ao manipular elementos da página.", "id": "fe2_a15_e07"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "medio", "question": "Em post.html, qual elemento exibe o título completo da postagem tanto no cabeçalho principal quanto no breadcrumb?", "options": ["#postTitulo e #postS
