ubTitulo atualizados via .text(dados.titulo).", "#blogEntries atualizado via .val().", "#ftr atualizado via .html().", "#load-more atualizado via .attr()."], "answer": 0, "explanation": "Tanto o \u003ch1\u003e (#postTitulo) quanto o item ativo do breadcrumb (#postSubTitulo) recebem dados.titulo.", "id": "fe2_a15_e08"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "facil", "question": "Na página post.html, quais elementos compõem a área de interação abaixo do conteúdo do artigo?", "options": ["Um formulário de comentários (card com textarea e botão Comentar) e a lista de comentários publicados.", "Apenas um Carousel de propagandas.", "Uma tabela de preços.", "Um player de Flash."], "answer": 0, "explanation": "A estrutura mantém consistência visual com o blog da Aula 15 de Front-end I.", "id": "fe2_a15_e09"}, {"subject": "fe2", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog dinâmico (parte 3)", "official": false, "difficulty": "medio", "question": "Se o usuário abrir post.html sem nenhum ?id=... na URL, o que retorna new URLSearchParams(window.location.search).get('id')?", "options": ["null", "0", "'index'", "true"], "answer": 0, "explanation": "Quando um parâmetro não existe na query string, URLSearchParams.get() retorna null.", "id": "fe2_a15_e10"}, {"id": "poo01", "subject": "poo", "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "difficulty": "facil", "question": "O que é TypeScript e qual processo é necessário para que o navegador ou o Node.js consigam executar um arquivo .ts?", "options": ["É um superset do JavaScript com tipagem forte e suporte a POO; precisa passar por um Transpiler (tsc) que traduz .ts para .js.", "É uma biblioteca CSS; precisa ser importado via \u003clink\u003e no HTML.", "É um banco de dados orientado a objetos; roda nativamente sem conversão no navegador.", "É um framework de testes que substitui o HTML."], "answer": 0, "explanation": "Criado pela Microsoft em 2012, o TypeScript é um superconjunto do JavaScript. Como navegadores não executam .ts diretamente, o transpilador (tsc) converte o código para .js.", "official": true, "lessonNum": 1}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "facil", "question": "Qual a principal diferença de paradigma entre Programação Estruturada e Programação Orientada a Objetos (POO)?", "options": ["Na Estruturada o programa é construído por funções e procedimentos; na POO é visto como um conjunto de objetos que mantêm dados internos e se comunicam por mensagens.", "Na POO não existem funções nem variáveis.", "A Programação Estruturada só funciona em TypeScript.", "Na POO todos os dados são obrigatoriamente globais."], "answer": 0, "explanation": "Na POO, objetos encapsulam estado (atributos) e comportamento (métodos) e colaboram trocando mensagens.", "id": "poo_a01_e01"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "facil", "question": "Quais são os quatro pilares clássicos da Programação Orientada a Objetos?", "options": ["Abstração, Encapsulamento, Herança e Polimorfismo.", "HTML, CSS, JavaScript e JSON.", "Variáveis, Laços, Condicionais e Recursão.", "Compilação, Interpretação, Depuração e Deploy."], "answer": 0, "explanation": "Os quatro pilares da POO são Abstração, Encapsulamento, Herança e Polimorfismo.", "id": "poo_a01_e02"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "facil", "question": "Qual a relação entre Classe e Objeto em POO?", "options": ["A classe é o modelo abstrato (molde) que define atributos e métodos; o objeto é a instância concreta criada a partir dessa classe.", "Objeto é o molde e classe é a cópia concreta.", "Ambos são exatamente a mesma coisa.", "Classes só existem em tempo de execução e objetos só no papel."], "answer": 0, "explanation": "A classe é o molde abstrato; cada objeto instanciado possui seus próprios valores concretos.", "id": "poo_a01_e03"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "facil", "question": "Em POO, o que representam respectivamente os 'atributos' e os 'métodos' de um objeto?", "options": ["Atributos representam características/dados internos; métodos representam comportamentos/ações que o objeto executa.", "Atributos são ações e métodos são cores.", "Atributos são arquivos .ts e métodos são arquivos .js.", "Ambos representam apenas textos."], "answer": 0, "explanation": "Ex.: em um Carro, cor e placa são atributos; acelerar() e frear() são métodos.", "id": "poo_a01_e04"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "facil", "question": "O que significa o pilar da Abstração na POO?", "options": ["Focar nas características e comportamentos essenciais de uma entidade do mundo real para o problema em questão, ignorando detalhes irrelevantes.", "Esconder todos os arquivos do projeto.", "Remover os métodos de uma classe.", "Transformar números em strings."], "answer": 0, "explanation": "Abstrair é modelar apenas o que importa para o domínio do sistema.", "id": "poo_a01_e05"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "facil", "question": "Qual empresa criou o TypeScript em 2012?", "options": ["Microsoft", "Google", "Twitter", "Mozilla"], "answer": 0, "explanation": "TypeScript foi criado pela Microsoft em 2012 como um superconjunto tipado do JavaScript.", "id": "poo_a01_e06"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "medio", "question": "Em TypeScript, se declararmos let nome = 'Diogo'; sem anotar o tipo explicitamente, o que o compilador faz?", "options": ["Infere (deduz) automaticamente o tipo string a partir do valor atribuído.", "Gera erro de compilação obrigatório.", "Define o tipo como number.", "Ignora a variável."], "answer": 0, "explanation": "TypeScript possui inferência de tipos: anotações explícitas são opcionais quando o tipo pode ser deduzido.", "id": "poo_a01_e07"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "facil", "question": "Qual extensão possuem os arquivos-fonte TypeScript antes da transpilação?", "options": [".ts", ".js", ".tp", ".oo"], "answer": 0, "explanation": "Arquivos TypeScript usam extensão .ts e são transpilados para arquivos .js.", "id": "poo_a01_e08"}, {"subject": "poo", "lessonNum": 1, "lesson": "Aula 01 — Introdução à Programação Orientada a Objetos", "official": false, "difficulty": "medio", "question": "Quem formulou a visão clássica da POO onde um sistema é composto por objetos que se comunicam via troca de mensagens (Diagrama citado na Aula 01)?", "options": ["Alan Kay", "Tim Berners-Lee", "Brendan Eich", "Dennis Ritchie"], "answer": 0, "explanation": "Alan Kay (criador do Smalltalk) popularizou o termo Orientação a Objetos e o modelo de comunicação por mensagens.", "id": "poo_a01_e09"}, {"id": "poo02", "subject": "poo", "lesson": "Aula 02 — Classes, Atributos e Métodos", "difficulty": "facil", "question": "Qual alternativa está ERRADA no contexto de nomes de atributos/variáveis de uma classe em TypeScript?", "options": ["Espaços só são permitidos em nomes de variáveis se não estiverem no início ou fim do nome.", "Devem começar com uma letra, _ ou $ (não podem começar com número).", "Espaços não são permitidos em nomes de variáveis.", "Podem conter letras, dígitos, _ e $ (sem hífen nem ponto)."], "answer": 0, "explanation": "Identificadores em TypeScript/JavaScript nunca podem conter espaços em nenhuma posição; portanto, a primeira alternativa está incorreta.", "official": true, "lessonNum": 2}, {"id": "poo03", "subject": "poo", "lesson": "Aula 02 — Classes, Atributos e Métodos", "difficulty": "facil", "question": "Qual é o ambiente de execução JavaScript/TypeScript usado no terminal na disciplina, e qual pacote permite subir um servidor web local com recarregamento automático?", "options": ["codeexec e file-server", "node (Node.js) e live-server", "typexec e node-server-start", "js e vscode"], "answer": 1, "explanation": "Na Aula 02 de POO, utiliza-se o Node.js (node) como runtime de execução e o pacote live-server (via npm) para servir a aplicação com live reload.", "official": true, "lessonNum": 2}, {"id": "poo04", "subject": "poo", "lesson": "Aula 02 — Classes, Atributos e Métodos", "difficulty": "facil", "question": "Se o método de uma classe tem um parâmetro chamado \"tamanho\" e a classe também possui um atributo chamado \"tamanho\", como referenciar o atributo da instância dentro do método?", "options": ["class.tamanho", "this.tamanho", "{{tamanho}}", "attr.tamanho"], "answer": 1, "explanation": "A palavra-chave this referencia a instância atual da classe, desambiguando o atributo (this.tamanho) do parâmetro local de mesmo nome.", "official": true, "lessonNum": 2}, {"id": "poo05", "subject": "poo", "lesson": "Aula 02 — Classes, Atributos e Métodos", "difficulty": "facil", "question": "Qual palavra reservada declara uma classe em TypeScript, e qual declaração de atributo abaixo é INVÁLIDA?", "options": ["class; e 1exemplo: string; é inválida.", "classdec; e _exemplo: string; é inválida.", "typedefinition; e $exemplo: string; é inválida.", "declaration; e ex1emplo: string; é inválida."], "answer": 0, "explanation": "Classes são declaradas com class. Identificadores não podem começar com dígito numérico, tornando 1exemplo: string; inválida.", "official": true, "lessonNum": 2}, {"id": "poo06", "subject": "poo", "lesson": "Aula 02 — Classes, Atributos e Métodos", "difficulty": "facil", "question": "Quais são os três modificadores de acesso em TypeScript, e o que significa dizer que a linguagem é \"case sensitive\"?", "options": ["public, private, protected; diferencia letras maiúsculas de minúsculas nos nomes.", "internal, external, global; exige que o nome da classe seja igual ao do arquivo.", "class, object, enum; obriga uso de ponto e vírgula.", "string, boolean, number; ignora letras maiúsculas."], "answer": 0, "explanation": "TypeScript controla visibilidade com public, private e protected. Ser case-sensitive significa que teste e Teste são identificadores distintos.", "official": true, "lessonNum": 2}, {"subject": "poo", "lessonNum": 2, "lesson": "Aula 02 — Classes, Atributos e Métodos", "official": false, "difficulty": "facil", "question": "Qual comando no terminal executa o compilador TypeScript em modo de observação (recompilando automaticamente ao salvar alterações)?", "options": ["tsc -w (ou tsc --watch)", "node -w", "npm run ts", "live-ts"], "answer": 0, "explanation": "tsc -w monitora os arquivos .ts e retranspila para .js automaticamente a cada salvamento.", "id": "poo_a02_e01"}, {"subject": "poo", "lessonNum": 2, "lesson": "Aula 02 — Classes, Atributos e Métodos", "official": false, "difficulty": "facil", "question": "Qual tipo de retorno deve ser anotado em um método TypeScript que realiza uma ação mas NÃO retorna nenhum valor?", "options": ["void", "null", "empty", "none"], "answer": 0, "explanation": "void indica explicitamente que a função/método não devolve valor.", "id": "poo_a02_e02"}, {"subject": "poo", "lessonNum": 2, "lesson": "Aula 02 — Classes, Atributos e Métodos", "official": false, "difficulty": "medio", "question": "No arquivo package.json da Aula 02, qual comando inicia o servidor web local configurado em \"scripts\": { \"start\": \"live-server\" }?", "options": ["npm start", "tsc start", "node live", "server run"], "answer": 0, "explanation": "Scripts definidos em package.json são acionados com npm start (ou npm run \u003cscript\u003e).", "id": "poo_a02_e03"}, {"subject": "poo", "lessonNum": 2, "lesson": "Aula 02 — Classes, Atributos e Métodos", "official": false, "difficulty": "facil", "question": "Qual comando instala o TypeScript e cria um arquivo package.json padrão no projeto Node.js?", "options": ["npm init -y e npm install typescript", "git init e html install", "tsc init-npm", "node create-package"], "answer": 0, "explanation": "O gerenciador npm cria o package.json e instala dependências como typescript e live-server.", "id": "poo_a02_e04"}, {"subject": "poo", "lessonNum": 2, "lesson": "Aula 02 — Classes, Atributos e Métodos", "official": false, "difficulty": "medio", "question": "Como instanciar um novo objeto da classe Carro em TypeScript?", "options": ["let c = new Carro();", "let c = Carro.create();", "let c = class Carro();", "new let c = Carro;"], "answer": 0, "explanation": "O operador new seguido do nome da classe cria uma nova instância em memória.", "id": "poo_a02_e05"}, {"id": "poo07", "subject": "poo", "lesson": "Aula 03 — Construtores e Objetos", "difficulty": "facil", "question": "Como se chamam os métodos especiais usados para criar e inicializar novas instâncias de uma classe em TypeScript, e qual palavra reservada os define?", "options": ["Alocadores; palavra reservada init", "Construtores; palavra reservada constructor", "Criadores; palavra reservada const", "Movedores; palavra reservada inicialize"], "answer": 1, "explanation": "O método construtor é definido pela palavra-chave constructor e é invocado automaticamente ao instanciar um objeto com o operador new.", "official": true, "lessonNum": 3}, {"id": "poo08", "subject": "poo", "lesson": "Aula 03 — Construtores e Objetos", "difficulty": "medio", "question": "Analise as afirmativas sobre construtores em TypeScript:\nI. A definição de um construtor pelo programador é obrigatória; sem ele o programa não compila.\nII. Em TypeScript não podemos ter múltiplas implementações de construtor na mesma classe.\nIII. Um construtor precisa declarar explicitamente seu tipo de retorno.\nQuais afirmativas estão INCORRETAS?", "options": ["Apenas II", "I e III", "Apenas III", "I e II"], "answer": 1, "explanation": "I é incorreta (se omitido, existe construtor padrão implícito) e III é incorreta (construtores não têm anotação de tipo de retorno). II está correta: TypeScript aceita apenas uma implementação concreta de constructor.", "official": true, "lessonNum": 3}, {"id": "poo09", "subject": "poo", "lesson": "Aula 03 — Construtores e Objetos", "difficulty": "facil", "question": "Como marcar um parâmetro de método ou construtor como opcional em TypeScript, e qual valor ele recebe se for omitido na chamada?", "options": ["Adicionando \"_op\" no final; recebe null.", "Adicionando \"?\" ao final do nome do parâmetro; recebe undefined.", "Adicionando \"optional\" antes do nome; recebe 0.", "Adicionando \"*\" após o tipo; recebe NaN."], "answer": 1, "explanation": "Parâmetros opcionais usam ? após o identificador (ex.: placa?: string). Quando não são passados na chamada, recebem undefined.", "official": true, "lessonNum": 3}, {"id": "poo10", "subject": "poo", "lesson": "Aula 03 — Construtores e Objetos", "difficulty": "medio", "question": "No arquivo tsconfig.json (que indica a raiz de um projeto TypeScript), quais opções definem respectivamente o diretório de saída dos .js e a versão do JavaScript de destino?", "options": ["include e noEmitOnError", "outDir e target", "outFile e startDir", "rootDir e compile"], "answer": 1, "explanation": "outDir especifica a pasta de saída dos arquivos JS transpilados, target define a versão ECMAScript de destino (ex.: es5, es6), e noEmitOnError impede gerar JS quando há erros.", "official": true, "lessonNum": 3}, {"subject": "poo", "lessonNum": 3, "lesson": "Aula 03 — Construtores e Objetos", "official": false, "difficulty": "facil", "question": "Qual opção do arquivo tsconfig.json impede que arquivos JavaScript sejam gerados caso existam erros de compilação no código TypeScript?", "options": ["\"noEmitOnError\": true", "\"stopError\": true", "\"strictOff\": false", "\"outDir\": \"none\""], "answer": 0, "explanation": "noEmitOnError: true protege a pasta de saída (js/) evitando sobrescrevê-la com código quebrado.", "id": "poo_a03_e01"}, {"subject": "poo", "lessonNum": 3, "lesson": "Aula 03 — Construtores e Objetos", "official": false, "difficulty": "facil", "question": "No tsconfig.json, qual propriedade define quais pastas/arquivos TypeScript devem ser incluídos na compilação pelo comando tsc?", "options": ["\"include\": [\"app/ts/**/*\"]", "\"filesDir\": \"ts\"", "\"sourcePath\": \"ts\"", "\"outDir\": \"ts\""], "answer": 0, "explanation": "include informa os caminhos de origem; outDir informa a pasta de destino dos .js gerados.", "id": "poo_a03_e02"}, {"subject": "poo", "lessonNum": 3, "lesson": "Aula 03 — Construtores e Objetos", "official": false, "difficulty": "medio", "question": "Sobre sobrecarga de métodos em TypeScript (Aula 03), qual afirmação é VERDADEIRA?", "options": ["Podemos declarar múltiplas assinaturas com o mesmo nome variando parâmetros/retornos, mas deve existir apenas UMA implementação compatível com todas.", "Podemos escrever vários corpos de implementação diferentes para o mesmo método.", "TypeScript proíbe totalmente sobrecarga de assinaturas.", "Sobrecarga só funciona com retorno boolean."], "answer": 0, "explanation": "As assinaturas sobrecargadas servem para checagem de tipos; a implementação única (usando any ou union) trata os casos em runtime.", "id": "poo_a03_e03"}, {"subject": "poo", "lessonNum": 3, "lesson": "Aula 03 — Construtores e Objetos", "official": false, "difficulty": "medio", "question": "Ao definir parâmetros opcionais em um construtor TypeScript (ex.: constructor(modelo: string, placa?: string)), onde os parâmetros opcionais devem ficar posicionados?", "options": ["Sempre após os parâmetros obrigatórios.", "Sempre antes dos parâmetros obrigatórios.", "Em qualquer posição, sem restrição.", "Apenas no primeiro parâmetro."], "answer": 0, "explanation": "Parâmetros opcionais (?) não podem preceder parâmetros obrigatórios na lista de assinatura.", "id": "poo_a03_e04"}, {"subject": "poo", "lessonNum": 3, "lesson": "Aula 03 — Construtores e Objetos", "official": false, "difficulty": "facil", "question": "Na estrutura organizada do projeto da Aula 03, por que separamos app/ts/ e app/js/?", "options": ["Para manter os arquivos-fonte TypeScript separados dos arquivos JavaScript gerados automaticamente pelo transpilador.", "Porque o navegador lê apenas a pasta app/ts/.", "Porque o Node.js exige duas pastas obrigatórias.", "Para duplicar o código manualmente."], "answer": 0, "explanation": "Separar código-fonte (ts) de código gerado (js via outDir) mantém o projeto limpo e fácil de manter.", "id": "poo_a03_e05"}, {"subject": "poo", "lessonNum": 3, "lesson": "Aula 03 — Construtores e Objetos", "official": false, "difficulty": "medio", "question": "Se uma classe Carro possui constructor(modelo: string, numPortas?: number) e no corpo verifica if (numPortas != undefined) this.numPortas = numPortas; else this.numPortas = 2;, qual será numPortas ao chamar new Carro('Gol')?", "options": ["2", "undefined", "0", "Erro de compilação"], "answer": 0, "explanation": "Como numPortas foi omitido, chegou como undefined e caiu no else recebendo o valor padrão 2.", "id": "poo_a03_e06"}, {"id": "poo11", "subject": "poo", "lesson": "Aula 04 — Encapsulamento", "difficulty": "medio", "question": "No código de Encapsulamento da Aula 04 abaixo, o que garante o modificador readonly no parâmetro fabricante?", "code": "export class Carro {\n  public constructor(\n    readonly fabricante: string,\n    private _modelo: string\n  ) {}\n}", "options": ["Cria o atributo fabricante automaticamente e impede que seu valor seja alterado após a inicialização no construtor.", "Torna fabricante invisível dentro da própria classe.", "Permite alterar fabricante apenas via método set.", "Impede que fabricante seja lido fora da classe."], "answer": 0, "explanation": "Declarar modificadores (public, private, protected ou readonly) nos parâmetros do construtor cria os atributos automaticamente. readonly permite leitura, mas bloqueia alterações posteriores.", "official": true, "lessonNum": 4}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "facil", "question": "Qual é o objetivo principal do Encapsulamento em POO?", "options": ["Proteger os dados internos de um objeto contra acessos ou alterações inválidas diretas, expondo apenas interfaces controladas (getters, setters e métodos).", "Tornar todos os atributos públicos para facilitar acesso.", "Eliminar a necessidade de construtores.", "Impedir que objetos sejam criados."], "answer": 0, "explanation": "Encapsular oculta detalhes internos (private) e centraliza regras de validação nos métodos de acesso.", "id": "poo_a04_e01"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "facil", "question": "Qual modificador de acesso restringe um atributo ou método para ser acessado APENAS dentro da própria classe onde foi declarado?", "options": ["private", "public", "protected", "readonly"], "answer": 0, "explanation": "private bloqueia acesso externo e até mesmo de subclasses.", "id": "poo_a04_e02"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "facil", "question": "Se nenhum modificador de acesso for escrito antes de um atributo ou método em uma classe TypeScript, qual visibilidade ele assume por padrão?", "options": ["public", "private", "protected", "static"], "answer": 0, "explanation": "Por padrão, todos os membros de uma classe TypeScript são public.", "id": "poo_a04_e03"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "medio", "question": "Qual a utilidade dos métodos acessores get e set (getters e setters) em TypeScript?", "options": ["Permitir ler e atualizar atributos privados usando sintaxe de propriedade (ex.: c.cor = 'Azul') enquanto aplica validações internas.", "Criar cópias de arquivos.", "Substituir o operador new.", "Tornar atributos constantes."], "answer": 0, "explanation": "Setters validam dados (ex.: impedir créditos \u003c= 0) antes de gravar no atributo privado _creditos.", "id": "poo_a04_e04"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "medio", "question": "Por convenção em TypeScript (vista nas aulas do IMD), por que atributos privados costumam começar com sublinhado (ex.: private _saldo: number)?", "options": ["Para diferenciá-los facilmente dos métodos públicos get saldo() e set saldo() sem colisão de nomes.", "Porque o TypeScript exige sublinhado em todo atributo.", "Porque _ torna a variável global.", "Para transformar o atributo em string."], "answer": 0, "explanation": "Usar _atributo permite expor public get atributo() com o nome limpo sem conflito.", "id": "poo_a04_e05"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "medio", "question": "Sobre compatibilidade entre tipos de objetos em TypeScript (tipagem estrutural, Aula 04), quando duas classes distintas SEM herança são consideradas compatíveis?", "options": ["Quando possuem propriedades públicas com os mesmos nomes e tipos (exceto se houver membros private/protected, que exigem mesma declaração de origem).", "Nunca são compatíveis.", "Sempre são compatíveis mesmo com propriedades diferentes.", "Apenas se tiverem o mesmo nome de arquivo."], "answer": 0, "explanation": "TypeScript usa tipagem estrutural (duck typing) para membros públicos, mas exige mesma origem para membros private.", "id": "poo_a04_e06"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "facil", "question": "No contra-exemplo de falta de encapsulamento da Aula 04, qual risco ocorre ao deixar atributos críticos como _numPortas ou _saldo como public?", "options": ["Qualquer trecho externo do programa pode atribuir valores incoerentes (como -5 portas ou saldo negativo) violando regras de negócio.", "O código deixa de compilar.", "Os atributos viram undefined.", "O computador reinicia."], "answer": 0, "explanation": "Sem encapsulamento, não há barreira de validação para proteger a integridade do estado do objeto.", "id": "poo_a04_e07"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "medio", "question": "Na Atividade 02 da Aula 04 (classe Estudante), qual combinação de modificadores garante que 'id' não possa ser alterado após o construtor e 'creditos' só seja modificado com validação \u003e 0?", "options": ["readonly id e private _creditos com setter validado.", "public id e public creditos.", "static id e readonly creditos.", "protected id sem construtor."], "answer": 0, "explanation": "readonly trava id após a inicialização; private + set valida creditos \u003e 0.", "id": "poo_a04_e08"}, {"subject": "poo", "lessonNum": 4, "lesson": "Aula 04 — Encapsulamento", "official": false, "difficulty": "dificil", "question": "Em TypeScript, qual é o resultado de tentar executar carro.fabricante = 'OutraMarca'; quando fabricante foi declarado como readonly?", "options": ["Erro em tempo de compilação do TypeScript, impedindo a alteração da propriedade somente-leitura.", "Altera normalmente sem aviso.", "Apaga a propriedade.", "Converte fabricante para null."], "answer": 0, "explanation": "readonly bloqueia reatribuições fora da declaração ou do construtor durante a checagem do tsc.", "id": "poo_a04_e09"}, {"id": "poo12", "subject": "poo", "lesson": "Aula 05 — Composição e Agregação", "difficulty": "facil", "question": "Em POO, o que caracteriza o conceito de Composição (como a classe Veiculo contendo atributos do tipo Motor e Direcao)?", "options": ["Um objeto mais complexo é construído reunindo instâncias de outras classes como suas partes, promovendo reutilização.", "Uma classe copia o código-fonte de outra manualmente.", "Duas classes não podem ter nenhum relacionamento.", "É o mesmo que declarar todas as variáveis como globais."], "answer": 0, "explanation": "Na composição/associação, objetos complexos são formados por partes mais simples (ex.: Veiculo tem um Motor e uma Direcao), permitindo modularidade e reuso.", "official": true, "lessonNum": 5}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "facil", "question": "Qual é a relação conceitual expressa por Composição e Agregação em POO (diferente da Herança)?", "options": ["Relação 'TEM-UM' (um objeto contém ou usa outros objetos), enquanto Herança expressa 'É-UM'.", "Relação 'É-UM'.", "Relação 'SUBSTITUI-UM'.", "Não expressam nenhum relacionamento."], "answer": 0, "explanation": "Um Carro TEM UM Motor (composição); um Carro É UM Veículo (herança).", "id": "poo_a05_e01"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "medio", "question": "Qual a principal diferença entre Composição (forte) e Agregação (fraca) em POO?", "options": ["Na Composição a parte depende do ciclo de vida do todo (é criada/destruída junto com ele); na Agregação a parte pode existir de forma independente fora do todo.", "Na Agregação as classes não podem se comunicar.", "Na Composição os objetos são sempre externos.", "Não existe diferença conceitual."], "answer": 0, "explanation": "Ex.: se o todo cria seu próprio Motor internamente (new Motor()), é composição forte; se recebe um objeto pronto de fora que existe sozinho, tende à agregação.", "id": "poo_a05_e02"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "facil", "question": "Na classe Veiculo da Aula 05, por que os atributos _motor: Motor e _direcao: Direcao são bons exemplos de composição?", "options": ["Porque um Veiculo é formado pela reunião de objetos menores especializados (Motor e Direcao) com responsabilidades próprias.", "Porque Motor herda de Veiculo.", "Porque Direcao é um tipo primitivo number.", "Porque Veiculo não possui construtor."], "answer": 0, "explanation": "Cada componente encapsula sua própria lógica (potência no Motor, cor na Direcao) e o Veiculo os coordena.", "id": "poo_a05_e03"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "medio", "question": "Ao usar composição no construtor de Veiculo (this._motor = new Motor(potencia);), qual benefício de design isso traz?", "options": ["Aumenta a coesão e facilita reutilizar Motor e Direcao em outros tipos de veículos sem duplicar código.", "Impede o uso de getters e setters.", "Obriga todos os atributos a serem públicos.", "Aumenta a repetição de código."], "answer": 0, "explanation": "Composição promove baixa duplicação, alta coesão e facilidade de manutenção.", "id": "poo_a05_e04"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "facil", "question": "Como uma classe em um arquivo TypeScript (ex.: veiculo.ts) utiliza outra classe definida em outro arquivo (ex.: motor.ts)?", "options": ["Exportando Motor com export class Motor e importando com import { Motor } from 'modulo-motor';.", "Copiando e colando a classe Motor dentro de veiculo.ts.", "Usando \u003clink rel='class'\u003e.", "Não é possível separar classes em arquivos diferentes."], "answer": 0, "explanation": "Módulos ES/TS conectam classes entre arquivos via export e import.", "id": "poo_a05_e05"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "medio", "question": "Se um objeto Departamento contém uma lista de objetos Professor que continuam existindo mesmo se o Departamento for encerrado, que tipo de associação isso representa melhor?", "options": ["Agregação", "Composição forte", "Herança múltipla", "Recursão"], "answer": 0, "explanation": "Como os professores têm ciclo de vida independente do departamento, caracteriza-se agregação.", "id": "poo_a05_e06"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "medio", "question": "Se um objeto Pedido cria internamente seus objetos ItemPedido e eles não fazem sentido existindo isoladamente sem o Pedido, que relação é essa?", "options": ["Composição", "Herança", "Polimorfismo", "Interface"], "answer": 0, "explanation": "Dependência total de ciclo de vida entre o todo (Pedido) e as partes (ItemPedido) caracteriza composição.", "id": "poo_a05_e07"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "facil", "question": "Em um objeto veiculo composto por um objeto motor (com get potencia()), como ler a potência do motor através de veiculo se houver get motor()?", "options": ["veiculo.motor.potencia", "veiculo-\u003emotor-\u003epotencia", "Motor.veiculo()", "veiculo[0]"], "answer": 0, "explanation": "A notação ponto navega pelo objeto composto até as propriedades/métodos de suas partes.", "id": "poo_a05_e08"}, {"subject": "poo", "lessonNum": 5, "lesson": "Aula 05 — Composição e Agregação", "official": false, "difficulty": "medio", "question": "Na engenharia de software OO, por que frequentemente se recomenda 'favorecer composição sobre herança' quando a relação não é estritamente 'É-UM'?", "options": ["Porque composição mantém o acoplamento mais baixo e permite trocar componentes em tempo de execução com mais flexibilidade.", "Porque herança não existe em TypeScript.", "Porque composição dispensa classes.", "Porque herança não permite atributos."], "answer": 0, "explanation": "Herança acopla fortemente subclasse à superclasse; composição oferece modularidade flexível.", "id": "poo_a05_e09"}, {"id": "poo13", "subject": "poo", "lesson": "Aula 06 — Herança I", "difficulty": "medio", "question": "Em TypeScript, qual palavra-chave estabelece herança entre classes, e qual é a função da palavra reservada super na subclasse?", "options": ["implements; super cria atributos estáticos.", "extends; super chama o construtor ou métodos da superclasse (classe pai).", "inherits; super torna a classe abstrata.", "export; super importa módulos externos."], "answer": 1, "explanation": "Uma subclasse herda de uma superclasse usando extends (ex.: Terrestre extends Transporte). super(...) invoca o construtor da classe pai e super.metodo() chama métodos dela.", "official": true, "lessonNum": 6}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "facil", "question": "Na terminologia de Herança em POO, quais termos são sinônimos de quem FORNECE a herança e de quem HERDA?", "options": ["Superclasse / Mãe / Base (fornece) e Subclasse / Filha / Derivada (herda).", "Objeto (fornece) e Método (herda).", "Privada (fornece) e Pública (herda).", "Módulo (fornece) e Namespace (herda)."], "answer": 0, "explanation": "Superclasse/Mãe/Tipo/Base está acima na hierarquia; Subclasse/Filha/Subtipo/Derivada está abaixo.", "id": "poo_a06_e01"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "facil", "question": "Sobre as regras fundamentais da herança destacadas na Aula 06, qual afirmação é VERDADEIRA?", "options": ["A classe filha não pode remover atributos/métodos da classe mãe, e a classe mãe não conhece os atributos/métodos novos criados na classe filha.", "A classe filha pode apagar atributos da mãe.", "A classe mãe acessa livremente atributos privados da filha.", "A classe filha não herda nenhum método."], "answer": 0, "explanation": "A herança sempre estende (especializa) a superclasse de cima para baixo, nunca de baixo para cima.", "id": "poo_a06_e02"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "facil", "question": "Na hierarquia Transporte → Terrestre → Automóvel, o que representam os extremos 'Generalização' e 'Especialização'?", "options": ["Generalização está no topo (classes mais genéricas como Transporte); Especialização está na base (classes mais específicas e detalhadas como Automóvel).", "Automóvel é a generalização e Transporte é a especialização.", "Ambos são sinônimos de encapsulamento.", "Só existem em linguagens sem classes."], "answer": 0, "explanation": "Subir na árvore = generalizar; descer na árvore = especializar com mais atributos e comportamentos.", "id": "poo_a06_e03"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "facil", "question": "Na hierarquia Transporte (capacidade) → Terrestre (numRodas) → Automóvel (cor, numPortas, placa), quantos atributos no total um objeto Automóvel possui?", "options": ["5 atributos (os 3 próprios + os 2 herdados de Terrestre e Transporte).", "Apenas 3 atributos.", "Apenas 1 atributo.", "2 atributos."], "answer": 0, "explanation": "Automóvel acumula os atributos de toda a sua cadeia ancestral: capacidade, numRodas, cor, numPortas e placa.", "id": "poo_a06_e04"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "facil", "question": "Qual é a sintaxe correta em TypeScript para fazer a classe Carro herdar de Veiculo?", "options": ["export class Carro extends Veiculo { }", "export class Carro inherits Veiculo { }", "export class Carro : Veiculo { }", "export class Carro implements Veiculo { }"], "answer": 0, "explanation": "extends declara herança entre classes; implements é usado para interfaces.", "id": "poo_a06_e05"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "medio", "question": "Qual o principal benefício de usar Herança ao modelar Carro, Moto e Caminhão a partir de uma superclasse Veiculo?", "options": ["Evitar duplicação de código concentrando atributos e métodos comuns em Veiculo e especializando apenas o que difere em cada subclasse.", "Eliminar a necessidade de objetos.", "Tornar todas as variáveis globais.", "Impedir o uso de TypeScript."], "answer": 0, "explanation": "Reutilização estruturada e manutenção centralizada de comportamentos comuns.", "id": "poo_a06_e06"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "facil", "question": "Em TypeScript, uma classe pode estender (extends) quantas superclasses diretamente ao mesmo tempo?", "options": ["Apenas uma superclasse direta (herança simples de classes).", "Quantas quiser separadas por vírgula.", "Nenhuma.", "Exatamente duas."], "answer": 0, "explanation": "TypeScript (como Java/C#) usa herança simples de classes; para múltiplos contratos, utilizam-se interfaces.", "id": "poo_a06_e07"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "medio", "question": "Se a classe Moto estende Veiculo sem adicionar nenhum atributo ou método novo (export class Moto extends Veiculo {}), o que Moto possui?", "options": ["Todos os atributos e métodos herdados de Veiculo (respeitando seus modificadores de acesso).", "Absolutamente nada.", "Erro de compilação por corpo vazio.", "Apenas um construtor vazio sem herdar nada."], "answer": 0, "explanation": "Mesmo sem novos membros, a subclasse herda integralmente a estrutura da superclasse.", "id": "poo_a06_e08"}, {"subject": "poo", "lessonNum": 6, "lesson": "Aula 06 — Herança I", "official": false, "difficulty": "facil", "question": "Qual frase valida corretamente se uma relação entre classes deve usar Herança?", "options": ["'Automóvel É UM Terrestre' (relação É-UM).", "'Automóvel TEM UM Motor' (relação TEM-UM).", "'Automóvel USA UMA Estrada'.", "'Automóvel CONTA Dinheiro'."], "answer": 0, "explanation": "O teste 'É-UM' (is-a) confirma se herança é a modelagem adequada.", "id": "poo_a06_e09"}, {"id": "poo14", "subject": "poo", "lesson": "Aula 07 — Herança II", "difficulty": "medio", "question": "Por que a subclasse Terrestre consegue acessar diretamente o atributo _capacidade declarado na superclasse Transporte sem usar get/set?", "code": "export class Transporte {\n  protected _capacidade: number;\n}\nexport class Terrestre extends Transporte {\n  exibir() { console.log(this._capacidade); }\n}", "options": ["Porque atributos protected são acessíveis na própria classe e em suas subclasses, mas não externamente.", "Porque protected funciona exatamente igual a public.", "Porque private permite acesso livre às subclasses.", "Porque TypeScript ignora modificadores de acesso em herança."], "answer": 0, "explanation": "private restringe o acesso somente à classe declarante; protected libera o acesso tanto para a classe declarante quanto para suas subclasses (classes filhas).", "official": true, "lessonNum": 7}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "facil", "question": "Quando uma subclasse define seu próprio constructor() em TypeScript, qual chamada é OBRIGATÓRIA antes de usar this?", "options": ["Chamar super(...) para invocar o construtor da superclasse.", "Chamar new Parent().", "Chamar delete this.", "Não é necessário chamar nada."], "answer": 0, "explanation": "Em subclasses com construtor próprio, super(...) precisa inicializar a parte herdada da superclasse antes de acessar this.", "id": "poo_a07_e01"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "medio", "question": "O que é 'sobrescrita de método' (method override) na Herança?", "options": ["Redefinir na subclasse um método herdado da superclasse (com mesmo nome e assinatura compatível) para dar um comportamento especializado.", "Apagar o método da superclasse.", "Criar uma variável com o mesmo nome da classe.", "Chamar o mesmo método duas vezes."], "answer": 0, "explanation": "Sobrescrita permite que Terrestre implemente sua própria versão de exibirInformacoes() herdado de Transporte.", "id": "poo_a07_e02"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "medio", "question": "Dentro de um método sobrescrito na subclasse, como podemos reaproveitar a implementação original da superclasse antes ou depois do novo código?", "options": ["Chamando super.nomeDoMetodo();", "Chamando this.nomeDoMetodo();", "Chamando parent::nomeDoMetodo();", "Não é possível chamar a versão da superclasse."], "answer": 0, "explanation": "super.exibirInformacoes() executa a lógica da superclasse sem causar recursão infinita (que ocorreria com this).", "id": "poo_a07_e03"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "facil", "question": "Qual a diferença entre os modificadores private e protected no contexto de herança?", "options": ["private só é acessível na própria classe; protected é acessível na própria classe E em suas subclasses.", "protected é acessível de qualquer lugar do sistema como public.", "private é acessível pelas subclasses.", "Não há diferença."], "answer": 0, "explanation": "protected protege o atributo do mundo externo, mas o libera para a hierarquia de herança.", "id": "poo_a07_e04"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "medio", "question": "Se uma superclasse Transporte tem protected _capacidade: number, um código externo no arquivo app.ts pode fazer transporte._capacidade = 50?", "options": ["Não; atributos protected não são acessíveis diretamente fora da hierarquia de classes (gera erro no TypeScript).", "Sim, livremente.", "Sim, mas apenas para leitura.", "Apenas se usar var."], "answer": 0, "explanation": "Para código externo, protected comporta-se como private; o acesso deve ocorrer via getters/setters públicos.", "id": "poo_a07_e05"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "medio", "question": "No construtor de Carro extends Veiculo, o que acontece se passarmos super(potencia) sem passar todos os parâmetros obrigatórios exigidos pelo construtor de Veiculo?", "options": ["O compilador TypeScript acusa erro de argumentos insuficientes na chamada super().", "O código compila normalmente preenchendo com 0.", "O construtor de Veiculo é ignorado.", "O objeto vira null."], "answer": 0, "explanation": "super(...) deve satisfazer a assinatura de parâmetros obrigatórios do construtor da superclasse.", "id": "poo_a07_e06"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "facil", "question": "Na cadeia de herança A → B → C, se C não sobrescreve o método imprimir() mas B sobrescreve, qual versão roda ao chamar c.imprimir()?", "options": ["A versão de B (mais próxima na cadeia de herança).", "A versão de A sempre.", "Gera erro porque C não reescreveu.", "Nenhuma versão roda."], "answer": 0, "explanation": "A busca de métodos sobe pela cadeia de protótipos/herança executando a definição mais específica encontrada.", "id": "poo_a07_e07"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "medio", "question": "Por que chamar this.exibirInformacoes() dentro do próprio exibirInformacoes() sobrescrito na subclasse causa erro?", "options": ["Porque chama a si mesmo infinitamente (recursão infinita / estouro de pilha) em vez de chamar a superclasse.", "Porque this não existe em subclasses.", "Porque exibe os dados duas vezes apenas.", "Não causa erro algum."], "answer": 0, "explanation": "Para invocar a implementação herdada da classe mãe, deve-se usar super.exibirInformacoes().", "id": "poo_a07_e08"}, {"subject": "poo", "lessonNum": 7, "lesson": "Aula 07 — Herança II", "official": false, "difficulty": "dificil", "question": "Em TypeScript, se uma subclasse Carro declara um método com o mesmo nome de um método da superclasse Veiculo, o que ocorre com o método original de Veiculo?", "options": ["Permanece intacto na classe Veiculo (e acessível via super), mas instâncias de Carro executam a versão sobrescrita.", "É apagado da classe Veiculo.", "Causa erro de compilação imediato.", "Só funciona se for static."], "answer": 0, "explanation": "A sobrescrita especializa o comportamento em Carro sem afetar instâncias diretas de Veiculo ou outras subclasses.", "id": "poo_a07_e09"}, {"id": "poo15", "subject": "poo", "lesson": "Aula 08 — Polimorfismo", "difficulty": "medio", "question": "No polimorfismo em TypeScript, como contornar a ausência de múltiplas implementações de construtor/método para distinguir tipos primitivos e instâncias de classes?", "options": ["Usando typeof para verificar tipos primitivos e instanceof para verificar de qual classe um objeto é instância.", "Declarando vários blocos constructor() seguidos na mesma classe.", "Usando switch(className) nativo do HTML.", "Desativando o tsconfig.json."], "answer": 0, "explanation": "Como o TypeScript transpila para uma única implementação JS, usa-se parâmetros opcionais, typeof (para primitivos como string/number) e instanceof (para instâncias de classes).", "official": true, "lessonNum": 8}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "facil", "question": "O que significa Polimorfismo em Programação Orientada a Objetos?", "options": ["Capacidade de objetos de diferentes subclasses responderem de maneiras específicas (múltiplas formas) à mesma chamada de método definida na superclasse.", "Criar apenas uma classe para todo o sistema.", "Proibir herança entre classes.", "Usar apenas variáveis do tipo any."], "answer": 0, "explanation": "Ex.: movimentarBrinquedo(b: Brinquedo) chama b.mover(), mas Aviao voa e Barco navega.", "id": "poo_a08_e01"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "facil", "question": "No exemplo da Aula 08 (function movimentarBrinquedo(b: Brinquedo) { b.mover(); }), quais objetos podem ser passados como argumento para b?", "options": ["Instâncias de Brinquedo ou de qualquer subclasse que estenda Brinquedo (como Aviao e Barco).", "Apenas instâncias diretas de Brinquedo, nunca subclasses.", "Apenas strings.", "Qualquer número inteiro."], "answer": 0, "explanation": "Pelo polimorfismo de subtipo, uma referência do tipo superclasse aceita qualquer subclasse.", "id": "poo_a08_e02"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "medio", "question": "Por que tentar declarar dois blocos constructor() completos na mesma classe TypeScript gera erro de compilação?", "options": ["Porque TypeScript transpila para JavaScript, onde cada classe possui apenas uma única implementação de construtor.", "Porque TypeScript não tem construtores.", "Porque construtores não aceitam parâmetros.", "Porque só o Node.js aceita dois construtores."], "answer": 0, "explanation": "Diferente de Java/C++, em TS existe apenas um corpo de constructor (usando parâmetros opcionais, typeof ou instanceof).", "id": "poo_a08_e03"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "medio", "question": "Qual operador JavaScript/TypeScript verifica o tipo primitivo de um valor (ex.: 'number' ou 'string') em tempo de execução?", "options": ["typeof", "instanceof", "isType", "classof"], "answer": 0, "explanation": "typeof _args == 'string' identifica primitivos; instanceof identifica instâncias de classes.", "id": "poo_a08_e04"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "medio", "question": "Qual operador verifica em tempo de execução se um objeto é instância de uma determinada classe (ex.: _args instanceof Fornecedor)?", "options": ["instanceof", "typeof", "extends", "implements"], "answer": 0, "explanation": "instanceof testa a cadeia de protótipos do objeto contra a classe informada.", "id": "poo_a08_e05"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "facil", "question": "Qual será a saída ao chamar movimentarBrinquedo(new Aviao(900)) onde Aviao sobrescreve mover() para imprimir 'Voar...'?", "options": ["'Voar...'", "'Mover brinquedo'", "undefined", "Erro de tipo"], "answer": 0, "explanation": "O despacho dinâmico executa o método mover() da instância real (Aviao), mesmo o parâmetro sendo tipado como Brinquedo.", "id": "poo_a08_e06"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "medio", "question": "Qual é a vantagem arquitetural do polimorfismo ao adicionar uma nova subclasse Trem extends Brinquedo ao sistema?", "options": ["A função movimentarBrinquedo(b: Brinquedo) já funciona automaticamente com Trem sem precisar alterar nenhum if/else nela.", "Precisamos reescrever todas as funções existentes.", "Trem não precisa herdar de Brinquedo.", "O sistema fica mais lento."], "answer": 0, "explanation": "Polimorfismo favorece código aberto para extensão e fechado para modificação.", "id": "poo_a08_e07"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "dificil", "question": "Em TypeScript, qual é o resultado de (new Carro() instanceof Veiculo) quando Carro extends Veiculo?", "options": ["true", "false", "undefined", "Erro de sintaxe"], "answer": 0, "explanation": "Como Carro herda de Veiculo, toda instância de Carro também é reconhecida como instância de Veiculo.", "id": "poo_a08_e08"}, {"subject": "poo", "lessonNum": 8, "lesson": "Aula 08 — Polimorfismo", "official": false, "difficulty": "medio", "question": "No exemplo de sobrecarga simulada na Aula 08, por que o tipo any impede o JavaScript de escolher sozinho entre duas versões de método em runtime?", "options": ["Porque uma variável any (e o JS transpilado) não tem tipos fixos em tempo de execução e só existe uma função com aquele nome no JS gerado.", "Porque any só aceita booleanos.", "Porque JS não permite funções com argumentos.", "Porque any é reservado para arrays."], "answer": 0, "explanation": "Como o JS resultante tem um único método, o desenvolvedor diferencia os casos dentro dele com typeof/instanceof.", "id": "poo_a08_e09"}, {"id": "poo16", "subject": "poo", "lesson": "Aula 09 — Classes Abstratas e Interfaces", "difficulty": "medio", "question": "Sobre Classes Abstratas e Interfaces em TypeScript, qual afirmação está CORRETA?", "options": ["Classes abstratas não podem ser instanciadas diretamente com new; interfaces definem contratos (implementados com implements) e não possuem construtores.", "Interfaces são transpiladas para classes completas em JavaScript.", "Se uma classe herda de outra e implementa uma interface, implements deve vir antes de extends.", "Interfaces podem conter membros private com implementação completa."], "answer": 0, "explanation": "Classes abstract servem de base para subclasses sem instanciação direta. Interfaces são contratos puramente de checagem de tipos (não viram JS), sem construtor, e sempre vêm após extends (class Trator extends Brinquedo implements Mobilidade).", "official": true, "lessonNum": 9}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "facil", "question": "Qual palavra-chave é usada para declarar uma classe abstrata em TypeScript?", "options": ["abstract (ex.: export abstract class Brinquedo)", "virtual", "interface", "base"], "answer": 0, "explanation": "abstract impede a instanciação direta da classe e permite declarar métodos e campos abstratos.", "id": "poo_a09_e01"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "facil", "question": "O que acontece ao tentar executar new Brinquedo(100) se Brinquedo for declarada como abstract class?", "options": ["Erro de compilação: não é possível criar uma instância de uma classe abstrata.", "Cria um objeto vazio normalmente.", "Retorna null.", "Converte a classe em concreta automaticamente."], "answer": 0, "explanation": "Classes abstratas servem apenas como superclasses-base a serem estendidas por subclasses concretas.", "id": "poo_a09_e02"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "medio", "question": "Quando uma classe abstrata declara public abstract mover(): void; (sem corpo), o que as subclasses concretas são obrigadas a fazer?", "options": ["Implementar obrigatoriamente o método mover(): void com seu corpo concreto.", "Ignorar o método.", "Declarar o método como private.", "Remover a palavra extends."], "answer": 0, "explanation": "Métodos e atributos abstratos obrigam as subclasses concretas a fornecerem sua implementação.", "id": "poo_a09_e03"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "facil", "question": "Qual palavra-chave uma classe TypeScript utiliza para assumir o 'contrato' de uma interface?", "options": ["implements", "extends", "uses", "inherits"], "answer": 0, "explanation": "Classes estendem classes (extends) e implementam interfaces (implements).", "id": "poo_a09_e04"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "medio", "question": "O que acontece com uma interface TypeScript após o código ser transpilado para JavaScript pelo tsc?", "options": ["Nada é gerado em JavaScript; interfaces existem apenas em tempo de compilação para verificação de tipos.", "Ela vira uma classe completa no arquivo .js.", "Ela vira um arquivo JSON separado.", "Ela gera um erro no navegador."], "answer": 0, "explanation": "Interfaces têm custo zero em runtime, pois são usadas exclusivamente pelo verificador de tipos do TypeScript.", "id": "poo_a09_e05"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "medio", "question": "Em TypeScript, uma classe pode implementar múltiplas interfaces ao mesmo tempo (simulando 'herança múltipla' de contratos)?", "options": ["Sim, separando os nomes das interfaces por vírgula após implements.", "Não, apenas uma interface por classe.", "Apenas se não tiver construtor.", "Apenas em classes abstratas."], "answer": 0, "explanation": "Ex.: class Robo implements Mobilidade, Comunicacao { ... }.", "id": "poo_a09_e06"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "facil", "question": "Em uma interface TypeScript, qual é a visibilidade padrão dos membros declarados e é permitido declarar membros private?", "options": ["Todos os membros de interface são públicos; declarar membro private em interface gera erro.", "Todos são privados.", "Interfaces aceitam public, private e protected.", "Interfaces só aceitam construtores."], "answer": 0, "explanation": "Interfaces descrevem estritamente o contrato público do objeto.", "id": "poo_a09_e07"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "medio", "question": "Uma interface pode herdar de uma ou mais outras interfaces em TypeScript?", "options": ["Sim, utilizando a palavra-chave extends (ex.: interface Aluno extends Pessoa, Pessoa2).", "Não, interfaces nunca herdam.", "Sim, usando implements.", "Apenas de classes concretas."], "answer": 0, "explanation": "Interfaces podem estender múltiplas interfaces, compondo contratos reutilizáveis.", "id": "poo_a09_e08"}, {"subject": "poo", "lessonNum": 9, "lesson": "Aula 09 — Classes Abstratas e Interfaces", "official": false, "difficulty": "facil", "question": "Qual a diferença principal entre Classe Abstrata e Interface em TypeScript?", "options": ["Classe abstrata pode conter implementação concreta, construtor e atributos private/protected; interface define apenas assinaturas/tipos públicos sem implementação nem construtor.", "Interface pode ser instanciada com new.", "Classe abstrata não pode ter métodos concretos.", "São exatamente idênticas."], "answer": 0, "explanation": "Classes abstratas compartilham código e estado; interfaces definem contratos puros de tipo.", "id": "poo_a09_e09"}, {"id": "poo17", "subject": "poo", "lesson": "Aula 10 — Tratamento de Erros", "difficulty": "medio", "question": "Como lançar manualmente uma exceção em TypeScript/JavaScript e qual bloco de tratamento SEMPRE é executado, havendo erro ou não?", "options": ["Palavra-chave raise; bloco catch.", "Palavra-chave throw (ex.: throw new Error(...)); bloco finally.", "Palavra-chave error; bloco try.", "Palavra-chave break; bloco else."], "answer": 1, "explanation": "Lançamos exceções (nativas ou customizadas) com throw. Na estrutura try / catch / finally, o bloco finally sempre é executado ao término, independentemente de ocorrer exceção.", "official": true, "lessonNum": 10}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "facil", "question": "Como se acessa um atributo ou método declarado como static (membro estático) em uma classe TypeScript?", "options": ["Diretamente pelo nome da classe (ex.: Validador.emailValido(e)), sem precisar instanciar um objeto com new.", "Apenas através de uma instância com new.", "Usando a palavra super.", "Apenas dentro de um bloco catch."], "answer": 0, "explanation": "Membros static pertencem à classe em si, e não a instâncias individuais.", "id": "poo_a10_e01"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "facil", "question": "Qual a principal vantagem de usar tratamento de exceções (try/catch) em uma aplicação?", "options": ["Capturar situações anormais de execução e tratá-las de forma controlada, evitando paradas abruptas do programa ou vazamento de erros técnicos ao usuário.", "Aumentar a velocidade do processador.", "Substituir todos os comandos if/else.", "Impedir que o código seja compilado."], "answer": 0, "explanation": "Após o bloco catch tratar a exceção, o fluxo normal do programa pode continuar sem quebrar.", "id": "poo_a10_e02"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "medio", "question": "No exemplo da Aula 10 onde try executa let soma = x + y (com y não definido), o que acontece após o bloco catch exibir 'Tratamento do erro: y is not defined'?", "options": ["O programa continua sua execução normal nas linhas seguintes após o try/catch.", "O Node.js trava imediatamente.", "A variável y passa a valer 0.", "O bloco try roda novamente."], "answer": 0, "explanation": "Capturar a exceção no catch impede o encerramento abrupto do processo.", "id": "poo_a10_e03"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "medio", "question": "No exemplo da Aula 10, como são criadas classes de exceções customizadas como EmailInvalidoError ou SaldoInsuficienteError?", "options": ["Criando uma classe que implementa a interface Error (com propriedades name e message) e lançando-a com throw new SaldoInsuficienteError(...).", "Criando um arquivo .txt com a mensagem.", "Usando console.log('erro').", "Declarando um enum."], "answer": 0, "explanation": "Exceções customizadas permitem diferenciar tipos de falhas de negócio (saldo insuficiente vs valor inválido).", "id": "poo_a10_e04"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "medio", "question": "Quando lançamos múltiplos tipos de exceções customizadas (ex.: SaldoInsuficienteError e ValorInvalidoError), como diferenciá-los dentro do bloco catch(e)?", "options": ["Verificando o tipo com instanceof (ex.: if (e instanceof SaldoInsuficienteError)) ou inspecionando e.name.", "Usando vários blocos try dentro de um único catch sem teste.", "Não é possível diferenciar exceções em JS/TS.", "Usando typeof e === 'SaldoInsuficienteError'."], "answer": 0, "explanation": "instanceof permite aplicar um tratamento específico para cada classe de exceção capturada.", "id": "poo_a10_e05"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "facil", "question": "Um método static pode ser muito útil para qual tipo de operação em uma classe Usuario?", "options": ["Funções utilitárias de validação (como validar formato de e-mail ou tamanho de nome) que não dependem de uma instância já criada.", "Armazenar o nome individual de cada usuário.", "Substituir o construtor.", "Criar interfaces."], "answer": 0, "explanation": "Métodos estáticos centralizam utilitários e validações ligados à classe como um todo.", "id": "poo_a10_e06"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "medio", "question": "O que imprime o console no código abaixo da Aula 10?", "options": ["'Data inválida'", "1000", "undefined", "Nenhuma saída"], "answer": 0, "explanation": "Como 1000 \u003c 1900, throw new Error('Data inválida') é lançado e capturado no catch, exibindo e.message.", "code": "function calculaIdade(ano: number) {\n  if (ano \u003c 1900) throw new Error('Data inválida');\n}\ntry { calculaIdade(1000); } catch (e) { console.log(e.message); }", "id": "poo_a10_e07"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "facil", "question": "Qual propriedade padrão da classe Error guarda a mensagem descritiva do erro lançado?", "options": ["message", "text", "description", "info"], "answer": 0, "explanation": "new Error('mensagem') popula e.message (e e.name como 'Error').", "id": "poo_a10_e08"}, {"subject": "poo", "lessonNum": 10, "lesson": "Aula 10 — Tratamento de Erros", "official": false, "difficulty": "medio", "question": "Se nenhuma exceção ocorrer dentro do bloco try, o bloco catch será executado?", "options": ["Não; o bloco catch é totalmente ignorado e a execução segue para o finally (se houver) e para o resto do código.", "Sim, sempre executa.", "Apenas se houver return no try.", "Gera erro de compilação."], "answer": 0, "explanation": "catch só entra em ação quando algo dentro do try lança uma exceção.", "id": "poo_a10_e09"}, {"id": "poo18", "subject": "poo", "lesson": "Aula 11 — Evoluindo seu TypeScript", "difficulty": "facil", "question": "Qual tipo de dados em TypeScript permite definir um conjunto de constantes nomeadas (numéricas, texto ou heterogêneas) para maior legibilidade, e qual recurso permite definir um array de tamanho fixo com tipos distintos?", "options": ["enum e Tupla (ex.: [string, number, boolean])", "union e any", "type alias e rest", "number_set e interface"], "answer": 0, "explanation": "enum dá nomes amigáveis a conjuntos de constantes (por padrão numerados a partir de 0). Tuplas definem arrays de comprimento fixo com tipos específicos por posição.", "official": true, "lessonNum": 11}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "facil", "question": "Qual recurso do TypeScript permite que uma função receba uma quantidade variável/indefinida de argumentos reunidos em um array (ex.: function somar(...nums: number[]))?", "options": ["Parâmetros Rest (...)", "Tupla", "Enum", "Type Alias"], "answer": 0, "explanation": "O operador rest (...) agrupa todos os argumentos excedentes em um array tipado.", "id": "poo_a11_e01"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "facil", "question": "Qual é a sintaxe de um Union Type (tipo união) que permite à variável id aceitar tanto string quanto number?", "options": ["let id: string | number;", "let id: string & number;", "let id: [string, number];", "let id: string + number;"], "answer": 0, "explanation": "O caractere pipe (|) cria uma união de tipos permitidos.", "id": "poo_a11_e02"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "facil", "question": "Qual palavra-chave cria um Type Alias (apelido de tipo) reutilizável em TypeScript (ex.: type ID = string | number;)?", "options": ["type", "alias", "typedef", "rename"], "answer": 0, "explanation": "type permite dar nomes semânticos a uniões, tuplas ou tipos complexos.", "id": "poo_a11_e03"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "medio", "question": "Em uma Tupla declarada como let aluno: [string, number, boolean], o que acontece se tentarmos atribuir [10, 'Ana', true]?", "options": ["Erro de compilação, pois a tupla exige tipos e ordem exatos em cada posição.", "Compila normalmente porque os três tipos estão presentes.", "Converte 10 para '10' automaticamente.", "Ignora o primeiro valor."], "answer": 0, "explanation": "Tuplas fixam tanto a quantidade quanto a ordem exata dos tipos.", "id": "poo_a11_e04"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "medio", "question": "Em um enum numérico padrão enum Cor { Vermelho, Verde, Azul }, quais valores numéricos são atribuídos automaticamente?", "options": ["0, 1 e 2", "1, 2 e 3", "'Vermelho', 'Verde' e 'Azul'", "-1, 0 e 1"], "answer": 0, "explanation": "Enums numéricos iniciam em 0 e incrementam +1 automaticamente (salvo se um valor inicial for definido).", "id": "poo_a11_e05"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "medio", "question": "Qual opção no tsconfig.json impede que null e undefined sejam atribuídos a variáveis de tipos como string ou number (como em imprimirID(null))?", "options": ["\"strictNullChecks\": true", "\"noNull\": true", "\"allowNull\": false", "\"nullCheck\": off"], "answer": 0, "explanation": "Com strictNullChecks: true, null e undefined só são aceitos se incluídos explicitamente no tipo (ex.: string | null).", "id": "poo_a11_e06"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "medio", "question": "O que é Type Assertion (conversão/asserção de tipo) em TypeScript, como em (\u003cstring\u003evalor).length ou (valor as string).length?", "options": ["Informar ao compilador que você tem certeza de um tipo mais específico para aquela expressão.", "Converter um número em texto em tempo de execução como Number().", "Criar uma nova classe.", "Desativar o TypeScript."], "answer": 0, "explanation": "Type assertion orienta o compilador TS sem alterar o valor em runtime.", "id": "poo_a11_e07"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "facil", "question": "Em uma função com parâmetros normais e um parâmetro Rest (ex.: function saudar(prefixo: string, ...nomes: string[])), onde o parâmetro Rest deve ficar?", "options": ["Obrigatoriamente na última posição da lista de parâmetros.", "Na primeira posição.", "No meio da lista.", "Em qualquer posição."], "answer": 0, "explanation": "Um parâmetro rest coleta 'o resto' dos argumentos, devendo ser sempre o último.", "id": "poo_a11_e08"}, {"subject": "poo", "lessonNum": 11, "lesson": "Aula 11 — Evoluindo seu TypeScript", "official": false, "difficulty": "medio", "question": "Com let x: number | boolean | string;, qual atribuição abaixo gera ERRO de compilação em TypeScript?", "options": ["x = [1, 2, 3];", "x = 1;", "x = true;", "x = 'texto';"], "answer": 0, "explanation": "number[] não faz parte da união number | boolean | string.", "id": "poo_a11_e09"}, {"id": "poo19", "subject": "poo", "lesson": "Aula 12 — Generics e Decorators", "difficulty": "dificil", "question": "Observe a declaração abaixo. Quais recursos do TypeScript estão sendo aplicados?", "code": "function imprimirNome\u003cT extends temNome\u003e(obj: T) {\n  console.log(obj.nome);\n}", "options": ["Decorators de método e Herança múltipla.", "Generics com restrição de tipo (garantindo compatibilidade com a propriedade nome).", "Parâmetros REST e Tupla.", "Namespace interno e Union Type."], "answer": 1, "explanation": "\u003cT extends temNome\u003e usa Generics com restrição (constraint), permitindo reutilizar a função para qualquer classe/objeto compatível com a interface temNome.", "official": true, "lessonNum": 12}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "facil", "question": "Qual é o principal objetivo dos Generics (\u003cT\u003e) em TypeScript?", "options": ["Criar funções, interfaces e classes reutilizáveis que trabalham com diferentes tipos preservando a verificação de tipos do compilador (sem recorrer ao any).", "Substituir todas as tipagens por any.", "Aumentar o tamanho do arquivo JS.", "Criar estilos CSS dinâmicos."], "answer": 0, "explanation": "Generics garantem flexibilidade com segurança de tipos (type safety).", "id": "poo_a12_e01"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "facil", "question": "Na função genérica function info\u003cT\u003e(arg: T): T { return arg; }, se chamarmos info\u003cstring\u003e('IMD'), qual será o tipo de retorno garantido pelo compilador?", "options": ["string", "any", "number", "void"], "answer": 0, "explanation": "A variável de tipo T assume string na entrada e garante string na saída.", "id": "poo_a12_e02"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "medio", "question": "Na classe genérica class ListaGenerica\u003cT, K\u003e da Aula 12, para que servem as duas variáveis de tipo \u003cT, K\u003e?", "options": ["Permitem definir independentemente o tipo dos itens armazenados na lista (T) e o tipo do identificador _id (K) ao instanciar a classe.", "Restringem a classe a aceitar apenas 2 elementos.", "T significa Text e K significa Key obrigatoriamente.", "São parâmetros do construtor JS."], "answer": 0, "explanation": "Podemos instanciar new ListaGenerica\u003cnumber, string\u003e('xyz') ou new ListaGenerica\u003cstring, number\u003e(12).", "id": "poo_a12_e03"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "facil", "question": "Qual configuração deve ser habilitada no tsconfig.json para utilizar Decorators experimentais nas aulas de TypeScript do IMD?", "options": ["\"experimentalDecorators\": true", "\"useDecorators\": true", "\"decoratorsMode\": \"on\"", "\"allowAt\": true"], "answer": 0, "explanation": "Sem experimentalDecorators: true, o compilador TS acusa erro ao encontrar @decorator.", "id": "poo_a12_e04"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "facil", "question": "Quais três tipos de Decorators foram implementados na prática na Aula 12?", "options": ["Decorator de classe, Decorator de método e Decorator de propriedade.", "Decorator de HTML, CSS e SQL.", "Decorator de if, for e while.", "Decorator de array, string e number."], "answer": 0, "explanation": "A Aula 12 demonstra decorators aplicados a classes, métodos e propriedades.", "id": "poo_a12_e05"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "medio", "question": "O que é uma 'Decorator Factory' (como @decorator('AULA POO'))?", "options": ["Uma função que recebe argumentos de configuração e retorna a função decorator propriamente dita.", "Uma classe que gera arquivos HTML.", "Um decorator que nunca pode receber parâmetros.", "Um sinônimo de interface."], "answer": 0, "explanation": "Decorator factories permitem parametrizar o comportamento do decorator no ponto de aplicação.", "id": "poo_a12_e06"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "medio", "question": "Em um Decorator de Classe que substitui o construtor (retornando class extends construtor), o que isso permite fazer?", "options": ["Executar código personalizado (como logs ou registro de horário) antes e depois da execução do construtor original ao instanciar o objeto.", "Impedir que a classe seja compilada.", "Apagar todos os métodos da classe.", "Transformar a classe em enum."], "answer": 0, "explanation": "Estender o construtor no decorator intercepta cada instanciação via new.", "id": "poo_a12_e07"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "medio", "question": "No Decorator de Propriedade @validacao() da Aula 12 (classe ContaBancaria), qual recurso do JavaScript foi usado para interceptar leituras e escritas em _saldo?", "options": ["Object.defineProperty() com funções get() e set() (armazenando o valor por instância com Symbol).", "JSON.parse().", "document.getElementById().", "Array.prototype.map()."], "answer": 0, "explanation": "Object.defineProperty define getters/setters dinâmicos que lançam Error se o valor for negativo.", "id": "poo_a12_e08"}, {"subject": "poo", "lessonNum": 12, "lesson": "Aula 12 — Generics e Decorators", "official": false, "difficulty": "medio", "question": "Por que usar Generics (\u003cT\u003e) é superior a usar o tipo any em uma função identidade?", "options": ["Porque any desativa a checagem de tipos e perde a informação do tipo retornado, enquanto \u003cT\u003e preserva o tipo exato.", "Porque any gera erro de sintaxe.", "Porque \u003cT\u003e roda mais rápido no HTML.", "Não há diferença entre any e \u003cT\u003e."], "answer": 0, "explanation": "Generics mantêm autocompletar e validação estática do compilador.", "id": "poo_a12_e09"}, {"id": "poo20", "subject": "poo", "lesson": "Aula 13 — Módulos e Namespaces", "difficulty": "dificil", "question": "Qual a sintaxe usada para anexar um Decorator em TypeScript, e qual a diferença entre export nomeado e export default em Módulos?", "options": ["Sintaxe @expressao; com export default, quem importa não usa chaves e pode escolher livremente o nome local.", "Sintaxe #expressao; com export default é obrigatório usar o nome exato entre chaves.", "Sintaxe $expressao; módulos não criam escopo local em arquivos .ts.", "Sintaxe ::expressao; export default só funciona dentro de namespaces."], "answer": 0, "explanation": "Decorators usam @expression (ex.: @validacao()). Em módulos, export default permite importação sem chaves com nome livre (ex.: import Empregado from \"modulo-funcionario\").", "official": true, "lessonNum": 13}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "facil", "question": "Quais são as duas formas apresentadas na Aula 13 para organizar projetos TypeScript maiores e evitar colisões de nomes?", "options": ["Namespaces (agrupamento lógico interno) e Módulos (arquivos com escopo local usando export/import).", "Tabelas e Formulários.", "Tuplas e Enums.", "Loops e Condicionais."], "answer": 0, "explanation": "Namespaces agrupam logicamente sob um nome; Módulos (padrão moderno) dão escopo local a cada arquivo .ts.", "id": "poo_a13_e01"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "facil", "question": "Qual palavra-chave é necessária antes de uma função ou classe dentro de um namespace para torná-la acessível do lado de fora?", "options": ["export", "public", "open", "global"], "answer": 0, "explanation": "Sem export, variáveis/funções dentro de um namespace ficam privadas ao próprio namespace (ex.: tamanhoMaximo).", "id": "poo_a13_e02"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "medio", "question": "Como referenciar um namespace definido em outro arquivo (ex.: StringUtils.ts) sem usar import/export de módulos?", "options": ["/// \u003creference path=\"StringUtils.ts\" /\u003e", "include(\"StringUtils.ts\");", "\u003clink href=\"StringUtils.ts\"\u003e", "@namespace(\"StringUtils.ts\")"], "answer": 0, "explanation": "A diretiva de barra tripla /// \u003creference path='...' /\u003e conecta arquivos de namespace.", "id": "poo_a13_e03"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "facil", "question": "Em Módulos TypeScript, qual comando importa TODOS os elementos exportados de 'modulo-exemplo' agrupados sob o alias 'ex'?", "options": ["import * as ex from 'modulo-exemplo';", "import all ex from 'modulo-exemplo';", "import { * } from 'modulo-exemplo';", "export * as ex from 'modulo-exemplo';"], "answer": 0, "explanation": "import * as ex permite acessar ex.mensagem e ex.teste().", "id": "poo_a13_e04"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "facil", "question": "Em um arquivo .ts que utiliza export ou import, qual é o escopo de uma variável declarada fora de classes/funções SEM a palavra export?", "options": ["Escopo local ao próprio módulo (invisível para outros arquivos).", "Escopo global em todo o navegador.", "Fica acessível automaticamente em qualquer arquivo.", "Gera erro de sintaxe."], "answer": 0, "explanation": "Módulos isolam seu escopo: somente o que é explicitamente exportado pode ser importado fora.", "id": "poo_a13_e05"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "facil", "question": "Como importar itens específicos (exportações nomeadas) de um módulo 'modulo-exemplo'?", "options": ["import { mensagem, teste } from 'modulo-exemplo';", "import mensagem, teste from 'modulo-exemplo';", "require(mensagem, teste);", "get { mensagem } from 'modulo-exemplo';"], "answer": 0, "explanation": "Exportações nomeadas são importadas entre chaves { } com seus respectivos nomes.", "id": "poo_a13_e06"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "medio", "question": "Quantas exportações 'export default' um único módulo TypeScript pode ter?", "options": ["No máximo uma exportação default por arquivo.", "Quantas quiser.", "Exatamente três.", "Nenhuma."], "answer": 0, "explanation": "Cada módulo pode ter apenas um export default, mas pode ter vários exports nomeados.", "id": "poo_a13_e07"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "facil", "question": "Qual problema os namespaces e módulos resolvem quando um projeto cresce e passa a ter dezenas de arquivos?", "options": ["Evitam colisão de nomes no escopo global e organizam o código por responsabilidade lógica.", "Substituem o HTML da página.", "Eliminam a necessidade de instalar o Node.js.", "Convertem CSS em TypeScript."], "answer": 0, "explanation": "Sem módulos/namespaces, variáveis com o mesmo nome em arquivos diferentes colidem no escopo global.", "id": "poo_a13_e08"}, {"subject": "poo", "lessonNum": 13, "lesson": "Aula 13 — Módulos e Namespaces", "official": false, "difficulty": "medio", "question": "Na sintaxe de importação de módulos, por que normalmente NÃO colocamos a extensão '.ts' no caminho (ex.: import { Carro } from 'modulo-carro')?", "options": ["Porque o compilador e o carregador de módulos resolvem automaticamente a extensão
