  <style>
    :root {
      --bg-main: #F7F1E1;
      --bg-surface: #EFE6D0;
      --bg-card: #FAF5E8;
      --bg-code: #231E18;
      --border-soft: #DFD2B5;
      --border-strong: #C9B791;
      --ink-primary: #1F1A14;
      --ink-secondary: #5B4F40;
      --ink-muted: #7C6E5B;
      --accent: #9A4A1C;
      --accent-hover: #7D3B14;
      --accent-soft: #F0DFC8;
      --ok-bg: #E4EFE2;
      --ok-border: #5E945A;
      --ok-ink: #234E21;
      --err-bg: #F4E1DC;
      --err-border: #B85242;
      --err-ink: #6D2217;
      --warn-bg: #F5E9C8;
      --warn-border: #B9872A;
      --warn-ink: #664910;
      --font-scale: 1;
    }

    [data-theme="dark"] {
      --bg-main: #1A1612;
      --bg-surface: #231E18;
      --bg-card: #2A241D;
      --bg-code: #14110E;
      --border-soft: #3E352B;
      --border-strong: #574B3D;
      --ink-primary: #F2E9D8;
      --ink-secondary: #CBBCA6;
      --ink-muted: #9C8D78;
      --accent: #D98348;
      --accent-hover: #E59761;
      --accent-soft: #3B2B1E;
      --ok-bg: #1F3220;
      --ok-border: #558F54;
      --ok-ink: #B7E4B4;
      --err-bg: #3A201C;
      --err-border: #C45E4E;
      --err-ink: #F5BDB4;
      --warn-bg: #3A301A;
      --warn-border: #C4943A;
      --warn-ink: #F2D79B;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--ink-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: calc(16px * var(--font-scale));
      line-height: 1.55;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .bg-main { background-color: var(--bg-main); }
    .bg-surface { background-color: var(--bg-surface); }
    .bg-card { background-color: var(--bg-card); }
    .border-soft { border-color: var(--border-soft); }
    .border-strong { border-color: var(--border-strong); }
    .text-primary { color: var(--ink-primary); }
    .text-secondary { color: var(--ink-secondary); }
    .text-muted { color: var(--ink-muted); }
    .bg-accent { background-color: var(--accent); color: #FAF5E8; }
    .bg-accent:hover { background-color: var(--accent-hover); }
    .bg-accent-soft { background-color: var(--accent-soft); color: var(--accent); }
    .text-accent { color: var(--accent); }
    .border-accent { border-color: var(--accent); }

    .state-ok { background-color: var(--ok-bg); border-color: var(--ok-border); color: var(--ok-ink); }
    .state-err { background-color: var(--err-bg); border-color: var(--err-border); color: var(--err-ink); }
    .state-warn { background-color: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-ink); }

    pre.code-block {
      background-color: var(--bg-code);
      color: #F3EAD8;
      border: 1px solid var(--border-strong);
      border-radius: 0.75rem;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.5;
      margin: 0.75rem 0;
      white-space: pre;
    }

    .option-btn {
      transition: transform 0.12s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background-color: var(--bg-surface);
    }
    .option-btn:active:not(:disabled) {
      transform: scale(0.995);
    }
    .option-btn.selected {
      border-color: var(--accent);
      background-color: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .option-btn.correct {
      background-color: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-ink);
      box-shadow: inset 0 0 0 1px var(--ok-border);
    }
    .option-btn.wrong {
      background-color: var(--err-bg);
      border-color: var(--err-border);
      color: var(--err-ink);
      box-shadow: inset 0 0 0 1px var(--err-border);
    }

    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-surface); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
  </style>
</head>

  </div>

nativa que indica uma desvantagem das linguagens interpretadas que necessitam de máquina virtual para execução:", "options": ["Não realizar várias verificações prévias e gerar um código de saída compatível independentemente da máquina alvo.", "Um programa escrito na linguagem pode, em teoria, ser executado em qualquer máquina virtual.", "Possuir alta portabilidade entre sistemas operacionais.", "Poder escrever programas em editores de texto simples sem compilador dedicado."], "answer": 0, "explanation": "Diferente de linguagens compiladas que fazem diversas checagens antes da execução, linguagens interpretadas deixam verificações para o tempo de execução e dependem do interpretador/VM.", "official": true, "lessonNum": 1}, {"id": "pe05", "subject": "pe", "lesson": "Aula 01 — Introdução à Programação Estruturada e JavaScript", "difficulty": "medio", "question": "Considerando o modelo de implementação utilizado na disciplina de Programação Estruturada com JavaScript, como os programas são vistos?", "options": ["Como sequências de comandos incompletos que realizam procedimentos usuais.", "Exclusivamente como objetos que interagem entre si por troca de mensagens.", "Não podem ser classificados em nenhum paradigma.", "Como uma sequência de comandos usando atribuições, chamadas de funções, condicionais, laços de repetição e estruturas em bloco."], "answer": 3, "explanation": "Na Programação Estruturada, programas são estruturados em sequências de comandos com atribuições, funções, seleção (if/switch), repetição (for/while) e blocos.", "official": true, "lessonNum": 1}, {"id": "pe06", "subject": "pe", "lesson": "Aula 01 — Introdução à Programação Estruturada e JavaScript", "difficulty": "facil", "question": "Sobre a linguagem JavaScript, selecione a alternativa que NÃO indica uma de suas características:", "options": ["Interpretada pelos navegadores", "Dependente de plataforma", "Fracamente tipada", "Multiparadigma"], "answer": 1, "explanation": "JavaScript é independente d "Em JavaScript, uma variável declarada sem atribuição inicial recebe automaticamente o valor e o tipo undefined.", "code": "var x;", "id": "pe_a02_e01"}, {"subject": "pe", "lessonNum": 2, "lesson": "Aula 02 — Tipos de Dados", "official": false, "difficulty": "medio", "question": "Qual será o valor final da variável x após avaliar a expressão abaixo?", "options": ["151olá mundo128 teste1231", "16olá mundo20 teste1231", "5101olá mundo128 teste124", "16olá mundo128 teste1231"], "answer": 3, "explanation": "Primeiro soma-se (5+10)+1 = 16; ao encontrar a string 'olá mundo', o operador + passa a concatenar tudo à direita como texto: '16olá mundo128 teste1231'.", "code": "var x = (5+10) + 1 + \"olá mundo\" + 12 + 8 + \" teste123\" + 1;", "id": "pe_a02_e02"}, {"subject": "pe", "lessonNum": 2, "lesson": "Aula 02 — Tipos de Dados", "official": false, "difficulty": "facil", "question": "Em JavaScript, o valor especial null representa:", "options": ["Um erro de sintaxe fatal no navegador.", "Ausência intencional de valor ('nada', 'vazio' ou 'valor desconhecido').", "O número inteiro zero.", "Uma string contendo apenas espaços."], "answer": 1, "explanation": "null é um valor primitivo atribuído deliberadamente para indicar ausência de valor ou objeto.", "id": "pe_a02_e03"}, {"subject": "pe", "lessonNum": 2, "lesson": "Aula 02 — Tipos de Dados", "official": false, "difficulty": "facil", "question": "Qual operador JavaScript permite descobrir o tipo de dado de um valor ou expressão (ex.: retornar 'number', 'string' ou 'boolean')?", "options": ["type()", "typeof", "instance", "getType()"], "answer": 1, "explanation": "O operador typeof retorna uma string indicando o tipo do operando, como typeof 42 === 'number'.", "id": "pe_a02_e04"}, {"subject": "pe", "lessonNum": 2, "lesson": "Aula 02 — Tipos de Dados", "official": false, "difficulty": "medio", "question": "Qual função nativa é usada para converter um texto lido de um campo \u003cinput\u003e (como '7.5') em número antes de somar notas?", "options": ["Number()", "String()", "Boolean()", "Text()"], "answer": 0, "explanation": "Valores vindos de input.value são strings. Number('7.5') converte para 7.5, evitando concatenação textual no operador +.", "id": "pe_a02_e05"}, {"subject": "pe", "lessonNum": 2, "lesson": "Aula 02 — Tipos de Dados", "official": false, "difficulty": "medio", "question": "O que resulta da operação Number('IMD') em JavaScript?", "options": ["0", "null", "NaN", "false"], "answer": 2, "explanation": "Quando uma string não representa um número válido, a conversão numérica resulta em NaN (Not-a-Number).", "id": "pe_a02_e06"}, {"subject": "pe", "lessonNum": 2, "lesson": "Aula 02 — Tipos de Dados", "official": false, "difficulty": "facil", "question": "Qual alternativa lista apenas valores do tipo boolean em JavaScript?", "options": ["0 e 1", "'true' e 'false'", "true e false", "null e undefined"], "answer": 2, "explanation": "Booleanos literais em JavaScript são estritamente true e false (sem aspas).", "id": "pe_a02_e07"}, {"subject": "pe", "lessonNum": 2, "lesson": "Aula 02 — Tipos de Dados", "official": false, "difficulty": "dificil", "question": "Em JavaScript, qual é o resultado de typeof NaN e typeof undefined, respectivamente?", "options": ["'NaN' e 'undefined'", "'number' e 'undefined'", "'undefined' e 'null'", "'object' e 'undefined'"], "answer": 1, "explanation": "NaN é um valor especial pertencente ao tipo 'number', enquanto undefined tem tipo próprio 'undefined'.", "id": "pe_a02_e08"}, {"id": "pe09", "subject": "pe", "lesson": "Aula 03 — Variáveis e Constantes", "difficulty": "facil", "question": "Marque a alternativa que NÃO apresenta um identificador válido para variáveis em JavaScript:", "options": ["C4m3lC4s$", "camel-case", "camelCase", "camel_case"], "answer": 1, "explanation": "Em JavaScript, identificadores podem conter letras, dígitos, _ e $, mas NÃO podem conter hífen (-), pois o hífen é interpretado como operador de subtração.", "official": true, "lessonNum": 3}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "facil", "question": "Qual palavra reservada foi tradicionalmente apresentada na Aula 01/03 para declarar variáveis em JavaScript, e qual declara constantes?", "options": ["var e const", "type e fixed", "class e final", "int e const"], "answer": 0, "explanation": "var (e let no ES6+) declara variáveis mutáveis; const declara constantes cujo valor deve ser definido na declaração.", "id": "pe_a03_e01"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "medio", "question": "Analise o código abaixo. O que acontece ao tentar calcular var k = z + 2?", "options": ["k recebe 22", "k recebe undefined", "k recebe 12", "Ocorre erro (ReferenceError), pois z foi declarada com let dentro do bloco if e não existe fora dele"], "answer": 3, "explanation": "Variáveis declaradas com let possuem escopo de bloco ({ }), deixando de ser acessíveis após o fechamento da chave.", "code": "var x = 10;\nif (x == 10) {\n  let z = x * 2;\n}\nvar k = z + 2;", "id": "pe_a03_e02"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "facil", "question": "Sobre constantes (const) em JavaScript, avalie:\nI. São referenciadas a partir de seus nomes.\nII. O valor de uma constante deve ser definido no momento da declaração.\nQual alternativa está correta?", "options": ["As afirmativas I e II estão incorretas.", "As afirmativas I e II estão corretas.", "Apenas I está correta.", "Apenas II está correta."], "answer": 1, "explanation": "Constantes precisam ser inicializadas na declaração e não permitem reatribuição posterior.", "id": "pe_a03_e03"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "medio", "question": "Qual diretiva inserida no topo de um script ativa o modo estrito em JavaScript, impedindo o uso acidental de variáveis não declaradas?", "options": ["'use strict';", "'strict mode';", "enable strict;", "#strict"], "answer": 0, "explanation": "A diretiva 'use strict'; força verificações mais rígidas, como lançar ReferenceError ao atribuir a uma variável não declarada.", "id": "pe_a03_e04"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "medio", "question": "Qual afirmação descreve corretamente o escopo de blocos introduzido no ECMAScript 2015 (ES6)?", "options": ["Blocos são delimitados por colchetes [ ].", "Blocos são delimitados por chaves { } e variáveis let/const ficam restritas a esse bloco.", "Antes do ES6, var já tinha escopo de bloco.", "Variáveis globais só existem dentro de funções."], "answer": 1, "explanation": "Em JS, blocos usam chaves { }. Antes do ES6 só havia escopo global e de função; o ES6 introduziu escopo de bloco com let e const.", "id": "pe_a03_e05"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "facil", "question": "O que acontece ao tentar executar o código abaixo?", "options": ["PI passa a valer 3.1415.", "Ocorre um TypeError, pois não é permitido reatribuir uma constante.", "PI vira undefined.", "O navegador ignora silenciosamente sem erro."], "answer": 1, "explanation": "Reatribuir um valor a uma variável declarada com const gera TypeError: Assignment to constant variable.", "code": "const PI = 3.14;\nPI = 3.1415;", "id": "pe_a03_e06"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "medio", "question": "Sobre atribuições especiais compostas, qual código é equivalente a a = a % b?", "options": ["a %= b;", "a =% b;", "a mod= b;", "a /%= b;"], "answer": 0, "explanation": "O operador %= atribui à variável à esquerda o resto da divisão dela pelo operando à direita.", "id": "pe_a03_e07"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "facil", "question": "Como incluir um arquivo JavaScript externo chamado Atividade_03_1.js na mesma pasta do HTML?", "options": ["\u003cscript src=\"Atividade_03_1.js\"\u003e\u003c/script\u003e", "\u003clink href=\"Atividade_03_1.js\"\u003e", "\u003cjs file=\"Atividade_03_1.js\"\u003e", "\u003cimport src=\"Atividade_03_1.js\"\u003e"], "answer": 0, "explanation": "A tag \u003cscript src='arquivo.js'\u003e\u003c/script\u003e vincula scripts externos à página HTML.", "id": "pe_a03_e08"}, {"subject": "pe", "lessonNum": 3, "lesson": "Aula 03 — Variáveis e Constantes", "official": false, "difficulty": "dificil", "question": "Em JavaScript, qual o valor exibido no console pelo código abaixo?", "options": ["10", "20", "undefined", "Erro de sintaxe"], "answer": 0, "explanation": "A variável let a = 20 existe apenas no bloco interno, sombreando a externa. Fora do bloco, a continua valendo 10.", "code": "let a = 10;\n{\n  let a = 20;\n}\nconsole.log(a);", "id": "pe_a03_e09"}, {"id": "pe10", "subject": "pe", "lesson": "Aula 04 — Funções", "difficulty": "facil", "question": "Qual alternativa apresenta uma declaração VÁLIDA de uma função chamada \"media\" em JavaScript?", "options": ["function void media(int [] val){}", "function media(int[] val){}", "function void media(val){}", "function media(val){}"], "answer": 3, "explanation": "JavaScript é fracamente tipado e não usa tipos como void ou int[] na assinatura da função. A sintaxe correta é function media(val){}.", "official": true, "lessonNum": 4}, {"id": "pe11", "subject": "pe", "lesson": "Aula 04 — Funções", "difficulty": "facil", "question": "Qual palavra-chave reservada do JavaScript permite retornar um valor de uma função, e o que são bibliotecas em programação?", "options": ["return; e bibliotecas são conjuntos de funções testadas de uso mais comum.", "console.log(); e bibliotecas são repositórios de livros em PDF.", "document.write; e bibliotecas são o processo de quebrar funções grandes.", "output; e bibliotecas são encadeamentos de variáveis globais."], "answer": 0, "explanation": "A palavra-chave return devolve um valor ao ponto onde a função foi chamada, e bibliotecas reúnem módulos/funções prontas de uso comum (como Math, String e Date).", "official": true, "lessonNum": 4}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "facil", "question": "Sobre modularização de programas, qual técnica consiste em dividir um problema grande e complexo em funções menores e mais simples?", "options": ["Dividir para conquistar", "Recursão infinita", "Tipagem estática", "Compilação cruzada"], "answer": 0, "explanation": "Modularizar é aplicar 'dividir para conquistar', facilitando leitura, reuso e manutenção do código.", "id": "pe_a04_e01"}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "facil", "question": "O que uma função JavaScript retorna por padrão se não possuir nenhuma instrução return?", "options": ["0", "null", "undefined", "false"], "answer": 2, "explanation": "Funções sem return explícito sempre retornam undefined ao chamador.", "id": "pe_a04_e02"}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "medio", "question": "Qual é a principal vantagem de passar argumentos via parâmetros em vez de depender apenas de variáveis globais dentro de funções?", "options": ["Aumenta o acoplamento entre partes do código.", "Torna a função reutilizável, previsível e independente do restante do programa.", "Impede que a função retorne valores.", "Obriga o uso de bibliotecas externas."], "answer": 1, "explanation": "Parâmetros isolam a função, permitindo chamá-la com diferentes entradas sem efeitos colaterais globais.", "id": "pe_a04_e03"}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "medio", "question": "Analise a função abaixo. Qual será o valor retornado por calcular(4, 6)?", "options": ["10", "5", "24", "undefined"], "answer": 1, "explanation": "A função soma 4 + 6 = 10 e divide por 2, retornando 5.", "code": "function calcular(a, b) {\n  return (a + b) / 2;\n}", "id": "pe_a04_e04"}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "facil", "question": "O que acontece com instruções escritas dentro de uma função APÓS a execução de um comando return?", "options": ["São executadas normalmente no fim do script.", "Não são executadas, pois return encerra imediatamente a função.", "Geram erro de compilação no navegador.", "São repetidas em laço."], "answer": 1, "explanation": "O comando return encerra a execução da função naquele ponto e devolve o controle ao chamador.", "id": "pe_a04_e05"}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "medio", "question": "Em um código com funções encadeadas onde calcularSituacao() chama calcularMedia(), o que ocorre primeiro?", "options": ["calcularMedia() é executada e devolve seu resultado para calcularSituacao() prosseguir.", "Ambas terminam sem retornar valores.", "calcularSituacao() ignora o retorno de calcularMedia().", "O navegador bloqueia funções chamando outras funções."], "answer": 0, "explanation": "Ao chamar uma função auxiliar, a execução desvia para ela, obtém o valor retornado e retoma a função chamadora.", "id": "pe_a04_e06"}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "medio", "question": "Na biblioteca nativa Math do JavaScript, qual função retorna o maior valor entre os números passados como argumentos?", "options": ["Math.max()", "Math.high()", "Math.top()", "Math.ceil()"], "answer": 0, "explanation": "Math.max(a, b, c) retorna o maior número informado; Math.ceil() arredonda para cima.", "id": "pe_a04_e07"}, {"subject": "pe", "lessonNum": 4, "lesson": "Aula 04 — Funções", "official": false, "difficulty": "dificil", "question": "Qual será a saída no console ao executar o código abaixo?", "options": ["15", "10", "5", "NaN"], "answer": 0, "explanation": "dobro(5) retorna 10; somar(10, 5) retorna 15.", "code": "function dobro(n) { return n * 2; }\nfunction somar(a, b) { return a + b; }\nconsole.log(somar(dobro(5), 5));", "id": "pe_a04_e08"}, {"id": "pe12", "subject": "pe", "lesson": "Aula 05 — Entendendo o seu Código: depuração", "difficulty": "facil", "question": "Fazem parte dos conceitos ou funcionalidades do processo de depuração no navegador, EXCETO:", "options": ["Watch Dog", "Resume", "Call Stack", "Breakpoint"], "answer": 0, "explanation": "Na depuração (DevTools), usamos Breakpoint, Call Stack, Watch (lista de observação), Resume, Step Over, Step Into e Step Out. \"Watch Dog\" não é um recurso de depuração JS.", "official": true, "lessonNum": 5}, {"id": "pe13", "subject": "pe", "lesson": "Aula 05 — Entendendo o seu Código: depuração", "difficulty": "facil", "question": "Sobre o processo de depuração, qual alternativa define corretamente o papel de um Breakpoint?", "options": ["Verifica e corrige automaticamente erros de sintaxe do programa.", "Permite definir pontos específicos do código para interromper a execução e analisar variáveis.", "Só pode ser definido uma única vez por arquivo JavaScript.", "Exibe automaticamente todos os erros lógicos sem precisar executar o script."], "answer": 1, "explanation": "O breakpoint pausa a execução do programa exatamente na linha marcada, permitindo inspecionar valores na memória e a pilha de chamadas. É o recurso obrigatório para iniciar uma parada no debug.", "official": true, "lessonNum": 5}, {"id": "pe14", "subject": "pe", "lesson": "Aula 05 — Entendendo o seu Código: depuração", "difficulty": "medio", "question": "Avalie as afirmativas sobre erros em JavaScript:\nI. Erro de sintaxe ocorre quando não se obedecem às regras de codificação da linguagem.\nII. Erros lógicos podem ser difíceis de detectar, pois o programa executa até o fim, mas gera resultado diferente do esperado.\nIII. Erros lógicos sempre provocam erros de sintaxe.\nMarque a alternativa correta:", "options": ["Apenas as afirmativas II e III estão corretas.", "Apenas as afirmativas I e III estão corretas.", "As afirmativas I, II e III estão corretas.", "Apenas as afirmativas I e II estão corretas."], "answer": 3, "explanation": "I e II são verdadeiras. A afirmativa III é falsa porque um programa com erro lógico pode estar sintaticamente perfeito e executar sem travar.", "official": true, "lessonNum": 5}, {"subject": "pe", "lessonNum": 5, "lesson": "Aula 05 — Entendendo o seu Código: depuração", "official": false, "difficulty": "facil", "question": "Na ferramenta de depuração (DevTools), qual painel permite acompanhar continuamente o valor de variáveis ou expressões específicas?", "options": ["Watch", "Network", "Elements", "Application"], "answer": 0, "explanation": "O painel Watch (lista de observação) monitora expressões e variáveis a cada passo da depuração.", "id": "pe_a05_e01"}, {"subject": "pe", "lessonNum": 5, "lesson": "Aula 05 — Entendendo o seu Código: depuração", "official": false, "difficulty": "facil", "question": "Qual comando imprime mensagens ou valores de variáveis no console do navegador durante a depuração?", "options": ["console.log()", "console.print()", "println()", "printf()"], "answer": 0, "explanation": "console.log(...) é o método padrão para registrar saídas de diagnóstico no console do navegador.", "id": "pe_a05_e02"}, {"subject": "pe", "lessonNum": 5, "lesson": "Aula 05 — Entendendo o seu Código: depuração", "official": false, "difficulty": "medio", "question": "Durante a depuração no Chrome DevTools, qual é o comportamento do comando 'Step Over' quando a execução está pausada em uma linha que chama uma função?", "options": ["Entra dentro da função chamada linha por linha.", "Executa a linha inteira (incluindo a função chamada) e pausa na próxima linha sem entrar no corpo da função.", "Encerra o depurador imediatamente.", "Pula a linha sem executar a função."], "answer": 1, "explanation": "Step Over 'passa por cima' da função: executa-a por completo, obtém o retorno e para na linha seguinte.", "id": "pe_a05_e03"}, {"subject": "pe", "lessonNum": 5, "lesson": "Aula 05 — Entendendo o seu Código: depuração", "official": false, "difficulty": "medio", "question": "Qual comando do depurador deve ser usado quando estamos pausados em uma chamada de função e queremos ENTRAR no código interno dela?", "options": ["Step Into", "Step Over", "Step Out", "Resume"], "answer": 0, "explanation": "Step Into entra na função chamada para depurar cada linha de seu escopo interno.", "id": "pe_a05_e04"}, {"subject": "pe", "lessonNum": 5, "lesson": "Aula 05 — Entendendo o seu Código: depuração", "official": false, "difficulty": "medio", "question": "Na Call Stack (Pilha de Chamadas) aparecem, do topo para a base: media → resultado → situacao → onclick. Se executarmos 'Step Out' agora, o que acontece?", "options": ["A função media termina de executar e a pausa retorna para a função resultado.", "O programa reinicia desde onclick.", "Todos os breakpoints são removidos.", "O código entra em recursão."], "answer": 0, "explanation": "Step Out conclui a função atual no topo da pilha (media) e pausa assim que retorna à função que a chamou (resultado).", "id": "pe_a05_e05"}, {"subject": "pe", "lessonNum": 5, "lesson": "Aula 05 — Entendendo o seu Código: depuração", "official": false, "difficulty": "facil", "question": "Qual comando da depuração retoma a execução normal do script até encontrar o próximo breakpoint ou o fim do programa?", "options": ["Resume", "Step Over", "Watch", "Break"], "answer": 0, "explanation": "Resume (F8) continua a execução contínua até o próximo ponto de parada.", "id": "pe_a05_e06"}, {"subject": "pe", "lessonNum": 5, "lesson": "Aula 05 — Entendendo o seu Código: depuração", "official": false, "difficulty": "dificil", "question": "Qual recurso é considerado obrigatório definir para pausar a execução e iniciar a inspeção passo a passo na ferramenta de depuração?", "options": ["Breakpoint", "Watch list", "Call Stack", "Step Into"], "answer": 0, "explanation": "Sem ao menos um Breakpoint (ou instrução debugger), o código roda direto até o fim sem pausar para inspeção.", "id": "pe_a05_e07"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "facil", "question": "Qual é o resultado da expressão JavaScript abaixo respeitando a precedência de operadores?", "options": ["85", "32", "42", "22"], "answer": 1, "explanation": "Divisão e multiplicação têm precedência sobre soma e executam da esquerda para a direita: 10/2 = 5; 5*5 = 25; 7 + 25 = 32.", "code": "7 + 10 / 2 * 5", "id": "pe_a06_e01"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "facil", "question": "Qual operador aritmético retorna o resto da divisão inteira entre dois números em JavaScript?", "options": ["/", "%", "**", "//"], "answer": 1, "explanation": "O operador módulo (%) devolve o resto da divisão inteira (ex.: 10 % 3 === 1).", "id": "pe_a06_e02"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "facil", "question": "Qual expressão calcula corretamente 2 elevado à 3ª potência em JavaScript moderno (ou usando Math)?", "options": ["2 ** 3 ou Math.pow(2, 3)", "2 ^ 3", "Math.exp(2, 3)", "2 // 3"], "answer": 0, "explanation": "Em JS, potenciação usa o operador ** (ES7) ou Math.pow(base, expoente). O símbolo ^ é XOR bit a bit.", "id": "pe_a06_e03"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "medio", "question": "Qual a diferença entre Math.floor(4.7), Math.ceil(4.2) e Math.round(4.5)?", "options": ["Retornam respectivamente 4, 5 e 5.", "Retornam respectivamente 5, 4 e 4.", "Todos retornam 4.", "Todos retornam 5."], "answer": 0, "explanation": "Math.floor arredonda para baixo (4), Math.ceil arredonda para cima (5) e Math.round arredonda para o inteiro mais próximo (5).", "id": "pe_a06_e04"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "facil", "question": "Qual método da biblioteca Math retorna a raiz quadrada de um número?", "options": ["Math.sqrt()", "Math.root()", "Math.sqr()", "Math.pow2()"], "answer": 0, "explanation": "Math.sqrt(9) retorna 3.", "id": "pe_a06_e05"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "medio", "question": "O que retorna Math.random() em JavaScript?", "options": ["Um inteiro aleatório entre 1 e 100.", "Um número decimal pseudoaleatório no intervalo [0, 1) (maior ou igual a 0 e menor que 1).", "Um valor booleano aleatório.", "Sempre um número negativo."], "answer": 1, "explanation": "Math.random() gera um número de ponto flutuante \u003e= 0 e \u003c 1.", "id": "pe_a06_e06"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "medio", "question": "Qual será o valor final de x após executar o código abaixo?", "options": ["5", "6", "10", "11"], "answer": 3, "explanation": "x começa em 5; x += 4 -\u003e 9; x++ -\u003e 10; ++x -\u003e 11.", "code": "var x = 5;\nx += 4;\nx++;\n++x;", "id": "pe_a06_e07"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "medio", "question": "Qual será o resultado de 20 % 10 em JavaScript?", "options": ["2", "0", "10", "0.5"], "answer": 1, "explanation": "20 dividido por 10 é 2 com resto exato 0.", "id": "pe_a06_e08"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "facil", "question": "Qual método retorna o valor absoluto (sem sinal negativo) de um número em JavaScript?", "options": ["Math.abs()", "Math.pos()", "Math.sign()", "Math.mod()"], "answer": 0, "explanation": "Math.abs(-15) retorna 15.", "id": "pe_a06_e09"}, {"subject": "pe", "lessonNum": 6, "lesson": "Aula 06 — Operadores JavaScript: Aritmética", "official": false, "difficulty": "dificil", "question": "Qual a diferença entre pré-incremento (++x) e pós-incremento (x++) quando usados em uma atribuição como var y = x++;?", "options": ["Não há diferença alguma.", "Em y = x++, y recebe o valor antigo de x e depois x é incrementado; em y = ++x, x é incrementado primeiro e o novo valor vai para y.", "x++ soma 2 e ++x soma 1.", "++x só funciona dentro de laços for."], "answer": 1, "explanation": "No pós-incremento o valor original é avaliado antes da soma; no pré-incremento a soma ocorre antes da avaliação.", "id": "pe_a06_e10"}, {"id": "pe15", "subject": "pe", "lesson": "Aula 07 — Operadores JavaScript: Strings", "difficulty": "facil", "question": "Qual método de String em JavaScript remove todos os espaços em branco no início e no fim de um texto?", "options": ["concat()", "slice()", "trim()", "substring()"], "answer": 2, "explanation": "O método trim() retorna a string sem espaços extras nas extremidades (início e fim), sem alterar espaços internos.", "official": true, "lessonNum": 7}, {"id": "pe16", "subject": "pe", "lesson": "Aula 07 — Operadores JavaScript: Strings", "difficulty": "medio", "question": "Analise o código abaixo baseado na Aula de Strings do IMDTEC. Qual será o valor de resultado?", "code": "var string_1 = \"IMD\";\nvar string_3 = \"I\".concat(\"M\", \"d\");\nvar resultado = (string_1.toUpperCase() == string_3.toUpperCase());", "options": ["false", "true", "\"IMD\"", "undefined"], "answer": 1, "explanation": "string_3 resulta em \"IMd\" (d minúsculo). Embora string_1 == string_3 seja false por diferenciar maiúsculas/minúsculas, aplicar toUpperCase() em ambas converte tudo para \"IMD\", retornando true.", "official": true, "lessonNum": 7}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "facil", "question": "Analise o código abaixo. Qual será a saída no console?", "options": ["7", "undefined", "5", "6"], "answer": 3, "explanation": "Índices começam em 0: L(0) o(1) r(2) e(3) m(4) ' '(5) i(6). Logo indexOf('ipsum') retorna 6.", "code": "var text = 'Lorem ipsum dolor sit amet.';\nconsole.log(text.indexOf('ipsum'));", "id": "pe_a07_e01"}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "facil", "question": "Assinale a alternativa que contém um método INVÁLIDO para manipulação de Strings em JavaScript:", "options": ["replace", "lastIndexOf", "split", "divide"], "answer": 3, "explanation": "replace, lastIndexOf e split são métodos nativos de String; divide() não existe em JavaScript.", "id": "pe_a07_e02"}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "facil", "question": "Qual propriedade retorna a quantidade de caracteres (incluindo espaços) de uma String em JavaScript?", "options": ["length (sem parênteses)", "length()", "size()", "count"], "answer": 0, "explanation": "length é uma propriedade (não um método) de Strings e Arrays, acessada como texto.length.", "id": "pe_a07_e03"}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "medio", "question": "O que retorna text.indexOf('Java') quando a substring 'Java' NÃO existe em text?", "options": ["0", "null", "-1", "false"], "answer": 2, "explanation": "indexOf() retorna -1 sempre que a substring procurada não é encontrada.", "id": "pe_a07_e04"}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "medio", "question": "Qual método divide uma string em um array de substrings usando um separador (como vírgula ou espaço)?", "options": ["split()", "join()", "concat()", "slice()"], "answer": 0, "explanation": "'a,b,c'.split(',') retorna o array ['a', 'b', 'c'].", "id": "pe_a07_e05"}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "medio", "question": "O que retorna 'Instituto Metrópole Digital'.slice(0, 9)?", "options": ["'Instituto'", "'Metrópole'", "'Digital'", "'Instituto '"], "answer": 0, "explanation": "slice(0, 9) extrai do índice 0 até o 8 (o índice final 9 não é incluído), resultando em 'Instituto'.", "id": "pe_a07_e06"}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "facil", "question": "Qual método substitui a primeira ocorrência de um trecho de texto por outro em uma String?", "options": ["replace()", "swap()", "change()", "update()"], "answer": 0, "explanation": "texto.replace('antigo', 'novo') retorna uma nova string com a substituição realizada.", "id": "pe_a07_e07"}, {"subject": "pe", "lessonNum": 7, "lesson": "Aula 07 — Operadores JavaScript: Strings", "official": false, "difficulty": "dificil", "question": "Em JavaScript, Strings são imutáveis. O que isso significa ao executar str.toUpperCase()?", "options": ["A variável str original é alterada diretamente.", "Um novo valor em maiúsculas é retornado, mas str permanece inalterada a menos que o retorno seja reatribuído.", "O método lança erro se str tiver letras minúsculas.", "Strings não podem ser concatenadas."], "answer": 1, "explanation": "Métodos de String não alteram a string original; eles retornam uma nova string transformada.", "id": "pe_a07_e08"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "facil", "question": "Sobre a representação de datas no JavaScript (objeto Date), selecione a alternativa INCORRETA:", "options": ["Utiliza o tipo de objeto Date.", "É representada pelos milissegundos decorridos desde 1º de janeiro de 1970 (Unix Epoch).", "É um valor numérico sempre positivo.", "Permite extrair ano, mês, dia e horário via métodos get."], "answer": 2, "explanation": "Datas anteriores a 01/01/1970 são representadas por valores negativos em milissegundos; portanto, dizer que é sempre positivo está incorreto.", "id": "pe_a08_e01"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "facil", "question": "No objeto Date do JavaScript, qual número representa o mês de Janeiro e qual representa Dezembro no método getMonth()?", "options": ["1 e 12", "0 e 11", "0 e 12", "1 e 11"], "answer": 1, "explanation": "Em JavaScript, os meses são indexados a partir de zero: 0 = Janeiro até 11 = Dezembro.", "id": "pe_a08_e02"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "medio", "question": "Qual método do objeto Date retorna o ano completo com 4 dígitos (ex.: 2026)?", "options": ["getFullYear()", "getYear()", "year()", "fullYear()"], "answer": 0, "explanation": "getFullYear() retorna o ano completo com 4 dígitos (getYear() é obsoleto).", "id": "pe_a08_e03"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "medio", "question": "Qual é o formato retornado pelo método toString() de um objeto Date no navegador?", "options": ["19/10/2021 00:00:00", "Thu Oct 14 2021 20:22:04 GMT-0300 (Horário Padrão de Brasília)", "2021-10-14", "1634253724000"], "answer": 1, "explanation": "toString() exibe dia da semana, mês, dia, ano, hora e fuso horário local por extenso.", "id": "pe_a08_e04"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "facil", "question": "Qual método retorna o dia do mês (1 a 31) e qual retorna o dia da semana (0 = Domingo a 6 = Sábado)?", "options": ["getDate() e getDay()", "getDay() e getDate()", "getMonthDay() e getWeekDay()", "day() e week()"], "answer": 0, "explanation": "Pegadinha clássica do JS: getDate() retorna o dia do mês (1–31); getDay() retorna o dia da semana (0–6).", "id": "pe_a08_e05"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "medio", "question": "Como criar um objeto Date representando exatamente a data e hora atuais do sistema?", "options": ["new Date()", "Date.create()", "new Time()", "Date.today()"], "answer": 0, "explanation": "Chamar new Date() sem argumentos instancia a data e hora correntes.", "id": "pe_a08_e06"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "medio", "question": "É possível criar um objeto Date em JavaScript das seguintes formas, EXCETO:", "options": ["Sem informar parâmetros: new Date()", "Com um parâmetro numérico (milissegundos): new Date(1000)", "Passando uma String de data: new Date('2021-10-14')", "Com qualquer quantidade arbitrária de parâmetros (ex.: 15 parâmetros)."], "answer": 3, "explanation": "O construtor Date aceita 0, 1 (ms ou string) ou de 2 a 7 parâmetros numéricos (ano, mês, dia, hora, min, seg, ms).", "id": "pe_a08_e07"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "dificil", "question": "Qual comportamento ocorre ao somar 60 dias com d.setDate(d.getDate() + 60) em um objeto Date?", "options": ["Gera RangeError porque o mês só tem 31 dias.", "O objeto ajusta automaticamente a virada de meses e até de ano (comportamento cíclico/rollover).", "O valor trava no dia 31 do mesmo mês.", "A data se transforma em Invalid Date."], "answer": 1, "explanation": "Os métodos set do objeto Date fazem ajuste automático de transbordo para os meses e anos seguintes.", "id": "pe_a08_e08"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "facil", "question": "Qual método retorna o timestamp atual em milissegundos desde 01/01/1970 (Unix Epoch)?", "options": ["d.getTime() ou Date.now()", "d.getMilliseconds()", "d.getSeconds()", "d.getEpoch()"], "answer": 0, "explanation": "getTime() (em uma instância) ou Date.now() retorna o total de milissegundos desde a época Unix.", "id": "pe_a08_e09"}, {"subject": "pe", "lessonNum": 8, "lesson": "Aula 08 — Operadores JavaScript: Datas", "official": false, "difficulty": "medio", "question": "Ao instanciar new Date(2020, 10, 30), a qual mês do calendário se refere o valor 10?", "options": ["Outubro", "Novembro", "Dezembro", "Janeiro"], "answer": 1, "explanation": "Como os meses começam em 0 (Janeiro), o índice 10 corresponde a Novembro.", "id": "pe_a08_e10"}, {"id": "pe17", "subject": "pe", "lesson": "Aula 09 — Comandos de Seleção", "difficulty": "medio", "question": "Qual expressão usa corretamente o operador condicional ternário para substituir um if/else que retorna \"Aprovado\" se m \u003e= 7 e \"Reprovado\" caso contrário?", "options": ["var res = (m \u003e= 7) ? \"Aprovado\" : \"Reprovado\";", "var res = (m \u003e= 7) : \"Aprovado\" ? \"Reprovado\";", "var res = if (m \u003e= 7) ? \"Aprovado\" : \"Reprovado\";", "var res = \"Aprovado\" ? (m \u003e= 7) : \"Reprovado\";"], "answer": 0, "explanation": "O operador ternário segue estritamente a sintaxe condicao ? expressaoSeVerdadeiro : expressaoSeFalso.", "official": true, "lessonNum": 9}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "facil", "question": "Na estrutura switch/case em JavaScript, o que acontece se você omitir a instrução break ao final de um case correspondente?", "options": ["O navegador gera erro de sintaxe.", "O próximo case será executado sequencialmente (fall-through), mesmo que sua condição não corresponda.", "O switch pula automaticamente para o default.", "A variável avaliada vira undefined."], "answer": 1, "explanation": "Sem o break, ocorre o efeito fall-through: a execução continua nos blocos case seguintes até encontrar um break ou o fim do switch.", "id": "pe_a09_e01"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "medio", "question": "Analise o código abaixo e indique o valor esperado para n4:", "options": ["Ocorre erro de execução", "0", "false", "true"], "answer": 3, "explanation": "n1 \u003e= n3 ('20.1' \u003e= 6.8) é true; n3 \u003c n2 (6.8 \u003c 0.11) é false. true && false = false. Negando com ! temos !false = true.", "code": "var n1 = '20.1';\nvar n2 = 0.11;\nvar n3 = 6.8;\nvar n4 = !(n1 \u003e= n3 && n3 \u003c n2);", "id": "pe_a09_e02"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "facil", "question": "Quais valores são avaliados como falsy (falsos) dentro de uma condição if() em JavaScript?", "options": ["false, 0, '', null, undefined e NaN", "Apenas false", "Qualquer string com menos de 3 letras", "Números negativos e arrays vazios []"], "answer": 0, "explanation": "Os valores falsy em JS são false, 0, -0, '', null, undefined e NaN. Todo o resto (incluindo '0', [] e {}) é truthy.", "id": "pe_a09_e03"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "facil", "question": "Em uma estrutura switch, para que serve o bloco default?", "options": ["Executar quando nenhum dos valores de case corresponder à expressão avaliada.", "Executar sempre antes do primeiro case.", "Substituir a palavra break.", "Declarar variáveis globais."], "answer": 0, "explanation": "default funciona como o else final do switch, sendo executado se nenhum case combinar.", "id": "pe_a09_e04"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "facil", "question": "Quais são os operadores lógicos para E (conjunção), OU (disjunção) e NÃO (negação) em JavaScript?", "options": ["&&, || e !", "AND, OR e NOT", "&, | e ~", "==, != e \u003c\u003e"], "answer": 0, "explanation": "&& exige ambas verdadeiras, || exige ao menos uma verdadeira e ! inverte o valor lógico.", "id": "pe_a09_e05"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "medio", "question": "Se um aluno tirou notas 3, 5 e 3 (média 3,66) em um sistema onde média \u003e= 7 é Aprovado, média \u003e= 3 é Recuperação e \u003c 3 é Reprovado, qual será a saída?", "options": ["Aprovado", "Recuperação", "Reprovado", "Erro de execução"], "answer": 1, "explanation": "A média (3+5+3)/3 = 3,67 cai na faixa entre 3 e 7, resultando em Recuperação.", "id": "pe_a09_e06"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "medio", "question": "Qual a diferença entre usar vários if independentes em sequência versus if / else if / else?", "options": ["Não há diferença no resultado nem no desempenho.", "No if/else if, assim que uma condição verdadeira é executada, as demais são ignoradas; em ifs isolados, todas as condições são testadas.", "else if só funciona com números inteiros.", "ifs isolados não permitem operadores lógicos."], "answer": 1, "explanation": "Encadear com else if garante exclusividade mútua e evita testes desnecessários após o primeiro acerto.", "id": "pe_a09_e07"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "medio", "question": "Qual o resultado da expressão (10 \u003e 5) || (3 \u003e 9) && false?", "options": ["true", "false", "undefined", "NaN"], "answer": 0, "explanation": "&& tem precedência sobre ||: (false && false) = false; depois true || false = true.", "id": "pe_a09_e08"}, {"subject": "pe", "lessonNum": 9, "lesson": "Aula 09 — Comandos de Seleção", "official": false, "difficulty": "dificil", "question": "Em um switch(nota), qual tipo de comparação é feita entre a expressão do switch e cada valor de case?", "options": ["Igualdade estrita (===), sem coerção de tipos.", "Igualdade ampla (==), convertendo strings em números.", "Comparação lexicográfica.", "Apenas maior ou menor."], "answer": 0, "explanation": "O switch utiliza comparação estrita (===): case 1 não combina com a string '1'.", "id": "pe_a09_e09"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "facil", "question": "Qual é a principal diferença entre os laços while e do/while em JavaScript?", "options": ["while executa pelo menos uma vez; do/while testa antes.", "do/while testa a condição no final, garantindo ao menos uma execução do bloco; while testa no início.", "while exige contador numérico e do/while não.", "do/while só aceita strings na condição."], "answer": 1, "explanation": "No while, se a condição já for falsa de início, o bloco roda 0 vezes. No do/while, o bloco executa 1 vez antes do primeiro teste.", "id": "pe_a10_e01"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "facil", "question": "Assinale a alternativa que NÃO contém um comando de repetição válido em JavaScript:", "options": ["for", "do...while", "while", "until"], "answer": 3, "explanation": "JavaScript possui for, while, do...while (e for...in / for...of). Não existe o comando until.", "id": "pe_a10_e02"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "facil", "question": "O termo 'Iteração' em programação significa, EXCETO:", "options": ["Repetição", "Laços", "Interação", "Loop"], "answer": 2, "explanation": "Iteração refere-se à repetição de instruções (loop/laço), não devendo ser confundida com interação (comunicação com o usuário).", "id": "pe_a10_e03"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "facil", "question": "Quais são as três partes separadas por ponto e vírgula no cabeçalho de um laço for clássico?", "options": ["inicialização; condição; incremento/atualização", "condição; retorno; fim", "variável; tipo; limite", "entrada; processamento; saída"], "answer": 0, "explanation": "Exemplo: for (let i = 0; i \u003c 10; i++) contém inicialização, condição de continuidade e passo de atualização.", "id": "pe_a10_e04"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "medio", "question": "Qual a diferença entre os comandos break e continue dentro de um laço de repetição?", "options": ["break encerra o laço inteiro imediatamente; continue pula apenas a iteração atual e vai para a próxima.", "continue encerra o laço; break pula uma iteração.", "Ambos encerram o programa inteiro.", "continue só funciona em switch."], "answer": 0, "explanation": "break sai do loop por completo; continue interrompe o restante da volta atual e inicia a próxima verificação.", "id": "pe_a10_e05"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "medio", "question": "Quantas vezes a frase 'IMD' será impressa pelo laço abaixo?", "options": ["4 vezes", "5 vezes", "6 vezes", "Loop infinito"], "answer": 1, "explanation": "i assume os valores 0, 1, 2, 3 e 4 (total de 5 iterações). Quando i chega a 5, i \u003c 5 torna-se falso.", "code": "for (let i = 0; i \u003c 5; i++) {\n  console.log('IMD');\n}", "id": "pe_a10_e06"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "medio", "question": "O que causa um 'loop infinito' em um laço while?", "options": ["A condição de permanência nunca se torna falsa (por exemplo, esquecer de atualizar a variável de controle).", "Usar let em vez de var.", "Ter mais de 10 linhas dentro do bloco.", "Colocar um break dentro de um if."], "answer": 0, "explanation": "Se a condição do while permanecer sempre verdadeira, o laço repete indefinidamente travando a aba.", "id": "pe_a10_e07"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "medio", "question": "Qual será o valor final de soma após a execução do código abaixo?", "options": ["6", "10", "15", "4"], "answer": 1, "explanation": "soma acumula 1 + 2 + 3 + 4 = 10.", "code": "let soma = 0;\nfor (let i = 1; i \u003c= 4; i++) {\n  soma += i;\n}", "id": "pe_a10_e08"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "facil", "question": "Quando é mais natural escolher o laço while em vez do for?", "options": ["Quando não sabemos previamente o número exato de repetições, dependendo de uma condição dinâmica (ex.: entrada do usuário).", "Apenas quando queremos percorrer arrays por índice.", "Nunca, pois while está obsoleto.", "Somente para contagens regressivas fixas."], "answer": 0, "explanation": "while brilha em loops controlados por sentinela ou condição indeterminada; for é ideal quando o número de iterações é conhecido.", "id": "pe_a10_e09"}, {"subject": "pe", "lessonNum": 10, "lesson": "Aula 10 — Comandos de Iteração", "official": false, "difficulty": "dificil", "question": "Quantas vezes o bloco do laço abaixo será executado?", "options": ["0 vezes", "1 vez", "10 vezes", "Loop infinito"], "answer": 1, "explanation": "Por ser do/while, o corpo executa primeiro (x vira 11) e só depois testa (11 \u003c 5 é falso), encerrando após exatamente 1 execução.", "code": "let x = 10;\ndo {\n  x++;\n} while (x \u003c 5);", "id": "pe_a10_e10"}, {"id": "pe18", "subject": "pe", "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "difficulty": "dificil", "question": "Observe as operações aplicadas consecutivamente sobre o array cores. Quais serão os valores finais de a, b e cores?", "code": "var cores = [\"Verde\", \"Amarelo\", \"Azul\", \"Branco\"];\nvar a = cores.slice(1, 3);\nvar b = cores.splice(1, 2);", "options": ["a = [\"Amarelo\", \"Azul\"], b = [\"Amarelo\", \"Azul\"], cores = [\"Verde\", \"Amarelo\", \"Azul\", \"Branco\"]", "a = [\"Verde\", \"Amarelo\"], b = [\"Azul\", \"Branco\"], cores = [\"Verde\", \"Amarelo\", \"Azul\", \"Branco\"]", "a = [\"Amarelo\", \"Azul\"], b = [\"Amarelo\", \"Azul\"], cores = [\"Verde\", \"Branco\"]", "a = [\"Amarelo\", \"Azul\"], b = [\"Verde\", \"Branco\"], cores = [\"Amarelo\", \"Azul\"]"], "answer": 2, "explanation": "slice(1, 3) copia os índices 1 e 2 ([\"Amarelo\", \"Azul\"]) SEM alterar cores. Em seguida, splice(1, 2) remove 2 elementos a partir do índice 1, retornando-os em b e modificando cores para [\"Verde\", \"Branco\"].", "official": true, "lessonNum": 11}, {"id": "pe19", "subject": "pe", "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "difficulty": "medio", "question": "Avalie as afirmativas sobre Arrays em JavaScript:\nI. Array é uma estrutura de dados indexada que armazena vários valores em uma única variável.\nII. É possível acessar os valores de um array individualmente através de seu índice.\nIII. Só é possível criar um array declarando todos os seus elementos explicitamente.\nMarque a alternativa correta:", "options": ["Somente as afirmativas I e II estão corretas.", "Somente as afirmativas II e III estão corretas.", "Somente as afirmativas I e III estão corretas.", "As afirmativas I, II e III estão corretas."], "answer": 0, "explanation": "I e II são verdadeiras. III é falsa pois é possível criar arrays vazios (var arr = [] ou new Array()) e preenchê-los dinamicamente.", "official": true, "lessonNum": 11}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "facil", "question": "Qual é o índice do primeiro elemento e qual é o índice do último elemento de um array arr com 5 itens?", "options": ["1 e 5", "0 e 4", "0 e 5", "1 e 4"], "answer": 1, "explanation": "Arrays em JavaScript são baseados em zero: o primeiro está em arr[0] e o último em arr[arr.length - 1] (índice 4).", "id": "pe_a11_e01"}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "facil", "question": "Qual método adiciona um novo elemento ao FINAL de um array em JavaScript?", "options": ["push()", "pop()", "shift()", "unshift()"], "answer": 0, "explanation": "push() insere no final; pop() remove do final; unshift() insere no início; shift() remove do início.", "id": "pe_a11_e02"}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "facil", "question": "Qual método remove o ÚLTIMO elemento de um array e retorna esse elemento removido?", "options": ["pop()", "shift()", "slice()", "delete()"], "answer": 0, "explanation": "pop() retira o último item do array e devolve seu valor.", "id": "pe_a11_e03"}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "medio", "question": "Qual método une todos os elementos de um array em uma única string usando um separador personalizado (ex.: ' - ')?", "options": ["join()", "split()", "concat()", "push()"], "answer": 0, "explanation": "['A', 'B', 'C'].join(' - ') retorna 'A - B - C'.", "id": "pe_a11_e04"}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "medio", "question": "O que retorna o método concat() ao juntar dois arrays a1.concat(a2)?", "options": ["Modifica a1 diretamente e retorna undefined.", "Retorna um novo array combinando os elementos de a1 e a2, sem alterar os originais.", "Soma os números de a1 com a2.", "Remove elementos duplicados automaticamente."], "answer": 1, "explanation": "concat() é não-destrutivo e devolve um novo array com os itens concatenados.", "id": "pe_a11_e05"}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "medio", "question": "Qual é o resultado de nums.length após executar o código abaixo?", "options": ["2", "3", "4", "5"], "answer": 1, "explanation": "Começa com 3 itens, push(40) vai para 4, shift() remove o 10 e volta para 3 itens ([20, 30, 40]).", "code": "let nums = [10, 20, 30];\nnums.push(40);\nnums.shift();", "id": "pe_a11_e06"}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "facil", "question": "Como verificar se o elemento 'Natal' existe no array cidades e descobrir sua posição?", "options": ["cidades.indexOf('Natal')", "cidades.search('Natal')", "cidades.has('Natal')", "cidades.pos('Natal')"], "answer": 0, "explanation": "indexOf('Natal') retorna o índice da primeira ocorrência ou -1 se não existir.", "id": "pe_a11_e07"}, {"subject": "pe", "lessonNum": 11, "lesson": "Aula 11 — Arrays: Introdução, Acesso e Métodos", "official": false, "difficulty": "dificil", "question": "Usando splice(1, 0, 'X') no array ['A', 'B', 'C'], qual será o array resultante?", "options": ["['A', 'X', 'C']", "['A', 'X', 'B', 'C']", "['X', 'A', 'B', 'C']", "['A', 'B', 'X']"], "answer": 1, "explanation": "O segundo argumento 0 indica que nenhum elemento será removido; 'X' é inserido no índice 1 empurrando 'B' e 'C' para frente.", "id": "pe_a11_e08"}, {"id": "pe20", "subject": "pe", "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "difficulty": "facil", "question": "Considerando o código abaixo, qual será o valor armazenado na variável resposta?", "code": "var cores = [\"Verde\", \"Amarelo\", \"Azul\", \"Branco\"];\ncores.reverse();\nvar resposta = \"[\" + cores + \"]\";", "options": ["\"[Verde,Amarelo,Azul,Branco]\"", "\"[Branco,Azul,Amarelo,Verde]\"", "\"[Amarelo,Azul,Branco,Verde]\"", "Erro de execução pois reverse() exige parâmetro."], "answer": 1, "explanation": "cores.reverse() inverte a ordem do array no próprio local (in-place). Ao concatenar um array com string, o JS converte seus elementos separados por vírgula: \"[Branco,Azul,Amarelo,Verde]\".", "official": true, "lessonNum": 12}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "facil", "question": "Como é representada uma matriz (array bidimensional) em JavaScript?", "options": ["Como um array cujos elementos são outros arrays (linhas e colunas).", "Usando a palavra-chave matrix().", "Apenas por meio de objetos Date.", "JavaScript não suporta matrizes."], "answer": 0, "explanation": "Uma matriz 2D é um array de arrays, acessada com dois índices: matriz[linha][coluna].", "id": "pe_a12_e01"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "medio", "question": "Considerando a matriz abaixo, qual expressão acessa o valor 5?", "options": ["m[1][1]", "m[2][2]", "m[1][2]", "m[0][1]"], "answer": 0, "explanation": "Linha 1 é [4, 5, 6]; coluna 1 dessa linha é 5. Logo m[1][1] === 5.", "code": "var m = [\n  [1, 2, 3],\n  [4, 5, 6]\n];", "id": "pe_a12_e02"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "dificil", "question": "Por que [10, 2, 30, 5].sort() sem função de comparação retorna [10, 2, 30, 5] em vez de [2, 5, 10, 30]?", "options": ["Porque sort() ordena por padrão em ordem lexicográfica (como strings/texto), onde '10' vem antes de '2'.", "Porque sort() sempre ordena em ordem decrescente.", "Porque sort() ignora números pares.", "Porque há um bug no Chrome."], "answer": 0, "explanation": "Para ordenar números corretamente, deve-se passar uma função comparadora: arr.sort((a, b) =\u003e a - b).", "id": "pe_a12_e03"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "medio", "question": "Qual função de comparação passada ao sort() ordena um array de números em ordem CRESCENTE?", "options": ["(a, b) =\u003e a - b", "(a, b) =\u003e b - a", "(a, b) =\u003e a + b", "(a, b) =\u003e a == b"], "answer": 0, "explanation": "Se a - b \u003c 0, a vem antes de b (ordem crescente). Para decrescente usa-se b - a.", "id": "pe_a12_e04"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "medio", "question": "Para percorrer todos os elementos de uma matriz 2D (linhas e colunas), qual estrutura é normalmente utilizada?", "options": ["Dois laços for aninhados (um para linhas e outro interno para colunas).", "Um único comando if/else.", "Um comando switch.", "Apenas reverse()."], "answer": 0, "explanation": "O laço externo percorre os índices de linha (i) e o interno percorre os índices de coluna (j) de cada linha.", "id": "pe_a12_e05"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "facil", "question": "Qual método percorre cada elemento de um array executando uma função callback, sem retornar um novo array?", "options": ["forEach()", "map()", "filter()", "reduce()"], "answer": 0, "explanation": "forEach() executa um efeito colateral por item e retorna undefined; map() e filter() retornam novos arrays.", "id": "pe_a12_e06"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "medio", "question": "Qual o resultado de [2, 4, 6].map(x =\u003e x * 3)?", "options": ["[6, 12, 18]", "36", "[2, 4, 6]", "true"], "answer": 0, "explanation": "map() transforma cada item aplicando a função x =\u003e x * 3, gerando um novo array [6, 12, 18].", "id": "pe_a12_e07"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "medio", "question": "Qual o resultado de [5, 12, 8, 20].filter(n =\u003e n \u003e 10)?", "options": ["[12, 20]", "12", "true", "[5, 8]"], "answer": 0, "explanation": "filter() retorna um novo array contendo apenas os elementos que retornaram true no teste (12 e 20).", "id": "pe_a12_e08"}, {"subject": "pe", "lessonNum": 12, "lesson": "Aula 12 — Arrays: Ordenação, Iteração e Matrizes", "official": false, "difficulty": "dificil", "question": "Qual o resultado de [1, 2, 3, 4].reduce((acc, v) =\u003e acc + v, 0)?", "options": ["[1, 2, 3, 4]", "10", "24", "4"], "answer": 1, "explanation": "reduce() soma todos os elementos a partir do acumulador inicial 0: 0+1+2+3+4 = 10.", "id": "pe_a12_e09"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "facil", "question": "Qual erro é exibido no navegador Google Chrome quando ocorre uma recursão infinita em JavaScript?", "options": ["Uncaught RangeError: Maximum call stack size exceeded", "SyntaxError: Infinite loop", "Throws Infinity Size", "Undefined Error Stack"], "answer": 0, "explanation": "Cada chamada recursiva empilha um novo frame na Call Stack; sem parada, a pilha estoura com RangeError: Maximum call stack size exceeded.", "id": "pe_a13_e01"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "facil", "question": "Avalie a afirmação: 'Linguagens de programação puramente recursivas podem ser utilizadas para solucionar os mesmos problemas que linguagens com laços for/while/do-while.'", "options": ["Verdadeiro", "Falso", "Apenas para strings", "Apenas para números primos"], "answer": 0, "explanation": "Recursão e iteração têm o mesmo poder computacional: qualquer algoritmo iterativo pode ser escrito recursivamente e vice-versa.", "id": "pe_a13_e02"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "facil", "question": "Em uma função recursiva, qual é o papel do 'caso base' (ponto de parada)?", "options": ["Acelerar o compilador.", "Definir a condição simples na qual a função retorna diretamente sem chamar a si mesma, evitando recursão infinita.", "Multiplicar todas as variáveis por zero.", "Criar uma variável global."], "answer": 1, "explanation": "Sem caso base (ou sem aproximar o argumento do caso base), a recursão nunca termina.", "id": "pe_a13_e03"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "medio", "question": "Considere as afirmativas sobre recursão:\nI. O ponto de parada é o que chamamos de recursão mútua.\nII. O caso base define o momento em que a recursão deve parar.\nIII. Uma condição de terminação funciona como freio de emergência para entradas inválidas (ex.: n \u003c 0).\nQuais estão corretas?", "options": ["Somente II e III.", "Somente I e III.", "I, II e III.", "Somente I e II."], "answer": 0, "explanation": "Recursão mútua ocorre quando A chama B e B chama A — não é o ponto de parada. II e III estão corretas.", "id": "pe_a13_e04"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "medio", "question": "Qual será a saída no console da função recursiva de fatorial abaixo?", "options": ["6", "12", "24", "Estouro de pilha"], "answer": 2, "explanation": "fat(4) = 4 * fat(3) = 4 * 3 * 2 * 1 = 24.", "code": "function fat(n) {\n  if (n \u003c= 1) return 1;\n  return n * fat(n - 1);\n}\nconsole.log(fat(4));", "id": "pe_a13_e05"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "medio", "question": "O que caracteriza uma 'recursão mútua' (ou indireta)?", "options": ["Uma função que nunca possui return.", "Quando uma função A chama a função B e a função B volta a chamar a função A.", "Quando uma função usa um laço for interno.", "Quando duas funções têm nomes iguais."], "answer": 1, "explanation": "Na recursão direta, f chama f. Na recursão mútua/indireta, f chama g e g chama f.", "id": "pe_a13_e06"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "medio", "question": "Por que uma função recursiva consome mais memória que sua versão iterativa equivalente?", "options": ["Porque cada chamada pendente ocupa um novo quadro (stack frame) na pilha de chamadas até o caso base ser atingido.", "Porque recursão salva arquivos no disco rígido.", "Porque recursão duplica o HTML da página.", "Recursão sempre usa menos memória."], "answer": 0, "explanation": "Cada chamada recursiva mantém seus parâmetros e endereço de retorno empilhados na Call Stack.", "id": "pe_a13_e07"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "dificil", "question": "Qual será a saída da função recursiva abaixo aplicada à string 'IMD'?", "options": ["'IMD'", "'DMI'", "'DDD'", "''"], "answer": 1, "explanation": "inv('IMD') = inv('MD') + 'I' = inv('D') + 'M' + 'I' = '' + 'D' + 'M' + 'I' = 'DMI'.", "code": "function inv(s) {\n  if (s === '') return '';\n  return inv(s.slice(1)) + s[0];\n}\nconsole.log(inv('IMD'));", "id": "pe_a13_e08"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "medio", "question": "Na sequência de Fibonacci recursiva (fib(n) = fib(n-1) + fib(n-2)), quais são os casos base clássicos?", "options": ["n === 0 retorna 0 e n === 1 retorna 1.", "n === 10 retorna 10.", "Não precisa de caso base.", "n \u003c 0 retorna 100."], "answer": 0, "explanation": "Os dois primeiros termos (0 e 1) encerram as ramificações recursivas de Fibonacci.", "id": "pe_a13_e09"}, {"subject": "pe", "lessonNum": 13, "lesson": "Aula 13 — Recursão: Introdução, Números e Strings", "official": false, "difficulty": "dificil", "question": "O que acontece ao chamar fat(-3) em uma função recursiva que só testa if (n === 0) return 1;?", "options": ["Retorna -6.", "Retorna 1.", "Entra em recursão infinita até gerar RangeError (estouro de pilha).", "Retorna 0."], "answer": 2, "explanation": "Como n começa em -3 e diminui (-4, -5...), nunca passa por 0; por isso recomenda-se condição de terminação defensiva (n \u003c= 0).", "id": "pe_a13_e10"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "medio", "question": "Considere a função recursiva abaixo que soma os n primeiros elementos de um array. Qual será a saída no console?", "options": ["Estouro de pilha", "9", "15", "10"], "answer": 3, "explanation": "s([1,2,3,4], 4) = 4 + 3 + 2 + 1 + 0 = 10.", "code": "function s(p, n) {\n  if (n == 0) return 0;\n  return p[n - 1] + s(p, n - 1);\n}\nconsole.log(s([1, 2, 3, 4], 4));", "id": "pe_a14_e01"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "facil", "question": "Ao processar um array recursivamente reduzindo o índice n a cada chamada, qual costuma ser o caso base para soma de elementos?", "options": ["Quando n === 0 (array vazio), retornando 0.", "Quando n === 100, retornando 100.", "Quando p é null, retornando 'erro'.", "Não existe caso base para arrays."], "answer": 0, "explanation": "O elemento neutro da soma é 0, portanto um sub-array vazio (n === 0) retorna 0.", "id": "pe_a14_e02"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "medio", "question": "Para multiplicar recursivamente todos os elementos de um array, qual valor deve ser retornado no caso base (n === 0)?", "options": ["0", "1", "-1", "undefined"], "answer": 1, "explanation": "O elemento neutro da multiplicação é 1; retornar 0 zeraria todo o produto.", "id": "pe_a14_e03"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "medio", "question": "Na busca recursiva de um elemento em um array, quais são as duas condições de parada possíveis?", "options": ["Encontrar o elemento (retorna true/índice) OU chegar ao fim do array sem encontrá-lo (retorna false/-1).", "Apenas quando o array estiver ordenado.", "Apenas quando o índice for par.", "Quando o array tiver tamanho 10."], "answer": 0, "explanation": "A busca encerra por sucesso (match) ou por esgotamento dos elementos.", "id": "pe_a14_e04"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "dificil", "question": "Qual será o retorno da função recursiva abaixo chamada como contarPares([2, 5, 8, 3, 4], 5)?", "options": ["2", "3", "5", "4"], "answer": 1, "explanation": "Os números pares no array são 2, 8 e 4, totalizando 3.", "code": "function contarPares(arr, n) {\n  if (n === 0) return 0;\n  let atual = (arr[n - 1] % 2 === 0) ? 1 : 0;\n  return atual + contarPares(arr, n - 1);\n}", "id": "pe_a14_e05"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "medio", "question": "Ao percorrer uma matriz 2D recursivamente com parâmetros (matriz, linha, coluna), o que deve acontecer quando a coluna atinge o fim da linha atual?", "options": ["Avança para linha + 1 e reinicia coluna = 0.", "Reinicia linha = 0.", "Interrompe imediatamente sem visitar as próximas linhas.", "Apaga a linha atual."], "answer": 0, "explanation": "Quando coluna chega ao tamanho da linha, passamos para a primeira coluna (0) da próxima linha (linha + 1).", "id": "pe_a14_e06"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "medio", "question": "Para encontrar o maior número de um array recursivamente, qual é o caso base mais natural?", "options": ["Quando n === 1, retornando o único elemento arr[0].", "Quando n === 0, retornando 0 (mesmo com números negativos).", "Quando n === 2, retornando arr[1].", "Quando n === 10."], "answer": 0, "explanation": "Com n === 1 o único elemento já é o maior, funcionando inclusive se todos os números do array forem negativos.", "id": "pe_a14_e07"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "facil", "question": "Qual vantagem didática tem a recursão em estruturas aninhadas (como arrays dentro de arrays ou árvores)?", "options": ["Permite expressar a solução de forma elegante e próxima à definição matemática do problema.", "Elimina totalmente o uso de memória RAM.", "Impede qualquer erro de lógica.", "Dispensa o uso de funções."], "answer": 0, "explanation": "Estruturas autossimilares (árvores, matrizes aninhadas) têm soluções recursivas muito claras e concisas.", "id": "pe_a14_e08"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "dificil", "question": "No algoritmo recursivo de Busca Binária em um array ordenado, o que acontece a cada chamada recursiva?", "options": ["O espaço de busca é reduzido pela metade comparando o alvo com o elemento do meio.", "Todos os elementos são duplicados.", "O array é embaralhado.", "Remove-se apenas 1 elemento por chamada."], "answer": 0, "explanation": "A busca binária descarta metade do intervalo a cada passo, garantindo desempenho logarítmico O(log n).", "id": "pe_a14_e09"}, {"subject": "pe", "lessonNum": 14, "lesson": "Aula 14 — Recursão: Arrays, Matrizes e Exercícios", "official": false, "difficulty": "medio", "question": "Ao passar um array como parâmetro em chamadas recursivas em JavaScript, como o array é transmitido?", "options": ["Por referência (sem copiar todo o array a cada chamada, a menos que se use slice).", "Sempre copiado integralmente em disco.", "Convertido automaticamente em string.", "Sempre invertido."], "answer": 0, "explanation": "Arrays são objetos passados por referência; passar apenas o índice (n-1) evita cópias caras de memória.", "id": "pe_a14_e10"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "facil", "question": "Assinale a alternativa que nomeia corretamente uma variável para armazenar o total de produtos seguindo o padrão camelCase:", "options": ["totalProdutos", "TotalProdutos", "total_produtos", "totalPRODUTOS"], "answer": 0, "explanation": "No padrão camelCase, a primeira palavra começa em minúscula e cada palavra seguinte inicia com maiúscula (totalProdutos).", "id": "pe_a15_e01"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "facil", "question": "A estrutura geral para tratamento de exceções em JavaScript é composta por, EXCETO:", "options": ["try", "finally", "catch", "isNan()"], "answer": 3, "explanation": "A estrutura de tratamento de erros usa try, catch e finally (além de throw). isNaN() é uma função de verificação numérica.", "id": "pe_a15_e02"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "facil", "question": "Assinale a alternativa que NÃO indica uma boa prática de programação:", "options": ["Usar nomes significativos para variáveis e funções.", "Manter indentação consistente no código.", "Criar funções gigantes de centenas de linhas sem comentários e com variáveis chamadas a1, a2, a3.", "Tratar possíveis erros de entrada com try/catch ou validações."], "answer": 2, "explanation": "Código legível exige modularização, nomes descritivos e indentação limpa — nunca variáveis crípticas em blocos monolíticos.", "id": "pe_a15_e03"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "facil", "question": "Em um bloco try / catch / finally, quando o bloco catch é executado?", "options": ["Sempre, mesmo sem erros.", "Apenas quando uma exceção/erro é lançada dentro do bloco try.", "Antes do bloco try.", "Somente quando o navegador é fechado."], "answer": 1, "explanation": "O bloco catch captura e trata exceções ocorridas durante a execução do bloco try.", "id": "pe_a15_e04"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "medio", "question": "Em um bloco try / catch / finally, quando o bloco finally é executado?", "options": ["Apenas se ocorrer erro.", "Apenas se NÃO ocorrer erro.", "Sempre, independentemente de ocorrer ou não uma exceção.", "Nunca em JavaScript."], "answer": 2, "explanation": "finally é garantido de executar ao final, sendo útil para liberar recursos ou finalizar estados.", "id": "pe_a15_e05"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "medio", "question": "Qual palavra-chave permite ao programador lançar intencionalmente uma exceção personalizada em JavaScript?", "options": ["throw", "catch", "raise", "send"], "answer": 0, "explanation": "throw new Error('Mensagem') lança uma exceção que pode ser capturada por um bloco catch.", "id": "pe_a15_e06"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "facil", "question": "Qual é a função principal da indentação consistente no código-fonte?", "options": ["Aumentar a velocidade de execução na CPU.", "Facilitar a leitura visual da hierarquia de blocos (if, for, funções) para manutenção
