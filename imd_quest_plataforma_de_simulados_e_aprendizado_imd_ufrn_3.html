 em equipe.", "Comprimir o tamanho do arquivo .js.", "Substituir o uso de chaves { } em JavaScript."], "answer": 1, "explanation": "Em JS a indentação não altera a lógica, mas é essencial para legibilidade e trabalho colaborativo.", "id": "pe_a15_e07"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "medio", "question": "Quais propriedades úteis costumam estar presentes no objeto de erro recebido por catch (erro)?", "options": ["erro.name e erro.message", "erro.title e erro.body", "erro.codeLine e erro.fix", "erro.html e erro.css"], "answer": 0, "explanation": "Objetos Error em JS expõem .name (tipo do erro, ex.: TypeError) e .message (descrição legível).", "id": "pe_a15_e08"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "medio", "question": "Qual convenção de nomenclatura é comumente adotada para constantes globais imutáveis (como TAXA_JUROS) segundo boas práticas?", "options": ["UPPER_SNAKE_CASE (letras maiúsculas separadas por underscore)", "tudojuntominusculo", "kebab-case com hífens", "Começar com números"], "answer": 0, "explanation": "Constantes fixas de configuração costumam usar MAIÚSCULAS_COM_UNDERSCORE para destaque visual imediato.", "id": "pe_a15_e09"}, {"subject": "pe", "lessonNum": 15, "lesson": "Aula 15 — Tratamento de Erros, Estilo de Código e Boas Práticas", "official": false, "difficulty": "facil", "question": "Por que evitar comentários óbvios (como '// soma 1 em x' acima de x++) e preferir código autoexplicativo?", "options": ["Porque comentários devem explicar o 'porquê' de decisões não óbvias, enquanto bons nomes já explicam o 'o quê'.", "Porque comentários impedem o JavaScript de rodar.", "Porque navegadores apagam comentários.", "Porque comentários consomem muita bateria."], "answer": 0, "explanation": "Código limpo comunica sua intenção via nomes claros; comentários agregam valor explicando regras de negócio e decisões complexas.", "id": "pe_a15_e10"}, {"id": "fe1_01", "subject": "fe1", "lesson": "Aula 01 — Introdução ao HTML", "difficulty": "facil", "question": "Sobre editores de texto, selecione a alternativa que NÃO indica um editor utilizado para criação de páginas HTML:", "options": ["Visual Studio Code", "Sublime", "WordHtml", "Atom"], "answer": 2, "explanation": "Visual Studio Code, Sublime Text e Atom são editores de código reais estudados na Aula 01. \"WordHtml\" não é um editor de texto HTML.", "official": true, "lessonNum": 1}, {"id": "fe1_02", "subject": "fe1", "lesson": "Aula 01 — Introdução ao HTML", "difficulty": "facil", "question": "Assinale a alternativa que contém APENAS editores de texto projetados para codificação/HTML (sem processadores de texto comuns):", "options": ["Wordpad, Sublime e Atom", "Word, VS Code e Wordpad", "Visual Studio Code, Word e Wordpad", "Visual Studio Code, Sublime e Atom"], "answer": 3, "explanation": "Word e Wordpad são processadores de texto voltados a documentos formatados, não editores de código. VS Code, Sublime e Atom são editores voltados a desenvolvimento.", "official": true, "lessonNum": 1}, {"id": "fe1_03", "subject": "fe1", "lesson": "Aula 01 — Introdução ao HTML", "difficulty": "facil", "question": "Qual é a natureza do HTML e qual tag define o título exibido na aba do navegador?", "options": ["Linguagem de marcação; tag \u003ctitle\u003e dentro de \u003chead\u003e.", "Linguagem de programação compilada; tag \u003cheader\u003e dentro de \u003cbody\u003e.", "Linguagem de estilização; tag \u003ch1\u003e dentro de \u003chead\u003e.", "Linguagem de script; tag \u003cmeta\u003e dentro de \u003cbody\u003e."], "answer": 0, "explanation": "HTML não é uma linguagem de programação, mas sim uma linguagem de marcação que estrutura conteúdo. O título da página na aba do navegador é definido pela tag \u003ctitle\u003e dentro do \u003chead\u003e.", "official": true, "lessonNum": 1}, {"subject": "fe1", "lessonNum": 1, "lesson": "Aula 01 — Introdução ao HTML", "official": false, "difficulty": "facil", "question": "Quem criou o HTML originalmente em 1991, e qual organização mantém atualmente o HTML Living Standard?", "options": ["Tim Berners-Lee; mantido pelo WHATWG.", "Brendan Eich; mantido pela Oracle.", "Linus Torvalds; mantido pela Microsoft.", "Alan Turing; mantido pelo Twitter."], "answer": 0, "explanation": "Tim Berners-Lee criou o HTML em 1991. Hoje o padrão vivo (HTML Living Standard) é mantido pelo WHATWG.", "id": "fe1_a01_e01"}, {"subject": "fe1", "lessonNum": 1, "lesson": "Aula 01 — Introdução ao HTML", "official": false, "difficulty": "facil", "question": "Qual declaração deve aparecer na primeira linha de um documento HTML5 moderno para informar o tipo do documento ao navegador?", "options": ["\u003c!DOCTYPE html\u003e", "\u003chtml5\u003e", "\u003cmeta doctype='html'\u003e", "\u003c!HTML START\u003e"], "answer": 0, "explanation": "\u003c!DOCTYPE html\u003e instrui o navegador a renderizar a página no modo padrão (standards mode) do HTML5.", "id": "fe1_a01_e02"}, {"subject": "fe1", "lessonNum": 1, "lesson": "Aula 01 — Introdução ao HTML", "official": false, "difficulty": "medio", "question": "Qual motor de renderização (rendering engine) é utilizado por Google Chrome, Microsoft Edge e Opera?", "options": ["Gecko", "WebKit", "Blink", "Trident"], "answer": 2, "explanation": "Blink (mantido pelo Google/Chromium) equipa Chrome, Edge, Opera e Brave. Gecko é do Firefox e WebKit é do Safari.", "id": "fe1_a01_e03"}, {"subject": "fe1", "lessonNum": 1, "lesson": "Aula 01 — Introdução ao HTML", "official": false, "difficulty": "facil", "question": "Para garantir a exibição correta de acentos e cedilha em português (UTF-8), qual tag deve ser inserida no \u003chead\u003e?", "options": ["\u003cmeta charset=\"UTF-8\"\u003e", "\u003clang=\"pt-br\"\u003e", "\u003ccharset utf8\u003e", "\u003ctitle charset=\"UTF-8\"\u003e"], "answer": 0, "explanation": "\u003cmeta charset=\"UTF-8\"\u003e define a codificação de caracteres do documento.", "id": "fe1_a01_e04"}, {"subject": "fe1", "lessonNum": 1, "lesson": "Aula 01 — Introdução ao HTML", "official": false, "difficulty": "facil", "question": "Qual atributo na tag \u003chtml\u003e informa o idioma principal da página (ex.: português do Brasil) para leitores de tela e buscadores?", "options": ["lang=\"pt-br\"", "language=\"br\"", "charset=\"pt\"", "locale=\"brazil\""], "answer": 0, "explanation": "O atributo lang=\"pt-br\" melhora acessibilidade e indexação em mecanismos de busca.", "id": "fe1_a01_e05"}, {"subject": "fe1", "lessonNum": 1, "lesson": "Aula 01 — Introdução ao HTML", "official": false, "difficulty": "medio", "question": "Qual motor de renderização é mantido pela Mozilla e equipa o navegador Firefox?", "options": ["Blink", "Gecko", "WebKit", "V8"], "answer": 1, "explanation": "Gecko é o motor de renderização da Mozilla usado no Firefox; WebKit é mantido pela Apple (Safari).", "id": "fe1_a01_e06"}, {"subject": "fe1", "lessonNum": 1, "lesson": "Aula 01 — Introdução ao HTML", "official": false, "difficulty": "facil", "question": "Qual ferramenta online é recomendada na Aula 01 para verificar se um recurso de HTML/CSS já tem suporte nos principais navegadores?", "options": ["Can I Use", "WordHtml", "Flash Player", "Notepad"], "answer": 0, "explanation": "O site Can I Use (caniuse.com) mostra a matriz de compatibilidade de recursos web nos motores Blink, Gecko e WebKit.", "id": "fe1_a01_e07"}, {"id": "fe1_04", "subject": "fe1", "lesson": "Aula 02 — Introdução ao CSS", "difficulty": "facil", "question": "Quando existem definições CSS conflitantes para o mesmo elemento HTML (arquivo externo, tag \u003cstyle\u003e no cabeçalho e atributo inline style), qual possui maior prioridade?", "options": ["O arquivo CSS externo importado.", "A definição inline diretamente no atributo style da tag.", "Sempre a regra declarada primeiro no documento.", "A definição global do navegador."], "answer": 1, "explanation": "No CSS (Folhas de Estilo em Cascata), definições mais específicas têm prioridade sobre globais; assim, o estilo inline sobrepõe regras do \u003cstyle\u003e interno e do arquivo .css externo.", "official": true, "lessonNum": 2}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "facil", "question": "O que significa a sigla CSS?", "options": ["Cascading Style Sheets (Folhas de Estilo em Cascata)", "Computer System Styles", "Creative Script Syntax", "Centralized Server Sheets"], "answer": 0, "explanation": "CSS significa Cascading Style Sheets, linguagem responsável pela apresentação visual de documentos HTML.", "id": "fe1_a02_e01"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "facil", "question": "Quais são as três formas de aplicar estilos CSS a um documento HTML?", "options": ["Externo (\u003clink\u003e), Interno (\u003cstyle\u003e no \u003chead\u003e) e Inline (atributo style na tag).", "Apenas via JavaScript.", "Via \u003cscript\u003e, \u003cmeta\u003e e \u003ctitle\u003e.", "Somente dentro da tag \u003cbody\u003e."], "answer": 0, "explanation": "CSS pode ser externo (melhor para manutenção), interno (\u003cstyle\u003e) ou inline (atributo style).", "id": "fe1_a02_e02"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "facil", "question": "Qual tag é usada dentro do \u003chead\u003e para importar um arquivo CSS externo chamado estilo.css?", "options": ["\u003clink rel=\"stylesheet\" href=\"estilo.css\"\u003e", "\u003cstyle src=\"estilo.css\"\u003e", "\u003ccss href=\"estilo.css\"\u003e", "\u003cscript src=\"estilo.css\"\u003e"], "answer": 0, "explanation": "A tag \u003clink rel='stylesheet' href='...'\u003e vincula folhas de estilo externas ao HTML.", "id": "fe1_a02_e03"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "facil", "question": "Em uma regra CSS como p { color: blue; font-size: 16px; }, o que é 'p', 'color' e 'blue', respectivamente?", "options": ["Seletor, propriedade e valor.", "Valor, seletor e atributo.", "Tag, classe e ID.", "Evento, função e parâmetro."], "answer": 0, "explanation": "Toda regra CSS possui um seletor seguido de declarações no formato propriedade: valor;.", "id": "fe1_a02_e04"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "medio", "question": "Por que o CSS externo é considerado a melhor prática conforme a página ou site cresce?", "options": ["Permite reutilizar o mesmo arquivo de estilos em várias páginas HTML e centraliza a manutenção.", "Porque CSS inline não funciona no Chrome.", "Porque o navegador não lê \u003cstyle\u003e interno.", "Porque elimina a necessidade de HTML."], "answer": 0, "explanation": "Separar estrutura (HTML) de apresentação (arquivo .css externo) evita duplicação e facilita atualizar todo o site de uma vez.", "id": "fe1_a02_e05"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "facil", "question": "Qual propriedade CSS altera a cor do texto e qual altera a cor de fundo de um elemento?", "options": ["color e background-color", "text-color e bg-color", "font-color e fill", "ink e paper"], "answer": 0, "explanation": "color define a cor do texto; background-color define a cor de fundo.", "id": "fe1_a02_e06"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "facil", "question": "Como escrever um comentário dentro de um arquivo CSS?", "options": ["/* comentário */", "// comentário", "\u003c!-- comentário --\u003e", "# comentário"], "answer": 0, "explanation": "CSS usa exclusivamente comentários delimitados por /* e */.", "id": "fe1_a02_e07"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "medio", "question": "Qual propriedade CSS controla a família tipográfica (fonte) de um texto?", "options": ["font-family", "text-font", "typeface", "font-style"], "answer": 0, "explanation": "font-family recebe uma lista de fontes em ordem de preferência (ex.: Arial, Helvetica, sans-serif).", "id": "fe1_a02_e08"}, {"subject": "fe1", "lessonNum": 2, "lesson": "Aula 02 — Introdução ao CSS", "official": false, "difficulty": "medio", "question": "Qual propriedade CSS centraliza horizontalmente o texto dentro de um parágrafo ou título?", "options": ["text-align: center;", "align-text: middle;", "font-align: center;", "horizontal: center;"], "answer": 0, "explanation": "text-align controla o alinhamento horizontal de texto (left, right, center, justify).", "id": "fe1_a02_e09"}, {"id": "fe1_05", "subject": "fe1", "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "difficulty": "facil", "question": "Qual valor do atributo target em uma tag \u003ca\u003e faz o link abrir em uma nova aba/janela, e qual boa prática de segurança deve acompanhá-lo?", "options": ["target=\"_self\" com rel=\"secure\"", "target=\"_blank\" com rel=\"noopener noreferrer\"", "target=\"_top\" com rel=\"nofollow\"", "target=\"_parent\" com rel=\"external\""], "answer": 1, "explanation": "target=\"_blank\" abre o link em nova aba/janela. Adicionar rel=\"noopener noreferrer\" protege a página de origem contra reverse tabnabbing (acesso via window.opener).", "official": true, "lessonNum": 3}, {"id": "fe1_06", "subject": "fe1", "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "difficulty": "medio", "question": "Para que todos os estilos de estados de um link funcionem corretamente no CSS, qual deve ser a ordem das pseudoclasses (mnemônico LVHA)?", "options": [":hover, :active, :link, :visited", ":active, :hover, :visited, :link", ":link, :visited, :hover, :active", ":visited, :link, :active, :hover"], "answer": 2, "explanation": "A ordem correta é :link → :visited → :hover → :active (LVHA / \"LoVe HAte\"). Colocar :hover antes de :link/:visited ou :active antes de :hover impede o efeito esperado.", "official": true, "lessonNum": 3}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "facil", "question": "Quantos níveis de títulos (headings) o HTML oferece, do mais importante ao menos importante?", "options": ["6 níveis (\u003ch1\u003e até \u003ch6\u003e)", "3 níveis (\u003ch1\u003e até \u003ch3\u003e)", "10 níveis (\u003ch1\u003e até \u003ch10\u003e)", "Infinitos níveis"], "answer": 0, "explanation": "HTML possui seis níveis hierárquicos de títulos: \u003ch1\u003e (principal) até \u003ch6\u003e.", "id": "fe1_a03_e01"}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "medio", "question": "Qual boa prática de acessibilidade deve ser seguida ao usar títulos \u003ch1\u003e a \u003ch6\u003e?", "options": ["Não pular níveis hierárquicos (ex.: ir de \u003ch1\u003e direto para \u003ch3\u003e) e usar CSS se quiser apenas mudar o tamanho visual.", "Usar \u003ch4\u003e para o título principal se quiser fonte menor.", "Colocar toda a página dentro de \u003ch1\u003e.", "Usar \u003cp\u003e em negrito no lugar de todos os títulos."], "answer": 0, "explanation": "Leitores de tela dependem da hierarquia sequencial (h1 → h2 → h3) para navegar pelo documento.", "id": "fe1_a03_e02"}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "facil", "question": "Qual tag cria um hiperlink em HTML e qual atributo define o endereço de destino?", "options": ["Tag \u003ca\u003e e atributo href", "Tag \u003clink\u003e e atributo src", "Tag \u003curl\u003e e atributo to", "Tag \u003cnav\u003e e atributo target"], "answer": 0, "explanation": "Links clicáveis usam \u003ca href=\"https://...\"\u003eTexto\u003c/a\u003e.", "id": "fe1_a03_e03"}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "facil", "question": "Na tag \u003cimg src='foto.jpg' alt='Campus IMD'\u003e, para que serve o atributo alt?", "options": ["Fornecer um texto alternativo exibido caso a imagem não carregue e lido por leitores de tela para acessibilidade.", "Definir a altura da imagem em pixels.", "Criar um link automático.", "Aplicar borda arredondada."], "answer": 0, "explanation": "O atributo alt descreve a imagem para pessoas com deficiência visual e aparece como fallback se o arquivo falhar.", "id": "fe1_a03_e04"}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "facil", "question": "Qual valor do atributo target em \u003ca\u003e representa o comportamento padrão (abrir o link na mesma aba)?", "options": ["_self", "_blank", "_top", "_parent"], "answer": 0, "explanation": "_self abre na mesma aba/janela; _blank abre em nova aba.", "id": "fe1_a03_e05"}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "medio", "question": "Qual propriedade CSS remove o sublinhado padrão dos links \u003ca\u003e?", "options": ["text-decoration: none;", "underline: false;", "border-bottom: none;", "link-style: plain;"], "answer": 0, "explanation": "text-decoration: none remove o sublinhado padrão aplicado pelos navegadores aos links.", "id": "fe1_a03_e06"}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "facil", "question": "Qual tag HTML define um parágrafo de texto?", "options": ["\u003cp\u003e", "\u003cpar\u003e", "\u003ctext\u003e", "\u003cbr\u003e"], "answer": 0, "explanation": "A tag \u003cp\u003e delimita parágrafos; \u003cbr\u003e insere apenas uma quebra de linha simples.", "id": "fe1_a03_e07"}, {"subject": "fe1", "lessonNum": 3, "lesson": "Aula 03 — Títulos, Parágrafos, Links e Imagens", "official": false, "difficulty": "medio", "question": "Qual tag é vazia (não precisa de tag de fechamento) entre as opções abaixo?", "options": ["\u003cimg\u003e", "\u003cp\u003e", "\u003ca\u003e", "\u003ch1\u003e"], "answer": 0, "explanation": "\u003cimg\u003e (assim como \u003cbr\u003e, \u003chr\u003e, \u003cinput\u003e e \u003cmeta\u003e) é um elemento vazio (void element) sem tag de fechamento.", "id": "fe1_a03_e08"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "facil", "question": "Qual a diferença semântica entre \u003cb\u003e e \u003cstrong\u003e (e entre \u003ci\u003e e \u003cem\u003e) em HTML?", "options": ["\u003cb\u003e e \u003ci\u003e são puramente visuais; \u003cstrong\u003e indica forte importância e \u003cem\u003e indica ênfase semântica para leitores de tela e buscadores.", "\u003cstrong\u003e não deixa o texto em negrito.", "\u003cb\u003e foi removido do HTML5 e gera erro.", "Não existe nenhuma diferença semântica."], "answer": 0, "explanation": "\u003cstrong\u003e e \u003cem\u003e carregam significado semântico além da formatação visual.", "id": "fe1_a04_e01"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "facil", "question": "Qual tag HTML destaca um texto como marca-texto (amarelo por padrão)?", "options": ["\u003cmark\u003e", "\u003chighlight\u003e", "\u003cyellow\u003e", "\u003csmall\u003e"], "answer": 0, "explanation": "A tag \u003cmark\u003e marca trechos relevantes de texto.", "id": "fe1_a04_e02"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "facil", "question": "Quais tags HTML criam, respectivamente, texto sobrescrito (ex.: x²) e texto subscrito (ex.: H₂O)?", "options": ["\u003csup\u003e e \u003csub\u003e", "\u003ctop\u003e e \u003cbot\u003e", "\u003cup\u003e e \u003cdown\u003e", "\u003csuper\u003e e \u003cunder\u003e"], "answer": 0, "explanation": "\u003csup\u003e eleva o texto (sobrescrito) e \u003csub\u003e rebaixa o texto (subscrito).", "id": "fe1_a04_e03"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "medio", "question": "Para indicar uma correção em um texto mostrando o trecho removido (tachado) e o trecho inserido (sublinhado), quais tags formam par semântico?", "options": ["\u003cdel\u003e e \u003cins\u003e", "\u003ccut\u003e e \u003cadd\u003e", "\u003cstrike\u003e e \u003cu\u003e", "\u003cold\u003e e \u003cnew\u003e"], "answer": 0, "explanation": "\u003cdel\u003e representa texto excluído (riscado) e \u003cins\u003e representa texto inserido posteriormente.", "id": "fe1_a04_e04"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "facil", "question": "Quais tags são usadas para criar uma lista NÃO ordenada e uma lista ORDENADA em HTML, respectivamente?", "options": ["\u003cul\u003e e \u003col\u003e", "\u003col\u003e e \u003cul\u003e", "\u003clist\u003e e \u003cnum\u003e", "\u003cli\u003e e \u003clu\u003e"], "answer": 0, "explanation": "\u003cul\u003e (unordered list) cria lista com marcadores; \u003col\u003e (ordered list) cria lista numerada. Ambas usam \u003cli\u003e para cada item.", "id": "fe1_a04_e05"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "facil", "question": "Qual tag representa cada item individual dentro de uma lista \u003cul\u003e ou \u003col\u003e?", "options": ["\u003cli\u003e", "\u003citem\u003e", "\u003cdt\u003e", "\u003ctr\u003e"], "answer": 0, "explanation": "\u003cli\u003e (list item) define cada elemento da lista.", "id": "fe1_a04_e06"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "medio", "question": "Em uma lista ordenada \u003col type='I'\u003e, como os itens serão numerados?", "options": ["Com algarismos romanos maiúsculos (I, II, III...)", "Com letras minúsculas (a, b, c...)", "Com algarismos arábicos (1, 2, 3...)", "Sem nenhum marcador"], "answer": 0, "explanation": "type aceita '1' (arábicos), 'A' (maiúsculas), 'a' (minúsculas), 'I' (romanos maiúsculos) e 'i' (romanos minúsculos).", "id": "fe1_a04_e07"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "medio", "question": "Qual propriedade CSS altera ou remove o marcador visual de uma lista não ordenada \u003cul\u003e?", "options": ["list-style-type (ex.: disc, square, circle, none)", "marker-style", "bullet-type", "ul-decoration"], "answer": 0, "explanation": "list-style-type: none; remove os marcadores, muito usado em menus de navegação.", "id": "fe1_a04_e08"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "facil", "question": "Qual tag HTML exibe um texto com fonte menor que o padrão (ex.: notas de rodapé)?", "options": ["\u003csmall\u003e", "\u003cmini\u003e", "\u003ctiny\u003e", "\u003csubtext\u003e"], "answer": 0, "explanation": "A tag \u003csmall\u003e representa comentários secundários ou letras miúdas.", "id": "fe1_a04_e09"}, {"subject": "fe1", "lessonNum": 4, "lesson": "Aula 04 — Formatação em HTML e Listas", "official": false, "difficulty": "medio", "question": "No CSS, qual seletor estiliza APENAS os itens \u003cli\u003e que estão dentro de uma lista não ordenada \u003cul\u003e?", "options": ["ul li { ... }", "ul + li { ... }", "li.ul { ... }", "#ul-li { ... }"], "answer": 0, "explanation": "O seletor descendente ul li seleciona apenas \u003cli\u003e contidos dentro de \u003cul\u003e.", "id": "fe1_a04_e10"}, {"id": "fe1_07", "subject": "fe1", "lesson": "Aula 05 — Identificando e Estilizando elementos", "difficulty": "facil", "question": "Qual propriedade CSS é utilizada no elemento body para aplicar uma imagem de plano de fundo em toda a página?", "options": ["background-color", "background-image", "img-background", "page-image"], "answer": 1, "explanation": "A propriedade background-image: url(\"...\") permite aplicar uma imagem atrás do conteúdo do elemento ou da página.", "official": true, "lessonNum": 5}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "facil", "question": "Qual símbolo precede um seletor de CLASSE e qual precede um seletor de ID no CSS?", "options": ["Ponto (.) para classe e jogo da velha (#) para ID.", "Jogo da velha (#) para classe e ponto (.) para ID.", "Arroba (@) para classe e cifrão ($) para ID.", "Asterisco (*) para ambos."], "answer": 0, "explanation": "Exemplos: .destaque seleciona class='destaque'; #secao1 seleciona id='secao1'.", "id": "fe1_a05_e01"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "facil", "question": "Por que não é uma boa prática atribuir o mesmo id a vários elementos HTML na mesma página?", "options": ["Porque IDs são identificadores únicos no documento; para grupos de elementos deve-se usar class.", "Porque o atributo id só funciona na tag \u003ch1\u003e.", "Porque CSS não consegue estilizar IDs.", "Porque IDs só aceitam números."], "answer": 0, "explanation": "id identifica unicamente um elemento; class agrupa múltiplos elementos com estilo compartilhado.", "id": "fe1_a05_e02"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "medio", "question": "Como aplicar duas classes ('list-1' e 'importante') simultaneamente em uma mesma tag \u003cul\u003e?", "options": ["\u003cul class=\"list-1 importante\"\u003e", "\u003cul class=\"list-1, importante\"\u003e", "\u003cul class=\"list-1\" class=\"importante\"\u003e", "\u003cul classes=\"list-1;importante\"\u003e"], "answer": 0, "explanation": "Múltiplas classes são separadas por espaço dentro do mesmo atributo class.", "id": "fe1_a05_e03"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "medio", "question": "Na propriedade background-repeat, qual valor repete a imagem de fundo apenas na horizontal?", "options": ["repeat-x", "repeat-y", "no-repeat", "round"], "answer": 0, "explanation": "repeat-x repete apenas no eixo X (horizontal); repeat-y apenas no eixo Y (vertical); no-repeat não repete.", "id": "fe1_a05_e04"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "medio", "question": "O que faz a regra CSS p { border-style: solid dashed none double; }?", "options": ["Aplica solid no topo, dashed à direita, none embaixo e double à esquerda (sentido horário).", "Aplica todas as quatro bordas apenas no topo.", "Gera erro por ter quatro valores.", "Aplica na ordem esquerda, direita, topo e base."], "answer": 0, "explanation": "Atalhos de 4 lados no CSS (border, margin, padding) seguem sempre o sentido horário: topo, direita, base, esquerda.", "id": "fe1_a05_e05"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "facil", "question": "O que seleciona o seletor CSS ul.list-1?", "options": ["Apenas elementos \u003cul\u003e que possuam a classe list-1.", "Qualquer elemento que tenha a classe list-1.", "Todos os elementos \u003cul\u003e da página.", "Um elemento com id='list-1'."], "answer": 0, "explanation": "Atrelar a tag ao seletor de classe restringe a regra somente àquela tag específica.", "id": "fe1_a05_e06"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "medio", "question": "Na propriedade background-repeat, qual a diferença entre os valores space e round?", "options": ["Ambos evitam cortes: space distribui espaços entre repetições, enquanto round redimensiona as imagens para preencher tudo.", "space repete só na vertical e round só na horizontal.", "round deixa a imagem circular.", "space remove a imagem de fundo."], "answer": 0, "explanation": "Conforme o Quadro 1 da Aula 05: space adiciona espaço excedente sem cortar; round redimensiona para preencher sem cortes.", "id": "fe1_a05_e07"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "facil", "question": "Qual propriedade CSS arredonda os cantos da borda de um elemento HTML?", "options": ["border-radius", "border-round", "corner-radius", "border-circle"], "answer": 0, "explanation": "border-radius define o raio de curvatura dos cantos (ex.: 8px ou 50% para círculo).", "id": "fe1_a05_e08"}, {"subject": "fe1", "lessonNum": 5, "lesson": "Aula 05 — Identificando e Estilizando elementos", "official": false, "difficulty": "medio", "question": "Qual propriedade CSS permite escrever largura, estilo e cor da borda em uma única declaração (ex.: 2px solid black)?", "options": ["border", "border-all", "outline-box", "edge"], "answer": 0, "explanation": "A propriedade abreviada border combina border-width, border-style e border-color.", "id": "fe1_a05_e09"}, {"id": "fe1_08", "subject": "fe1", "lesson": "Aula 06 — Tabelas", "difficulty": "facil", "question": "Em tabelas HTML construídas com \u003ctable\u003e, \u003ctr\u003e, \u003ctd\u003e e \u003cth\u003e, quais atributos são usados respectivamente para mesclar colunas e mesclar linhas?", "options": ["colmerge e rowmerge", "colspan e rowspan", "spancol e spanrow", "widthspan e heightspan"], "answer": 1, "explanation": "colspan faz uma célula se estender por múltiplas colunas, enquanto rowspan faz uma célula se estender por múltiplas linhas.", "official": true, "lessonNum": 6}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "facil", "question": "Em uma tabela HTML, quais tags representam respectivamente uma linha, uma célula de cabeçalho e uma célula de dado comum?", "options": ["\u003ctr\u003e, \u003cth\u003e e \u003ctd\u003e", "\u003ctd\u003e, \u003ctr\u003e e \u003cth\u003e", "\u003crow\u003e, \u003chead\u003e e \u003ccell\u003e", "\u003cthead\u003e, \u003ctbody\u003e e \u003ctfoot\u003e"], "answer": 0, "explanation": "\u003ctr\u003e = table row; \u003cth\u003e = table header (negrito/centralizado por padrão); \u003ctd\u003e = table data.", "id": "fe1_a06_e01"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "facil", "question": "Quais três seções semânticas organizam tabelas maiores em HTML5?", "options": ["\u003cthead\u003e, \u003ctbody\u003e e \u003ctfoot\u003e", "\u003cheader\u003e, \u003cmain\u003e e \u003cfooter\u003e", "\u003ctop\u003e, \u003cmid\u003e e \u003cbot\u003e", "\u003cth\u003e, \u003ctr\u003e e \u003ctd\u003e"], "answer": 0, "explanation": "\u003cthead\u003e agrupa o cabeçalho, \u003ctbody\u003e o corpo de dados e \u003ctfoot\u003e o rodapé/totais da tabela.", "id": "fe1_a06_e02"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "facil", "question": "Qual tag, inserida logo após a abertura de \u003ctable\u003e, adiciona um título ou legenda acessível para a tabela?", "options": ["\u003ccaption\u003e", "\u003ctitle\u003e", "\u003clegend\u003e", "\u003clabel\u003e"], "answer": 0, "explanation": "\u003ccaption\u003e descreve o conteúdo da tabela para leitura e acessibilidade.", "id": "fe1_a06_e03"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "medio", "question": "Qual propriedade CSS faz com que bordas adjacentes das células de uma tabela se fundam em uma borda única limpa?", "options": ["border-collapse: collapse;", "border-merge: single;", "table-border: join;", "border-spacing: none;"], "answer": 0, "explanation": "border-collapse: collapse; elimina as bordas duplas padrão entre células de tabela.", "id": "fe1_a06_e04"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "facil", "question": "O que faz a regra CSS tr:hover { background-color: lightblue; } em uma tabela?", "options": ["Destaca a cor de fundo da linha inteira quando o cursor do mouse passa sobre ela.", "Pinta apenas a primeira coluna.", "Oculta a linha ao clicar.", "Altera o tamanho da fonte do cabeçalho."], "answer": 0, "explanation": "A pseudoclasse :hover em \u003ctr\u003e melhora a leitura interativa de linhas em tabelas.", "id": "fe1_a06_e05"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "medio", "question": "Se uma tabela tem 3 colunas e uma célula do cabeçalho precisa ocupar toda a largura das 3 colunas, qual atributo deve ser usado?", "options": ["colspan=\"3\"", "rowspan=\"3\"", "width=\"3\"", "span=\"3\""], "answer": 0, "explanation": "colspan='3' mescla 3 colunas horizontalmente em uma única célula.", "id": "fe1_a06_e06"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "medio", "question": "Para criar uma tabela zebrada (linhas pares com cor de fundo alternada) em CSS puro, qual seletor é usado?", "options": ["tr:nth-child(even)", "tr:zebra", "tr:odd-even", "table:striped"], "answer": 0, "explanation": "nth-child(even) seleciona linhas pares e nth-child(odd) seleciona linhas ímpares.", "id": "fe1_a06_e07"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "facil", "question": "Qual propriedade CSS controla o espaçamento interno entre o texto de uma célula \u003ctd\u003e e sua borda?", "options": ["padding", "margin", "gap", "cell-indent"], "answer": 0, "explanation": "padding cria respiro interno dentro das células \u003cth\u003e e \u003ctd\u003e.", "id": "fe1_a06_e08"}, {"subject": "fe1", "lessonNum": 6, "lesson": "Aula 06 — Tabelas", "official": false, "difficulty": "medio", "question": "Qual atributo de acessibilidade em \u003cth\u003e indica se o cabeçalho se refere a uma coluna ('col') ou a uma linha ('row')?", "options": ["scope", "target", "for", "role-dir"], "answer": 0, "explanation": "scope=\"col\" ou scope=\"row\" ajuda leitores de tela a associar cabeçalhos às células de dados.", "id": "fe1_a06_e09"}, {"id": "fe1_09", "subject": "fe1", "lesson": "Aula 07 — Formulários", "difficulty": "medio", "question": "Qual a principal diferença entre os métodos HTTP GET e POST no atributo method da tag \u003cform\u003e?", "options": ["GET envia os dados na própria URL; POST envia os dados no corpo da requisição HTTP, sem exibi-los na URL.", "POST envia os dados na URL; GET envia no corpo oculto da requisição.", "GET só funciona com \u003ctextarea\u003e e POST só funciona com \u003cinput type=\"password\"\u003e.", "Não há diferença prática entre GET e POST em formulários HTML."], "answer": 0, "explanation": "O método GET anexa os pares name=valor diretamente na URL. O método POST envia os dados no corpo da requisição HTTP, sendo indicado para dados sensíveis ou volumosos.", "official": true, "lessonNum": 7}, {"id": "fe1_10", "subject": "fe1", "lesson": "Aula 07 — Formulários", "difficulty": "facil", "question": "Em um formulário HTML, qual a diferença entre os atributos readonly e disabled em um campo \u003cinput\u003e?", "options": ["readonly impede edição mas mantém o campo ativo/enviável; disabled desabilita completamente o campo para interação e envio.", "Ambos apagam o valor inicial do campo.", "disabled permite digitar mas oculta com asteriscos.", "readonly só funciona em botões do tipo submit."], "answer": 0, "explanation": "readonly impede a modificação do texto pelo usuário mantendo o campo selecionável; disabled deixa o campo inativo e impedido de interação.", "official": true, "lessonNum": 7}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "facil", "question": "Qual tag cria um formulário HTML e qual atributo indica a URL do servidor que receberá os dados submetidos?", "options": ["Tag \u003cform\u003e e atributo action", "Tag \u003cinput\u003e e atributo href", "Tag \u003csubmit\u003e e atributo src", "Tag \u003cfieldset\u003e e atributo target"], "answer": 0, "explanation": "\u003cform action='https://...' method='POST'\u003e define o formulário e seu destino de envio.", "id": "fe1_a07_e01"}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "facil", "question": "Para associar semanticamente um rótulo \u003clabel\u003e a um campo \u003cinput id='nome'\u003e, qual atributo deve ser usado na tag \u003clabel\u003e?", "options": ["for=\"nome\"", "id=\"nome\"", "name=\"nome\"", "target=\"nome\""], "answer": 0, "explanation": "O atributo for do \u003clabel\u003e deve coincidir com o id do campo, permitindo focar o input ao clicar no rótulo.", "id": "fe1_a07_e02"}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "facil", "question": "Por que é essencial definir o atributo name em cada campo de entrada de um formulário enviado ao servidor?", "options": ["Porque o servidor identifica cada dado recebido pelo par name=valor.", "Porque o navegador não exibe campos sem name.", "Porque name define a cor do campo.", "Porque name substitui o atributo type."], "answer": 0, "explanation": "Sem o atributo name, o campo não é incluído nos dados enviados na submissão do formulário.", "id": "fe1_a07_e03"}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "facil", "question": "Qual a diferença funcional entre \u003cinput type='radio'\u003e e \u003cinput type='checkbox'\u003e?", "options": ["radio permite escolher apenas uma opção dentro do mesmo grupo (mesmo name); checkbox permite marcar múltiplas opções independentes.", "checkbox só permite uma opção; radio permite várias.", "Ambos funcionam como campos de senha.", "radio envia texto livre."], "answer": 0, "explanation": "Botões de rádio com o mesmo atributo name são mutuamente exclusivos; checkboxes permitem múltipla seleção.", "id": "fe1_a07_e04"}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "facil", "question": "Qual tag HTML permite inserir textos longos de múltiplos parágrafos em um formulário?", "options": ["\u003ctextarea\u003e", "\u003cinput type='longtext'\u003e", "\u003cparagraph\u003e", "\u003ctextbox\u003e"], "answer": 0, "explanation": "\u003ctextarea rows='10' cols='30'\u003e\u003c/textarea\u003e cria uma área de texto multilinha.", "id": "fe1_a07_e05"}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "medio", "question": "Em um campo \u003cselect\u003e, qual atributo permite ao usuário selecionar múltiplas opções simultaneamente?", "options": ["multiple", "multi", "many", "checkbox"], "answer": 0, "explanation": "\u003cselect name='carros' multiple\u003e habilita seleção múltipla.", "id": "fe1_a07_e06"}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "medio", "question": "Para que serve a tag \u003cdatalist\u003e combinada com \u003cinput type='text' list='navegadores'\u003e?", "options": ["Fornecer uma lista de sugestões de preenchimento automático (autocomplete) para o campo de texto.", "Criar uma tabela de banco de dados.", "Ocultar a senha digitada.", "Validar CPF automaticamente."], "answer": 0, "explanation": "\u003cdatalist\u003e associa opções \u003coption\u003e sugeridas ao usuário enquanto ele digita no \u003cinput\u003e.", "id": "fe1_a07_e07"}, {"subject": "fe1", "lessonNum": 7, "lesson": "Aula 07 — Formulários", "official": false, "difficulty": "facil", "question": "Qual atributo de \u003cinput\u003e exibe um texto de dica dentro do campo vazio que desaparece quando o usuário começa a digitar?", "options": ["placeholder", "value", "maxlength", "autofocus"], "answer": 0, "explanation": "placeholder mostra texto orientativo temporário; value preenche um valor real inicial.", "id": "fe1_a07_e08"}, {"id": "fe1_11", "subject": "fe1", "lesson": "Aula 08 — Elementos Block e Inline", "difficulty": "facil", "question": "Qual alternativa apresenta corretamente um elemento HTML com display block por padrão e outro com display inline por padrão?", "options": ["\u003cspan\u003e (block) e \u003cdiv\u003e (inline)", "\u003cdiv\u003e (block) e \u003cspan\u003e (inline)", "\u003ca\u003e (block) e \u003cp\u003e (inline)", "\u003cimg\u003e (block) e \u003csection\u003e (inline)"], "answer": 1, "explanation": "\u003cdiv\u003e, \u003cp\u003e, \u003csection\u003e, \u003cheader\u003e e \u003ch1\u003e–\u003ch6\u003e são elementos block por padrão. \u003cspan\u003e, \u003ca\u003e, \u003cimg\u003e, \u003cstrong\u003e e \u003cinput\u003e são inline por padrão.", "official": true, "lessonNum": 8}, {"subject": "fe1", "lessonNum": 8, "lesson": "Aula 08 — Elementos Block e Inline", "official": false, "difficulty": "facil", "question": "Qual é o comportamento padrão de um elemento HTML do tipo block (como \u003cdiv\u003e)?", "options": ["Ocupa toda a largura horizontal disponível e inicia em uma nova linha.", "Fica sempre lado a lado na mesma linha sem quebrar.", "Ignora propriedades width e height.", "Fica invisível até receber hover."], "answer": 0, "explanation": "Elementos block ocupam 100% da largura do contêiner por padrão e empilham verticalmente.", "id": "fe1_a08_e01"}, {"subject": "fe1", "lessonNum": 8, "lesson": "Aula 08 — Elementos Block e Inline", "official": false, "difficulty": "facil", "question": "Qual é o comportamento padrão de um elemento inline (como \u003cspan\u003e)?", "options": ["Ocu 5"}, {"subject": "fe1", "lessonNum": 8, "lesson": "Aula 08 — Elementos Block e Inline", "official": false, "difficulty": "facil", "question": "Os elementos \u003cdiv\u003e e \u003cspan\u003e possuem significado semântico próprio no HTML?", "options": ["Não; são contêineres genéricos usados para agrupar e estilizar elementos quando não há tag semântica específica.", "Sim; \u003cdiv\u003e significa artigo e \u003cspan\u003e significa menu.", "Sim; ambos substituem \u003cheader\u003e e \u003cfooter\u003e.", "Apenas \u003cspan\u003e é semântico."], "answer": 0, "explanation": "\u003cdiv\u003e (block) e \u003cspan\u003e (inline) são agrupadores neutros sem significado semântico próprio.", "id": "fe1_a08_e06"}, {"subject": "fe1", "lessonNum": 8, "lesson": "Aula 08 — Elementos Block e Inline", "official": false, "difficulty": "medio", "question": "Quais dois valores modernos de display destacados na Aula 08 superam o uso antigo de float para criar layouts previsíveis?", "options": ["flex e grid", "table e inline", "static e relative", "block e none"], "answer": 0, "explanation": "CSS Flexbox (flex) e CSS Grid (grid) oferecem alinhamento e distribuição muito mais previsíveis que float.", "id": "fe1_a08_e07"}, {"subject": "fe1", "lessonNum": 8, "lesson": "Aula 08 — Elementos Block e Inline", "official": false, "difficulty": "facil", "question": "O que acontece quando aplicamos display: none; a um elemento HTML?", "options": ["O elemento é completamente removido da renderização visual e não ocupa espaço no layout.", "O elemento fica transparente mas mantém seu espaço vazio.", "O elemento vai para o final da página.", "Apenas a borda desaparece."], "answer": 0, "explanation": "display: none oculta o elemento e libera o espaço ocupado (diferente de visibility: hidden, que mantém o espaço).", "id": "fe1_a08_e08"}, {"subject": "fe1", "lessonNum": 8, "lesson": "Aula 08 — Elementos Block e Inline", "official": false, "difficulty": "medio", "question": "No layout clássico de 2 colunas com #menu (width: 30%; padding: 20px; float: left) e #artigo (width: 70%; padding: 20px; float: left), por que foi necessário usar box-sizing: border-box?", "options": ["Para que o padding de 20px não somasse além de 30% + 70% = 100%, evitando que a segunda coluna quebrasse para a linha de baixo.", "Para mudar a cor das bordas.", "Para ativar o Flexbox.", "Para centralizar o texto."], "answer": 0, "explanation": "Sem border-box, 30% + 70% + paddings ultrapassaria 100% da largura, derrubando #artigo para baixo.", "id": "fe1_a08_e09"}, {"id": "fe1_12", "subject": "fe1", "lesson": "Aula 09 — Modelo de caixas, Posicionamento e Alinhamento", "difficulty": "medio", "question": "No modelo de caixa do CSS, o comportamento padrão (content-box) soma padding e border à largura definida em width. Qual propriedade faz padding e border serem descontados DENTRO do width definido?", "options": ["box-sizing: border-box;", "box-model: inner-box;", "overflow: hidden;", "display: inline-block;"], "answer": 0, "explanation": "Com box-sizing: border-box, a largura (width) declarada já inclui o conteúdo, o padding e a borda, facilitando cálculos previsíveis de layout.", "official": true, "lessonNum": 9}, {"id": "fe1_13", "subject": "fe1", "lesson": "Aula 09 — Modelo de caixas, Posicionamento e Alinhamento", "difficulty": "medio", "question": "Qual é o valor padrão da propriedade CSS position, e qual valor de overflow exibe barra de rolagem APENAS quando o conteúdo excede a área disponível?", "options": ["position: relative e overflow: scroll", "position: static e overflow: auto", "position: absolute e overflow: hidden", "position: fixed e overflow: visible"], "answer": 1, "explanation": "Todo elemento HTML nasce com position: static (fluxo normal). Já overflow: auto só adiciona barra de rolagem se o conteúdo realmente ultrapassar as dimensões do elemento.", "official": true, "lessonNum": 9}, {"subject": "fe1", "lessonNum": 9, "lesson": "Aula 09 — Modelo de caixas, Posicionamento e Alinhamento", "official": false, "difficulty": "facil", "question": "No Modelo de Caixa (Box Model) do CSS, qual é a ordem correta das camadas de DENTRO para FORA?", "options": ["Conteúdo → Padding → Border → Margin", "Margin → Border → Padding → Conteúdo", "Conteúdo → Margin → Padding → Border", "Border → Conteúdo → Padding → Margin"], "answer": 0, "explanation": "Do interior para o exterior: Conteúdo, Padding (espaçamento interno), Border (borda) e Margin (espaçamento externo).", "id": "fe1_a09_e01"}, {"subject": "fe1", "lessonNum": 9, "lesson": "Aula 09 — Modelo de caixas, Posicionamento e Alinhamento", "official": false, "difficulty": "facil", "question": "Qual a diferença entre padding e margin no Box Model?", "options": ["padding é o espaçamento interno (entre o conteúdo e a borda); margin é o espaçamento externo (entre a borda e os outros elementos).", "margin é interno e padding é externo.", "padding só existe em tabelas.", "Ambos são exatamente iguais."], "answer": 0, "explanation": "padding afasta o conteúdo da borda (herdando o background); margin afasta a caixa dos elementos vizinhos.", "id": "fe1_a09_e02"}, {"subject": "fe1", "lessonNum": 9, "lesson": "Aula 09 — Modelo de caixas, Posicionamento e Alinhamento", "official": false, "difficulty": "medio", "question": "Como se comporta um elemento com position: fixed;?", "options": ["Fica fixo em relação à janela de visualização (viewport), permanecendo visível mesmo ao rolar a página.", "Move-se junto com a rolagem normalmente.", "Ignora top, left, right e bottom.", "Só funciona dentro de \u003ctable\u003e."], "answer": 0, "explanation": "position: fixed fixa o elemento na tela (muito usado em barras de navegação fixas e botões flutuantes).", "id": "fe1_a09_e03"}, {"subject": "fe1", "lessonNum": 9, "lesson": "Aula 09 — Modelo de caixas, Posicionamento e Alinhamento", "official": false, "difficulty": "medio", "question": "Qual a diferença entre position: relative e position: absolute?", "options": ["relative des  ["controls", "buttons", "player", "ui"], "answer": 0, "explanation": "Sem o atributo controls, o navegador não exibe a barra de controles padrão do reprodutor.", "id": "fe1_a10_e02"}, {"subject": "fe1", "lessonNum": 10, "lesson": "Aula 10 — Multimídia", "official": false, "difficulty": "facil", "question": "Qual tag filha de \u003cvideo\u003e e \u003caudio\u003e permite informar múltiplos formatos de arquivo (ex.: .mp3 e .ogg) como alternativa para compatibilidade?", "options": ["\u003csource\u003e", "\u003cfile\u003e", "\u003calt\u003e", "\u003cformat\u003e"], "answer": 0, "explanation": "O navegador percorre as tags \u003csource src='...' type='...'\u003e e reproduz o primeiro formato suportado.", "id": "fe1_a10_e03"}, {"subject": "fe1", "lessonNum": 10, "lesson": "Aula 10 — Multimídia", "official": false, "difficulty": "facil", "question": "O que faz o atributo loop nas tags \u003caudio\u003e e \u003cvideo\u003e?", "options": ["Faz a mídia reiniciar automaticamente toda vez que chega ao final.", "Reproduz o vídeo em câmera lenta.", "Silencia o áudio.", "Baixa o arquivo automaticamente."], "answer": 0, "explanation": "loop mantém a reprodução contínua em ciclo.", "id": "fe1_a10_e04"}, {"subject": "fe1", "lessonNum": 10, "lesson": "Aula 10 — Multimídia", "official": false, "difficulty": "medio", "question": "Como exibir uma mensagem de aviso caso o navegador do usuário não suporte a tag \u003caudio\u003e ou os formatos informados?", "options": ["Escrevendo um parágrafo \u003cp\u003eSeu navegador não suporta áudio.\u003c/p\u003e dentro da própria tag \u003caudio\u003e, após as tags \u003csource\u003e.", "Usando o atributo alt na tag \u003caudio\u003e.", "Criando um arquivo erro.mp3.", "Não é possível exibir fallback."], "answer": 0, "explanation": "Conteúdo textual dentro de \u003caudio\u003e...\u003c/audio\u003e ou \u003cvideo\u003e...\u003c/video\u003e só aparece quando o navegador não suporta a tag.", "id": "fe1_a10_e05"}, {"subject": "fe1", "lessonNum": 10, "lesson": "Aula 10 — Multimídia", "official": false, "difficulty": "facil", "question": "Qual atributo tenta iniciar a reprodução do vídeo ou áudio automaticamente assim que a página carrega?", "options": ["autoplay", "autostart", "playnow", "onload"], "answer": 0, "explanation": "autoplay solicita reprodução automática (muitos navegadores exigem também muted para liberar autoplay em vídeos).", "id": "fe1_a10_e06"}, {"subject": "fe1", "lessonNum": 10, "lesson": "Aula 10 — Multimídia", "official": false, "difficulty": "medio", "question": "Quais tecnologias modernas substituíram o antigo Adobe Flash para criar animações na web?", "options": ["CSS (transition/animation), SVG animado, HTML5 \u003ccanvas\u003e com JavaScript e bibliotecas como GSAP.", "Apenas tabelas HTML.", "Tags \u003cblink\u003e e \u003cmarquee\u003e.", "Arquivos .swf via \u003cobject\u003e."], "answer": 0, "explanation": "Conforme a atualização da Aula 10, animações web hoje usam CSS, SVG, Canvas/JS e bibliotecas modernas.", "id": "fe1_a10_e07"}, {"subject": "fe1", "lessonNum": 10, "lesson": "Aula 10 — Multimídia", "official": false, "difficulty": "facil", "question": "Na tag \u003cobject data='multimidia/sample.pdf' type='application/pdf'\u003e, qual atributo especifica o caminho do arquivo incorporado?", "options": ["data", "href", "src", "file"], "answer": 0, "explanation": "Diferente de \u003cimg\u003e (que usa src), a tag \u003cobject\u003e usa o atributo data.", "id": "fe1_a10_e08"}, {"subject": "fe1", "lessonNum": 10, "lesson": "Aula 10 — Multimídia", "official": false, "difficulty": "medio", "question": "Qual formato de vídeo amplamente suportado em navegadores modernos usa o MIME type 'video/mp4'?", "options": ["MP4 (H.264)", "AVI", "SWF", "BMP"], "answer": 0, "explanation": "MP4 (video/mp4) e WebM (video/webm) são os formatos padrão de vídeo na web atual.", "id": "fe1_a10_e09"}, {"id": "fe1_15", "subject": "fe1", "lesson": "Aula 11 — HTML Layout (Semântica e Flexbox)", "difficulty": "medio", out (Semântica e Flexbox)", "official": false, "difficulty": "facil", "question": "Qual declaração CSS ativa o Flexbox em um elemento contêiner?", "options": ["display: flex;", "flex: active;", "position: flex;", "layout: flexbox;"], "answer": 0, "explanation": "display: flex transforma o elemento em um flex container e seus filhos diretos em flex items.", "id": "fe1_a11_e02"}, {"subject": "fe1", "lessonNum": 11, "lesson": "Aula 11 — HTML Layout (Semântica e Flexbox)", "official": false, "difficulty": "facil", "question": "No Flexbox, qual propriedade define se os itens ficam em linha (row) ou em coluna (column)?", "options": ["flex-direction", "flex-align", "justify-content", "flex-order"], "answer": 0, "explanation": "flex-direction aceita row, row-reverse, column e column-reverse.", "id": "fe1_a11_e03"}, {"subject": "fe1", "lessonNum": 11, "lesson": "Aula 11 — HTML Layout (Semântica e Flexbox)", "official": false, "difficulty": "medio", "question": "Qual valor de justify-content distribui os itens com o primeiro encostado no início, o último no fim e espaço igual entre eles?", "options": ["space-between", "space-around", "center", "flex-end"], "answer": 0, "explanation": "space-between coloca espaço apenas entre os itens; space-around adiciona meia margem nas pontas; space-evenly iguala todos os espaços.", "id": "fe1_a11_e04"}, {"subject": "fe1", "lessonNum": 11, "lesson": "Aula 11 — HTML Layout (Semântica e Flexbox)", "official": false, "difficulty": "medio", "question": "Qual propriedade do contêiner Flexbox permite que os itens quebrem para a linha seguinte quando não houver espaço suficiente?", "options": ["flex-wrap: wrap;", "flex-break: line;", "overflow: wrap;", "word-wrap: break;"], "answer": 0, "explanation": "Por padrão flex-wrap é nowrap (espreme tudo em uma linha). wrap habilita quebra de linha.", "id": "fe1_a11_e05"}, {"subject": "fe1", "lessonNum": 11, "lesson": "Aula 11 — HTML Layout (Semântica e Flexbox)", "official": false, "difficulty": "medio", "question": "Para que serve a propriedade abreviada flex-flow: row wrap;?", "options": ["Combina flex-direction e flex-wrap em uma única declaração.", "Combina justify-content e align-items.", "Define cor e borda do contêiner.", "Substitui display: flex."], "answer": 0, "explanation": "flex-flow é o shorthand de flex-direction + flex-wrap.", "id": "fe1_a11_e06"}, {"subject": "fe1", "lessonNum": 11, "lesson": "Aula 11 — HTML Layout (Semântica e Flexbox)", "official": false, "difficulty": "medio", "question": "O que significa a sintaxe enxuta flex: 1; aplicada a um item flexível (como nav { flex: 1; })?", "options": ["Configura flex-grow: 1, flex-shrink: 1 e flex-basis: 0, fazendo o item crescer proporcionalmente para ocupar o espaço disponível.", "Define largura fixa de 1 pixel.", "Impede o item de crescer.", "Oculta o item em celulares."], "answer": 0, "explanation": "Conforme a Aula 11, flex: 1 equivale a grow=1, shrink=1 e basis=0.", "id": "fe1_a11_e07"}, {"subject": "fe1", "lessonNum": 11, "lesson": "Aula 11 — HTML Layout (Semântica e Flexbox)", "official": false, "difficulty": "facil", "question": "Ao migrar um layout antigo de float para Flexbox (Aula 11), quais propriedades antigas deixaram de ser necessárias na nav, article e footer?", "options": ["float: left e clear: both", "color e padding", "font-family e background-color", "display e box-sizing"], "answer": 0, "explanation": "Flexbox organiza colunas nativamente sem depender de float nem de clear: both no rodapé.", "id": "fe1_a11_e08"}, {"id": "fe1_17", "subject": "fe1", "lesson": "Aula 12 — HTML Responsivo", "difficulty": "medio", "question": "Para adaptar um layout Flexbox de desktop para telas de smartphone (até 768px), qual regra Media Query empilha os itens de uma \u003csection\u003e um abaixo do outro?", "code": "@media only screen and (max-width: 768px) {\n  section {\n    /* propriedade aqui */\n  }\n}", "options": ["flex-direction: column;", "flex-direction: row-reverse;", "display: inline;", "float: none;"], "answer": 0, "explanation": "Alterar flex-direction de row para column dentro da media query (max-width: 768px) faz com que menu e conteúdo fiquem empilhados verticalmente em telas pequenas.", "official": true, "lessonNum": 12}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "facil", "question": "O que é Responsividade (Web Design Responsivo)?", "options": ["A capacidade de um site adaptar seu layout, imagens e textos a diferentes tamanhos de tela e dispositivos (smartphones, tablets, desktops).", "A velocidade de resposta do servidor de banco de dados.", "Um efeito de animação em Flash.", "A criação de um site separado apenas para impressão."], "answer": 0, "explanation": "Sites responsivos se ajustam fluidamente ao viewport de qualquer dispositivo.", "id": "fe1_a12_e01"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "facil", "question": "O que é o Viewport em desenvolvimento front-end?", "options": ["A área visível disponível para renderizar a página web na tela do dispositivo do usuário.", "A porta TCP do servidor web.", "Uma tag para exibir vídeos.", "O tamanho do disco rígido do celular."], "answer": 0, "explanation": "Viewport é a janela útil de visualização do navegador no dispositivo.", "id": "fe1_a12_e02"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "facil", "question": "Qual meta tag essencial configura o viewport corretamente para dispositivos móveis?", "options": ["\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e", "\u003cmeta name=\"mobile\" content=\"true\"\u003e", "\u003cmeta charset=\"responsive\"\u003e", "\u003clink rel=\"viewport\" href=\"mobile.css\"\u003e"], "answer": 0, "explanation": "Essa meta tag instrui o navegador mobile a igualar a largura lógica do layout à largura real da tela.", "id": "fe1_a12_e03"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "medio", "question": "Qual regra CSS impede que uma imagem ultrapasse a largura do seu contêiner mantendo sua proporção?", "options": ["max-width: 100%; height: auto;", "width: 1200px; height: 800px;", "overflow: scroll;", "display: inline;"], "answer": 0, "explanation": "max-width: 100% com height: auto torna a imagem fluida e proporcional.", "id": "fe1_a12_e04"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "medio", "question": "Qual unidade CSS de texto ou dimensão é relativa a 1% da largura do viewport?", "options": ["vw (viewport width)", "px (pixel)", "pt (ponto)", "cm (centímetro)"], "answer": 0, "explanation": "1vw equivale a 1% da largura do viewport; 1vh equivale a 1% da altura do viewport.", "id": "fe1_a12_e05"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "medio", "question": "Qual tag HTML permite fornecer diferentes arquivos de imagem dependendo da resolução da tela (ex.: pequena até 600px, média até 1200px, grande acima)?", "options": ["\u003cpicture\u003e com tags \u003csource media='...'\u003e", "\u003cimg-responsive\u003e", "\u003ccanvas\u003e", "\u003cgallery\u003e"], "answer": 0, "explanation": "\u003cpicture\u003e escolhe a imagem ideal conforme media queries, economizando dados no celular.", "id": "fe1_a12_e06"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "dificil", "question": "Em um código com regra base aquamarine, @media (max-width: 600px) { rebeccapurple } e @media (min-width: 1200px) { red }, qual cor aparece em uma tela de 900px?", "options": ["aquamarine", "rebeccapurple", "red", "white"], "answer": 0, "explanation": "900px não atende \u003c= 600px nem \u003e= 1200px, então prevalece a regra base (aquamarine).", "id": "fe1_a12_e07"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "medio", "question": "Qual função CSS moderna citada na Aula 12 permite definir um tamanho de fonte fluido com mínimo, preferido e máximo?", "options": ["clamp()", "calc-only()", "scale()", "fit()"], "answer": 0, "explanation": "clamp(min, ideal, max) mantém a tipografia responsiva sem ficar pequena ou grande demais.", "id": "fe1_a12_e08"}, {"subject": "fe1", "lessonNum": 12, "lesson": "Aula 12 — HTML Responsivo", "official": false, "difficulty": "facil", "question": "Qual boa prática NÃO deve ser seguida ao construir layouts responsivos?", "options": ["Usar elementos grandes com largura fixa em pixels (ex.: width: 1400px).", "Aplicar Media Queries para diferentes pontos de quebra.", "Usar unidades relativas como %, vw e rem.", "Testar a página em diferentes larguras de tela."], "answer": 0, "explanation": "Larguras fixas grandes causam barra de rolagem horizontal indesejada em telas menores.", "id": "fe1_a12_e09"}, {"id": "fe1_18", "subject": "fe1", "lesson": "Aula 13 — Seletores avançados, Pseudoclasses e Pseudoelementos", "difficulty": "medio", "question": "No CSS3, qual a diferença entre :hover e ::after?", "options": [":hover é uma pseudoclasse (estado do elemento) e ::after é um pseudoelemento (insere conteúdo virtual após o elemento).", ":hover é um pseudoelemento e ::after é um seletor de ID.", "Ambos só funcionam em tabelas HTML.", "Não existe diferença entre dois pontos simples e duplos no CSS."], "answer": 0, "explanation": "Pseudoclasses (:hover, :first-child, :nth-child()) selecionam estados; pseudoelementos (::before, ::after, ::first-letter) estilam partes específicas ou inserem conteúdo virtual.", "official": true, "lessonNum": 13}, {"subject": "fe1", "lessonNum": 13, "lesson": "Aula 13 — Seletores avançados, Pseudoclasses e Pseudoelementos", "official": false, "difficulty": "facil", "question": "O que seleciona o seletor global * { margin: 0; } no CSS?", "options": ["Todos os elementos HTML da página.", "Apenas os elementos com classe.", "Apenas o elemento \u003cbody\u003e.", "Apenas os links \u003ca\u003e."], "answer": 0, "explanation": "O asterisco (*) é o seletor universal que atinge todos os elementos do documento.", "id": "fe1_a13_e01"}, {"subject": "fe1", "lessonNum": 13, "lesson": "Aula 13 — Seletores avançados, Pseudoclasses e Pseudoelementos", "official": false, "difficulty": "medio", "question": "Qual a diferença entre os seletores div p (descendente) e div \u003e p (filho direto)?", "options": ["div p seleciona todos os \u003cp\u003e em qualquer nível dentro da \u003cdiv\u003e; div \u003e p seleciona apenas os \u003cp\u003e que são filhos diretos da \u003cdiv\u003e.", "div \u003e p seleciona apenas o primeiro parágrafo.", "div p seleciona o irmão seguinte.", "Não há diferença prática."], "answer": 0, "explanation": "O combinador \u003e restringe a seleção estritamente ao primeiro nível de descendência.", "id": "fe1_a13_e02"}, {"subject": "fe1", "lessonNum": 13, "lesson": "Aula 13 — Seletores avançados, Pseudoclasses e Pseudoelementos", "official": false, "difficulty": "medio", "question": "O que seleciona o combinador de irmão direto section + h2?", "options": ["Apenas o primeiro \u003ch2\u003e que aparece imediatamente após uma \u003csection\u003e (mesmo pai).", "Todos os \u003ch2\u003e dentro de \u003csection\u003e.", "Todos os \u003ch2\u003e em qualquer lugar após \u003csection\u003e.", "A \u003csection\u003e que vem depois de \u003ch2\u003e."], "answer": 0, "explanation": "O sinal + seleciona apenas o irmão adjacente imediato; o til (~) seleciona todos os irmãos seguintes.", "id": "fe1_a13_e03"}, {"subject": "fe1", "lessonNum": 13, "lesson": "Aula 13 — Seletores avançados, Pseudoclasses e Pseudoelementos", "official": false, "difficulty": "medio", "question": "O que seleciona o combinador de irmãos gerais section ~ h2?", "options": ["Todos os elementos \u003ch2\u003e que seguem uma \u003csection\ : 13, "lesson": "Aula 13 — Seletores avançados, Pseudoclasses e Pseudoelementos", "official": false, "difficulty": "medio", "question": "Qual propriedade CSS é indispensável dentro de ::before e ::after para que o conteúdo decorativo apareça?", "options": ["content", "text", "value", "insert"], "answer": 0, "explanation": "Sem a propriedade content (ex.: content: '★'; ou content: url(...);), ::before e ::after não são renderizados.", "id": "fe1_a13_e08"}, {"subject": "fe1", "lessonNum": 13, "lesson": "Aula 13 — Seletores avançados, Pseudoclasses e Pseudoelementos", "official": false, "difficulty": "dificil", "question": "O que seleciona o seletor combinado p:first-child::first-letter?", "options": ["Apenas a primeira letra do primeiro parágrafo filho de um mesmo pai.", "Todas as letras de todos os parágrafos.", "A primeira letra de todos os parágrafos.", "É uma sintaxe inválida no CSS."], "answer": 0, "explanation": "Pseudoclasses e pseudoelementos podem ser combinados: primeiro filtra o primeiro filho (\u003cp\u003e) e então estiliza sua letra inicial.", "id": "fe1_a13_e09"}, {"id": "fe1_19", "subject": "fe1", "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "difficulty": "facil", "question": "Sobre o sistema de grid do Bootstrap, qual é o número máximo de colunas por linha (row) e qual classe faz uma coluna ocupar exatamente 50% da largura disponível?", "options": ["10 colunas; classe col-50", "12 colunas; classe col-6", "8 colunas; classe col-4", "14 colunas; classe col-7"], "answer": 1, "explanation": "O grid do Bootstrap divide cada linha (row) em 12 colunas flexíveis. Para ocupar 50% da largura, usa-se col-6 (6/12 = 50%).", "official": true, "lessonNum": 14}, {"id": "fe1_20", "subject": "fe1", "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "difficulty": "facil", "question": "Qual classe do Bootstrap 4 deixa o cabeçalho (\u003cthead\u003e) de uma tabela com aparência escura, e qual empresa desenvolveu o Bootstrap originalmente?", "options": ["table-dark-header; desenvolvido pelo Google", "thead-dark; desenvolvido inicialmente pelo Twitter", "dark-thead; desenvolvido pela Microsoft", "head-dark; desenvolvido pela Meta"], "answer": 1, "explanation": "No Bootstrap 4, aplica-se a classe .thead-dark à tag \u003cthead\u003e para cabeçalho escuro. O framework foi criado originalmente no Twitter para agilizar sites responsivos.", "official": true, "lessonNum": 14}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "facil", "question": "No Bootstrap, qual a diferença entre as classes container e container-fluid?", "options": ["container tem largura máxima fixa responsiva e centralizada; container-fluid ocupa 100% da largura da tela em qualquer resolução.", "container-fluid só funciona em celulares.", "container não aceita linhas (row).", "Não há diferença entre ambas."], "answer": 0, "explanation": "container cria margens laterais em telas maiores; container-fluid estende-se de ponta a ponta.", "id": "fe1_a14_e01"}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "facil", "question": "No sistema de grid do Bootstrap, qual classe define uma linha que agrupa colunas?", "options": ["row", "line", "grid-row", "cols"], "answer": 0, "explanation": "A hierarquia padrão do grid é .container (ou .container-fluid) → .row → .col-*.", "id": "fe1_a14_e02"}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "medio", "question": "O que define a classe col-md-4 no Bootstrap?", "options": ["Que a coluna ocupará 4 das 12 partes (1/3 da linha) a partir do ponto de quebra médio (md ≥ 768px).", "Que a coluna terá 4 pixels de largura.", "Que a página terá 4 linhas.", "Que a coluna só aparece em celulares."], "answer": 0, "explanation": "Os breakpoints sm, md, lg e xl aplicam o dimensionamento a partir daquela largura (lógica mobile-first).", "id": "fe1_a14_e03"}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "facil", "question": "Qual classe do Bootstrap transforma uma tabela HTML em uma tabela zebrada (linhas alternadas)?", "options": ["table-striped", "table-zebra", "table-hover", "table-sm"], "answer": 0, "explanation": "A sintaxe oficial combina a classe base table com modificadores como table-striped, table-hover, table-dark e table-sm.", "id": "fe1_a14_e04"}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "facil", "question": "Qual componente do Bootstrap cria um slideshow de imagens ou slides com setas de navegação?", "options": ["Carousel", "Breadcrumb", "Navbar", "Badge"], "answer": 0, "explanation": "Carousel exibe slides rotativos de imagens ou conteúdo.", "id": "fe1_a14_e05"}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "facil", "question": "Qual componente flexível do Bootstrap agrupa imagem de topo (card-img-top), corpo (card-body), título e botão em um cartão?", "options": ["Card (.card)", "Table (.table)", "Alert (.alert)", "Modal (.modal)"], "answer": 0, "explanation": "Cards são contêineres versáteis muito usados para listar postagens, produtos e perfis.", "id": "fe1_a14_e06"}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "medio", "question": "Qual classe utilitária do Bootstrap adiciona sombra a um elemento, e qual adiciona margem inferior?", "options": ["shadow (ou shadow-lg) e mb-* (ex.: mb-5)", "box-shadow e margin-b", "dark e bottom-5", "drop e space-b"], "answer": 0, "explanation": "Utilitários do Bootstrap usam shadow/shadow-lg para sombra e m/p + lado (t, b, l/s, r/e, x, y) + escala 0–5 para espaçamento.", "id": "fe1_a14_e07"}, {"subject": "fe1", "lessonNum": 14, "lesson": "Aula 14 — Frameworks para Layout (Bootstrap)", "official": false, "difficulty": "medio", "question": "Sobre a migração do Bootstrap 4 (usado nos vídeos) para o Bootstrap 5, qual mudança é verdadeira?", "options": ["Atributos como data-toggle passaram a usar o prefixo -bs- (data-bs-toggle) e ml/mr viraram ms/me (start/end).", "O grid deixou de ter 12 colunas.", "A classe table-striped foi removida.", "Bootstrap 5 deixou de ser responsivo."], "answer": 0, "explanation": "No Bootstrap 5, atributos JS ganharam prefixo bs (data-bs-toggle), sr-only virou visually-hidden e ml/mr viraram ms/me.", "id": "fe1_a14_e08"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "facil", "question": "No projeto final do blog responsivo com Bootstrap (Aula 15), como a área principal foi dividida entre conteúdo de postagens e barra lateral (sidebar) em telas médias/grandes?", "options": ["col-md-8 para o conteúdo principal e col-md-4 para a sidebar (totalizando 12 colunas).", "col-md-10 e col-md-5.", "col-md-6 e col-md-12.", "Sem uso de grid, apenas com tabelas."], "answer": 0, "explanation": "8 + 4 = 12 colunas: padrão clássico de blog com 2/3 para posts e 1/3 para sidebar.", "id": "fe1_a15_e01"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "facil", "question": "Qual classe do Bootstrap foi usada na foto do autor na sidebar do blog para deixá-la perfeitamente circular?", "options": ["rounded-circle", "img-round", "circle-photo", "border-50"], "answer": 0, "explanation": "rounded-circle aplica border-radius: 50%, deixando imagens quadradas circulares.", "id": "fe1_a15_e02"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "facil", "question": "No rodapé do blog (\u003cfooter class='bg-dark py-3'\u003e\u003cp class='text-white text-center'\u003e...), o que fazem respectivamente bg-dark, text-white e text-center?", "options": ["Fundo escuro, texto branco e texto centralizado.", "Borda escura, fundo branco e texto à direita.", "Texto preto, fundo branco e margem lateral.", "Oculta o rodapé em celulares."], "answer": 0, "explanation": "Classes utilitárias do Bootstrap estilam fundo (bg-*), cor de texto (text-*) e alinhamento (text-center) sem CSS extra.", "id": "fe1_a15_e03"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "facil", "question": "Qual componente de navegação usado no topo do blog indica o caminho hierárquico onde o usuário está (ex.: Home / Como programar CSS)?", "options": ["Breadcrumb", "Carousel", "Dropdown", "Accordion"], "answer": 0, "explanation": "Breadcrumb ('migalhas de pão') mostra a localização atual do usuário na estrutura do site.", "id": "fe1_a15_e04"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "medio", "question": "Na página interna de uma postagem do blog, quais classes foram aplicadas à imagem principal para deixá-la responsiva, com cantos arredondados e margem inferior?", "options": ["img-fluid rounded mb-4", "img-big circle mt-0", "responsive-img border-0", "fluid-box shadow-none"], "answer": 0, "explanation": "img-fluid garante max-width: 100%, rounded arredonda levemente os cantos e mb-4 aplica margem inferior.", "id": "fe1_a15_e05"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "facil", "question": "Na seção de comentários da página interna do blog, qual componente Bootstrap envolveu o \u003ctextarea\u003e e o botão 'Comentar'?", "options": ["Um Card (.card com .card-header e .card-body) contendo .form-control e .btn .btn-primary.", "Uma tabela .table-dark.", "Um Carousel.", "Um Breadcrumb."], "answer": 0, "explanation": "Formulários em cards com form-control e btn-primary mantêm a identidade visual consistente.", "id": "fe1_a15_e06"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "medio", "question": "Na Aula 15, o componente 'Media Object' usado nos comentários do Bootstrap 4 foi removido no Bootstrap 5. Como recriá-lo no Bootstrap 5?", "options": ["Usando utilitários de Flexbox do próprio Bootstrap, como d-flex, gap e classes de alinhamento.", "Usando tabelas aninhadas.", "Usando Flash Player.", "Não é mais possível alinhar avatar e texto no Bootstrap 5."], "answer": 0, "explanation": "Conforme a nota de atualização da Aula 15, d-flex e utilitários de espaçamento substituem o antigo Media Object.", "id": "fe1_a15_e07"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "medio", "question": "Em Bootstrap 5, quais classes substituíram os antigos helpers embed-responsive (usados para vídeos do YouTube no blog)?", "options": ["Helpers ratio e ratio-16x9", "Classes video-fluid e yt-box", "Classes col-video-12", "Não existem helpers de proporção no Bootstrap 5"], "answer": 0, "explanation": "ratio e ratio-16x9 mantêm a proporção de iframes e vídeos responsivos no Bootstrap 5.", "id": "fe1_a15_e08"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "medio", "question": "Como mudaram as classes de badges coloridas (ex.: badge-success) ao migrar do Bootstrap 4 para o Bootstrap 5?", "options": ["Passaram a combinar badge com text-bg-success (ou text-bg-danger).", "Viraram tag-green e tag-red.", "Badges foram removidos do Bootstrap 5.", "Permaneceram exatamente iguais."], "answer": 0, "explanation": "O Bootstrap 5 introduziu text-bg-* para garantir contraste automático de texto sobre o fundo da badge.", "id": "fe1_a15_e09"}, {"subject": "fe1", "lessonNum": 15, "lesson": "Aula 15 — Criando um blog", "official": false, "difficulty": "facil", "question": "Na Aula 15, quais widgets compõem a sidebar do blog responsivo?", "options": ["Cards de busca, categorias e informações do autor.", "Apenas um vídeo em tela cheia.", "Somente o rodapé repetido.", "Um editor de código TypeScript."], "answer": 0, "explanation": "A sidebar reúne widgets em formato de cards: Busca, Categorias e Autor.", "id": "fe1_a15_e10"}, {"id": "fe2_01", "subject": "fe2", "lesson": "Aula 01 — Revisão de JavaScript", "difficulty": "facil", "question": "Marque a opção que NÃO corresponde a um tipo de dado válido em JavaScript:", "options": ["Number", "NaN", "undefined", "Boolean"], "answer": 1, "explanation": "NaN (\"Not-a-Number\") não é um tipo de dado independente — ele é um valor especial pertencente ao tipo Number.", "official": true, "lessonNum": 1}, {"id": "fe2_02", "subject": "fe2", "lesson": "Aula 01 — Revisão de JavaScript", "difficulty": "facil", "question": "O que realiza o operador unário -- em JavaScript, e qual o resultado da operação 17 % 3?", "options": ["Subtrai dois operandos; resultado 1.", "Decrementa o operando em uma unidade; resultado 2.", "Calcula potência negativa; resultado 0.", "Atribuição composta; resultado 3."], "answer": 1, "explanation": "O operador unário -- decrementa o valor do operando em 1 unidade. Já 17 % 3 retorna o resto da divisão inteira de 17 por 3 (17 = 3×5 + 2), ou seja, 2.", "official": true, "lessonNum": 1}, {"id": "fe2_03", "subject": "fe2", "lesson": "Aula 01 — Revisão de JavaScript", "difficulty": "facil", "question": "Marque a opção na qual a comparação indicada retornará o valor verdadeiro (true) em JavaScript:", "options": ["0 === false", "1 == false", "12.5 == '12.5'", "42 === '42'"], "answer": 2, "explanation": "O operador == (igualdade ampla) realiza coerção de tipo, convertendo a string '12.5' para o número 12.5 e retornando true. Já === exige mesmo valor E mesmo tipo.", "official": true, "lessonNum": 1}, {"id": "fe2_04", "subject": "fe2", "lesson": "Aula 01 — Revisão de JavaScript", "difficulty": "facil", "question": "Qual característica define corretamente as variáveis declaradas com a palavra-chave let em JavaScript?", "options": ["Possuem escopo de função, sendo acessíveis fora de blocos if/for.", "Ficam com tipo null se declaradas sem valor inicial.", "Não permitem que seus valores sejam reatribuídos.", "Possuem escopo de bloco, sendo acessíveis somente dentro do bloco em que foram declaradas."], "answer": 3, "explanation": "let declara variáveis com escopo de bloco (block scope) e permite reatribuição. var tem escopo de função e const impede reatribuição.", "official": true, "lessonNum": 1}, {"subject": "fe2", "lessonNum": 1, "lesson": "Aula 01 — Revisão de JavaScript", "official": false, "difficulty": "facil", "question": "Que tipo de operação o operador unário ++ realiza em JavaScript?", "options": ["Calcula potência de grau dois.", "Incrementa o operando numérico em uma unidade.", "Concatena duas strings.", "Realiza atribuição de constante."], "answer": 1, "explanation": "O operador unário ++ adiciona exatamente 1 ao operando.", "id": "fe2_a01_e01"}, {"subject": "fe2", "lessonNum": 1, "lesson": "Aula 01 — Revisão de JavaScript", "official": false, "difficulty": "facil", "question": "Qual é o resultado da operação 17 % 4 em JavaScript?", "options": ["3", "0", "1", "2"], "answer": 2, "explanation": "17 dividido por 4 tem quociente 4 e resto 1 (17 = 4*4 + 1).", "id": "fe2_a01_e02"}, {"subject": "fe2", "lessonNum": 1, "lesson": "Aula 01 — Revisão de JavaScript", "official": false, "difficulty": "facil", "question": "Qual será a saída no console do trecho de código abaixo?", "options": ["cachorro miau", "cachorro au au", "cachorro", "cachorro!"], "answer": 1, "explanation": "Como nome == 'cachorro' é verdadeiro, o primeiro bloco concatena ' au au'.", "code": "var nome = 'cachorro';\nif (nome == 'cachorro') {\n  nome += ' au au';\n} else if (nome == 'gato') {\n  nome += ' miau';\n} else {\n  nome += '!';\n}\nconsole.log(nome);", "id": "fe2_a01_e03"}, {"subject": "fe2", "lessonNum": 1, "le
