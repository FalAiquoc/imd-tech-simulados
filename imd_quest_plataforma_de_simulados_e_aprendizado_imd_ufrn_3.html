function bindConfigEvents() {
  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.config.mode = btn.dataset.mode;
      render();
    });
  });

  document.querySelectorAll('[data-count]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.config.count = Number(btn.dataset.count);
      render();
    });
  });

  document.querySelectorAll('[data-subject]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.subject;
      const idx = state.config.subjects.indexOf(id);
      if (idx >= 0) {
        state.config.subjects.splice(idx, 1);
      } else {
        state.config.subjects.push(id);
      }
      state.config.lessonFilter = 'all';
      render();
    });
  });

  document.getElementById('selectAllSubjectsBtn')?.addEventListener('click', () => {
    state.config.subjects = SUBJECTS.map(s => s.id);
    render();
  });

  document.getElementById('clearSubjectsBtn')?.addEventListener('click', () => {
    state.config.subjects = [];
    render();
  });

  document.querySelectorAll('[data-order]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.config.orderMode = btn.dataset.order;
      render();
    });
  });

  document.querySelectorAll('[data-move-sub]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.moveSub;
      const dir = Number(btn.dataset.dir);
      const arr = state.config.subjects;
      const idx = arr.indexOf(id);
      const target = idx + dir;
      if (idx >= 0 && target >= 0 && target < arr.length) {
        [arr[idx], arr[target]] = [arr[target], arr[idx]];
        render();
      }
    });
  });

  document.getElementById('shuffleInsideCheck')?.addEventListener('change', (e) => {
    state.config.shuffleInsideBlock = e.target.checked;
  });

  document.querySelectorAll('[data-bank]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.config.bankFilter = btn.dataset.bank;
      render();
    });
  });

  document.getElementById('lessonFilterSelect')?.addEventListener('change', (e) => {
    state.config.lessonFilter = e.target.value;
    render();
  });

  document.querySelectorAll('[data-diff]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.config.difficulty = btn.dataset.diff;
      render();
    });
  });

  document.querySelectorAll('[data-timer]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.config.timerMode = btn.dataset.timer;
      render();
    });
  });

  document.getElementById('prioritizeErrorsCheck')?.addEventListener('change', (e) => {
    state.config.prioritizeErrors = e.target.checked;
  });

  document.getElementById('resumeSavedSessionBtn')?.addEventListener('click', () => resumeSavedSession());
  document.getElementById('discardSavedSessionBtn')?.addEventListener('click', () => {
    clearActiveSessionSnapshot();
    render();
  });

  document.getElementById('heroStartBtn')?.addEventListener('click', () => startSession());
  document.getElementById('bottomStartBtn')?.addEventListener('click', () => startSession());

  document.getElementById('quickRetryErrorsBtn')?.addEventListener('click', () => {
    const ids = state.stats.wrongIds || [];
    if (ids.length === 0) return;
    startSession(ids, 'Treino do Caderno de Erros');
  });
}

// ---------- VIEW 2: QUIZ EXECUTION ----------
function renderQuizView() {
  const s = state.session;
  const c = state.config;
  const q = s.questions[s.currentIndex];
  const sub = SUBJECT_MAP[q.subject];
  const chosen = s.answers[q.id];
  const isAnswered = chosen !== undefined;
  const isCorrect = chosen === q.answer;
  const isFlagged = s.flagged.has(q.id);
  const total = s.questions.length;
  const answeredCount = Object.keys(s.answers).length;
  const progressPct = Math.round(((s.currentIndex + 1) / total) * 100);

  // Current section banner for segmented mode
  let sectionHtml = '';
  if (c.orderMode === 'segmentado' && s.sections.length > 0) {
    const secIdx = s.sections.findIndex(sec => s.currentIndex >= sec.start && s.currentIndex <= sec.end);
    const sec = s.sections[secIdx];
    const inSecNum = s.currentIndex - sec.start + 1;
    sectionHtml = `
      <div class="rounded-xl border border-soft bg-surface/80 px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-2 font-semibold text-primary">
          <i data-lucide="layers" class="w-4 h-4 text-accent"></i>
          <span>Bloco ${secIdx + 1} de ${s.sections.length}: <strong>${sec.name}</strong></span>
        </div>
        <span class="text-secondary">Questão ${inSecNum} de ${sec.count} neste bloco</span>
      </div>
    `;
  }

  const modeBadge = c.mode === 'rapido'
    ? 'Modo Rápido (Certo/Errado)'
    : c.mode === 'explicado'
      ? 'Modo Explicado'
      : 'Modo Simulado Real';

  const letters = ['A', 'B', 'C', 'D', 'E'];

  // Options HTML
  const optionsHtml = q.options.map((opt, idx) => {
    let cls = 'option-btn w-full text-left p-3.5 sm:p-4 rounded-xl border border-soft bg-card flex items-start gap-3';
    let iconRight = '';

    if (c.mode === 'prova') {
      if (chosen === idx) cls += ' selected';
    } else if (c.mode === 'rapido') {
      if (isAnswered && chosen === idx) {
        cls += isCorrect ? ' correct' : ' wrong';
        iconRight = isCorrect
          ? '<i data-lucide="check-circle-2" class="w-5 h-5 shrink-0 ml-auto"></i>'
          : '<i data-lucide="x-circle" class="w-5 h-5 shrink-0 ml-auto"></i>';
      }
    } else if (c.mode === 'explicado') {
      if (isAnswered) {
        if (idx === q.answer) {
          cls += ' correct';
          iconRight = '<i data-lucide="check-circle-2" class="w-5 h-5 shrink-0 ml-auto"></i>';
        } else if (chosen === idx) {
          cls += ' wrong';
          iconRight = '<i data-lucide="x-circle" class="w-5 h-5 shrink-0 ml-auto"></i>';
        }
      }
    }

    const disabledAttr = (s.paused || ((c.mode === 'rapido' || c.mode === 'explicado') && isAnswered)) ? 'disabled' : '';

    return `
      <button type="button" data-opt="${idx}" ${disabledAttr} class="${cls}">
        <span class="w-7 h-7 rounded-lg border border-strong/60 bg-surface/70 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${letters[idx]}</span>
        <span class="text-sm sm:text-[15px] leading-snug flex-1">${escapeHtml(opt)}</span>
        ${iconRight}
      </button>
    `;
  }).join('');

  // Feedback box
  let feedbackHtml = '';
  if (isAnswered && c.mode === 'rapido') {
    feedbackHtml = `
      <div class="rounded-xl border p-4 fade-in ${isCorrect ? 'state-ok' : 'state-err'}">
        <div class="flex items-center gap-2 font-bold text-sm">
          <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i>
          <span>${isCorrect ? 'Você acertou!' : 'Você errou esta questão.'}</span>
        </div>
        <p class="text-xs mt-1 opacity-90">No Modo Rápido, o gabarito e a explicação completa ficam disponíveis no relatório final.</p>
      </div>
    `;
  } else if (isAnswered && c.mode === 'explicado') {
    feedbackHtml = `
      <div class="rounded-xl border p-4 space-y-2 fade-in ${isCorrect ? 'state-ok' : 'state-err'}">
        <div class="flex items-center gap-2 font-bold text-sm">
          <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i>
          <span>${isCorrect ? 'Resposta correta!' : `Resposta incorreta — A alternativa certa é a letra ${letters[q.answer]}.`}</span>
        </div>
        <div class="text-xs sm:text-sm leading-relaxed pt-1 border-t border-current/15">
          <strong>Explicação (${escapeHtml(q.lesson)}):</strong> ${escapeHtml(q.explanation)}
        </div>
      </div>
    `;
  }

  // Question Map Sidebar/Panel
  const renderMapGrid = () => {
    if (c.orderMode === 'segmentado' && s.sections.length > 0) {
      return s.sections.map(sec => {
        const subInfo = SUBJECT_MAP[sec.subId];
        const btns = [];
        for (let i = sec.start; i <= sec.end; i++) {
          btns.push(renderMapDot(i));
        }
        return `
          <div class="space-y-1.5">
            <div class="text-[11px] font-bold text-secondary flex items-center justify-between">
              <span class="truncate">${subInfo.short}</span>
              <span class="text-muted">Q${sec.start + 1}–${sec.end + 1}</span>
            </div>
            <div class="grid grid-cols-5 gap-1.5">${btns.join('')}</div>
          </div>
        `;
      }).join('');
    }
    return `<div class="grid grid-cols-5 gap-1.5">${s.questions.map((_, i) => renderMapDot(i)).join('')}</div>`;
  };

  const renderMapDot = (i) => {
    const item = s.questions[i];
    const ans = s.answers[item.id];
    const flagged = s.flagged.has(item.id);
    const isCurrent = i === s.currentIndex;
    let styleCls = 'border-soft bg-surface/60 text-secondary';
    if (ans !== undefined) {
      if (c.mode === 'prova') {
        styleCls = 'border-accent bg-accent-soft text-accent font-bold';
      } else {
        styleCls = ans === item.answer ? 'state-ok font-bold' : 'state-err font-bold';
      }
    }
    return `
      <button type="button" data-jump="${i}" class="relative h-9 rounded-lg border text-xs transition flex items-center justify-center ${styleCls} ${isCurrent ? 'ring-2 ring-[var(--accent)] font-extrabold' : 'hover:border-strong'}">
        ${i + 1}
        ${flagged ? '<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-500 border border-[var(--bg-card)]"></span>' : ''}
      </button>
    `;
  };

  const diffLabels = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' };

  return `
    <div class="space-y-4 fade-in">
      <!-- TOP BAR -->
      <div class="rounded-2xl border border-soft bg-card p-3.5 sm:p-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 flex-wrap">
          <button id="exitQuizBtn" type="button" class="px-2.5 py-1.5 rounded-lg border border-soft hover:bg-surface text-xs font-semibold flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Sair</span>
          </button>
          <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-accent-soft">${modeBadge}</span>
          ${s.label ? `<span class="text-xs text-muted font-medium">${escapeHtml(s.label)}</span>` : ''}
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
          ${c.timerMode !== 'off' ? `
            <div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-surface border border-soft text-xs font-mono font-semibold">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-accent"></i>
              <span id="quizTimerValue">${formatTime(c.timerMode === 'down' ? s.remainingSec : s.elapsedSec)}</span>
              <button id="pauseTimerBtn" type="button" class="ml-1 text-muted hover:text-primary" title="${s.paused ? 'Retomar' : 'Pausar'}">
                <i data-lucide="${s.paused ? 'play' : 'pause'}" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          ` : ''}
          <button id="toggleMapBtn" type="button" class="lg:hidden px-2.5 py-1.5 rounded-lg border border-soft bg-surface text-xs font-semibold flex items-center gap-1.5">
            <i data-lucide="grid-3x3" class="w-3.5 h-3.5"></i>
            <span>Mapa (${answeredCount}/${total})</span>
          </button>
          <button id="finishQuizBtn" type="button" class="px-3.5 py-1.5 rounded-lg bg-accent text-xs font-bold flex items-center gap-1.5">
            <i data-lucide="flag" class="w-3.5 h-3.5"></i>
            <span>Finalizar</span>
          </button>
        </div>
      </div>

      <!-- PROGRESS BAR -->
      <div class="w-full h-2 rounded-full bg-surface overflow-hidden border border-soft">
        <div class="h-full bg-accent transition-all duration-200" style="width: ${progressPct}%"></div>
      </div>

      ${sectionHtml}

      <!-- MAIN GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        <!-- QUESTION CARD -->
        <div class="lg:col-span-8 space-y-4">
          ${s.paused ? `
            <div class="rounded-2xl border border-strong bg-card p-10 text-center space-y-4">
              <div class="w-12 h-12 rounded-2xl bg-accent-soft mx-auto flex items-center justify-center">
                <i data-lucide="pause-circle" class="w-6 h-6"></i>
              </div>
              <h3 class="text-lg font-bold">Teste pausado</h3>
              <p class="text-sm text-secondary">O cronômetro está parado. Clique abaixo quando quiser continuar.</p>
              <button id="resumeFromOverlayBtn" type="button" class="px-5 py-2.5 rounded-xl bg-accent text-sm font-bold">Retomar teste</button>
            </div>
          ` : `
            <div class="rounded-2xl border border-soft bg-card p-5 sm:p-6 space-y-4 shadow-sm">
              <!-- Question Meta -->
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-xs font-bold px-2.5 py-1 rounded-lg" style="background-color: ${sub.badgeBg}; color: ${sub.badgeInk};">${sub.short}</span>
                  <span class="text-xs text-muted font-medium">${escapeHtml(q.lesson)}</span>
                  <span class="text-[11px] px-2 py-0.5 rounded-md bg-surface border border-soft text-secondary">${diffLabels[q.difficulty]}</span>
                  ${q.official ? '<span class="text-[11px] px-2 py-0.5 rounded-md bg-accent-soft text-accent font-semibold">Oficial</span>' : ''}
                </div>
                <button id="flagQuestionBtn" type="button" class="px-2.5 py-1 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition ${isFlagged ? 'state-warn' : 'border-soft bg-surface/60 text-secondary hover:border-strong'}">
                  <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
                  <span>${isFlagged ? 'Marcada' : 'Revisar'}</span>
                </button>
              </div>

              <!-- Question Prompt -->
              <div class="space-y-2">
                <div class="text-xs font-bold uppercase tracking-wider text-muted">Questão ${s.currentIndex + 1} de ${total}</div>
                <h2 class="text-base sm:text-lg font-bold text-primary leading-snug whitespace-pre-line">${escapeHtml(q.question)}</h2>
                ${q.code ? `<pre class="code-block"><code>${escapeHtml(q.code)}</code></pre>` : ''}
              </div>

              <!-- Options -->
              <div class="space-y-2.5 pt-1">${optionsHtml}</div>

              ${feedbackHtml}

              <!-- Navigation Controls -->
              <div class="flex items-center justify-between gap-3 pt-3 border-t border-soft">
                <button id="prevQBtn" type="button" ${s.currentIndex === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-xl border border-soft bg-surface hover:border-strong text-sm font-semibold flex items-center gap-1.5 disabled:opacity-35">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  <span>Anterior</span>
                </button>

                <div class="text-xs text-muted hidden sm:block">
                  Respondidas: <strong>${answeredCount}/${total}</strong>
                </div>

                ${s.currentIndex < total - 1 ? `
                  <button id="nextQBtn" type="button" class="px-5 py-2 rounded-xl bg-accent text-sm font-bold flex items-center gap-1.5">
                    <span>Próxima</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                  </button>
                ` : `
                  <button id="finishBottomBtn" type="button" class="px-5 py-2 rounded-xl bg-accent text-sm font-bold flex items-center gap-1.5">
                    <i data-lucide="check-check" class="w-4 h-4"></i>
                    <span>Entregar &amp; Corrigir</span>
                  </button>
                `}
              </div>
            </div>
          `}
        </div>

        <!-- SIDEBAR QUESTION MAP -->
        <aside class="lg:col-span-4 ${s.drawerOpen ? 'block' : 'hidden lg:block'}">
          <div class="rounded-2xl border border-soft bg-card p-4 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold flex items-center gap-1.5">
                <i data-lucide="map" class="w-4 h-4 text-accent"></i>
                <span>Mapa de Questões</span>
              </h3>
              <span class="text-xs text-muted">${answeredCount}/${total} feitas</span>
            </div>
            <div class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
              ${renderMapGrid()}
            </div>
            <div class="pt-3 border-t border-soft flex flex-wrap gap-3 text-[11px] text-secondary">
              <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Revisão</span>
              <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-[var(--accent)]"></span> Atual</span>
              ${c.mode !== 'prova' ? `
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded border state-ok"></span> Certo</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded border state-err"></span> Errado</span>
              ` : `
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-[var(--accent-soft)] border border-accent"></span> Respondida</span>
              `}
            </div>
          </div>
        </aside>
      </div>
    </div>
  `;
}

function bindQuizEvents() {
  const s = state.session;
  document.querySelectorAll('[data-opt]').forEach(btn => {
    btn.addEventListener('click', () => selectOption(Number(btn.dataset.opt)));
  });

  document.querySelectorAll('[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      s.currentIndex = Number(btn.dataset.jump);
      s.drawerOpen = false;
      render();
    });
  });

  document.getElementById('prevQBtn')?.addEventListener('click', () => {
    if (s.currentIndex > 0) {
      s.currentIndex--;
      render();
    }
  });

  document.getElementById('nextQBtn')?.addEventListener('click', () => {
    if (s.currentIndex < s.questions.length - 1) {
      s.currentIndex++;
      render();
    }
  });

  document.getElementById('flagQuestionBtn')?.addEventListener('click', () => {
    const q = s.questions[s.currentIndex];
    if (s.flagged.has(q.id)) s.flagged.delete(q.id);
    else s.flagged.add(q.id);
    persistActiveSessionSnapshot();
    render();
  });

  document.getElementById('pauseTimerBtn')?.addEventListener('click', () => {
    s.paused = !s.paused;
    persistActiveSessionSnapshot();
    render();
  });

  document.getElementById('resumeFromOverlayBtn')?.addEventListener('click', () => {
    s.paused = false;
    render();
  });

  document.getElementById('toggleMapBtn')?.addEventListener('click', () => {
    s.drawerOpen = !s.drawerOpen;
    render();
  });

  const askFinish = () => {
    const unanswered = s.questions.length - Object.keys(s.answers).length;
    if (unanswered > 0) {
      openModal({
        title: 'Finalizar teste agora?',
        body: `Você ainda tem ${unanswered} questão(ões) sem resposta. Questões em branco contam como erro na nota final.`,
        confirmText: 'Finalizar e corrigir',
        onConfirm: () => finishSession()
      });
    } else {
      finishSession();
    }
  };

  document.getElementById('finishQuizBtn')?.addEventListener('click', askFinish);
  document.getElementById('finishBottomBtn')?.addEventListener('click', askFinish);

  document.getElementById('exitQuizBtn')?.addEventListener('click', () => {
    openModal({
      title: 'Sair do teste atual?',
      body: 'O progresso desta tentativa não será salvo no histórico.',
      confirmText: 'Sair para configuração',
      onConfirm: () => {
        clearQuizTimer();
        clearActiveSessionSnapshot();
        state.session = null;
        state.view = 'config';
        render();
      }
    });
  });
}

// ---------- VIEW 3: RESULTS ----------
function renderResultsView() {
  const s = state.session;
  const total = s.questions.length;
  const correctList = s.questions.filter(q => s.answers[q.id] === q.answer);
  const wrongList = s.questions.filter(q => s.answers[q.id] !== q.answer);
  const flaggedList = s.questions.filter(q => s.flagged.has(q.id));

  const correctCount = correctList.length;
  const wrongCount = wrongList.length;
  const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  const score = total > 0 ? ((correctCount / total) * 10).toFixed(1) : '0.0';
  const avgSec = total > 0 ? Math.round(s.elapsedSec / total) : 0;

  let statusMsg = 'Continue praticando os tópicos com mais erros.';
  let statusCls = 'state-err';
  if (Number(score) >= 7.0) {
    statusMsg = 'Ótimo desempenho! Acima da média de aprovação do IMD (7,0).';
    statusCls = 'state-ok';
  } else if (Number(score) >= 5.0) {
    statusMsg = 'Na faixa de recuperação (5,0–6,9). Revise os erros abaixo para consolidar.';
    statusCls = 'state-warn';
  }

  const letters = ['A', 'B', 'C', 'D', 'E'];

  const filteredQuestions = s.questions.filter(q => {
    const ok = s.answers[q.id] === q.answer;
    if (state.resultsFilter === 'wrong') return !ok;
    if (state.resultsFilter === 'correct') return ok;
    if (state.resultsFilter === 'flagged') return s.flagged.has(q.id);
    return true;
  });

  const reviewHtml = filteredQuestions.length === 0
    ? `<div class="p-6 text-center text-sm text-muted rounded-xl border border-soft bg-card">Nenhuma questão corresponde a este filtro.</div>`
    : filteredQuestions.map(q => {
      const idx = s.questions.indexOf(q);
      const sub = SUBJECT_MAP[q.subject];
      const chosen = s.answers[q.id];
      const ok = chosen === q.answer;
      return `
        <div class="rounded-2xl border border-soft bg-card p-4 sm:p-5 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-extrabold text-primary">Q${idx + 1}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded-md" style="background-color: ${sub.badgeBg}; color: ${sub.badgeInk};">${sub.short}</span>
              <span class="text-xs text-muted">${escapeHtml(q.lesson)}</span>
            </div>
            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full border ${ok ? 'state-ok' : 'state-err'}">
              ${ok ? 'Acertou' : chosen === undefined ? 'Em branco' : 'Errou'}
            </span>
          </div>
          <p class="text-sm font-bold text-primary whitespace-pre-line">${escapeHtml(q.question)}</p>
          ${q.code ? `<pre class="code-block"><code>${escapeHtml(q.code)}</code></pre>` : ''}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
            <div class="p-2.5 rounded-xl border ${ok ? 'state-ok' : 'state-err'}">
              <div class="opacity-80 font-semibold">Sua resposta:</div>
              <div class="font-bold mt-0.5">${chosen !== undefined ? `${letters[chosen]}) ${escapeHtml(q.options[chosen])}` : 'Não respondida'}</div>
            </div>
            <div class="p-2.5 rounded-xl border state-ok">
              <div class="opacity-80 font-semibold">Gabarito oficial:</div>
              <div class="font-bold mt-0.5">${letters[q.answer]}) ${escapeHtml(q.options[q.answer])}</div>
            </div>
          </div>
          <div class="text-xs sm:text-sm text-secondary bg-surface/70 border border-soft rounded-xl p-3">
            <strong class="text-primary">Explicação:</strong> ${escapeHtml(q.explanation)}
          </div>
        </div>
      `;
    }).join('');

  return `
    <div class="space-y-6 fade-in">
      <!-- SCORE HEADER -->
      <section class="rounded-2xl border border-soft bg-card p-5 sm:p-6 space-y-4 shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="text-xs font-bold uppercase tracking-wider text-muted">Relatório de Desempenho</div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-primary">Nota ${score} / 10,0</h1>
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-xl border text-xs font-semibold ${statusCls}">
              <span>${statusMsg}</span>
            </div>
          </div>

          <div class="flex flex-wrap gap-2">
            ${wrongCount > 0 ? `
              <button id="retryWrongSessionBtn" type="button" class="px-4 py-2.5 rounded-xl bg-accent text-sm font-bold flex items-center gap-2">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Refazer Apenas Erros (${wrongCount})</span>
              </button>
            ` : ''}
            <button id="copySummaryBtn" type="button" class="px-4 py-2.5 rounded-xl border border-soft bg-surface hover:border-strong text-sm font-semibold flex items-center gap-2">
              <i data-lucide="copy" class="w-4 h-4"></i>
              <span>Copiar Resumo</span>
            </button>
            <button id="newTestBtn" type="button" class="px-4 py-2.5 rounded-xl border border-soft bg-card hover:bg-surface text-sm font-semibold flex items-center gap-2">
              <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
              <span>Novo Teste</span>
            </button>

function bindResultsEvents() {
  const s = state.session;
  document.querySelectorAll('[data-res-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.resultsFilter = btn.dataset.resFilter;
      render();
    });
  });

  document.getElementById('retryWrongSessionBtn')?.addEventListener('click', () => {
    const wrongIds = s.questions.filter(q => s.answers[q.id] !== q.answer).map(q => q.id);
    if (wrongIds.length === 0) return;
    startSession(wrongIds, 'Refazendo Erros do Simulado');
  });

  document.getElementById('newTestBtn')?.addEventListener('click', () => {
    state.session = null;
    state.view = 'config';
    render();
  });

  document.getElementById('copySummaryBtn')?.addEventListener('click', () => {
    const total = s.questions.length;
    const correct = s.questions.filter(q => s.answers[q.id] === q.answer).length;
    const score = ((correct / total) * 10).toFixed(1);
    const lines = [
      `IMD Quest — Resumo do Simulado`,
      `Nota: ${score}/10.0 (${correct}/${total} acertos • ${Math.round((correct / total) * 100)}%)`,
      `Tempo: ${formatTime(s.elapsedSec)}`,
      `Modo: ${state.config.mode} | Ordem: ${state.config.orderMode}`
    ];
    const text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast('Resumo copiado!')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  });
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('Resumo copiado!');
  } catch (e) {
    showToast('Não foi possível copiar automaticamente.');
  }
  document.body.removeChild(ta);
}

function renderResultsChart() {
  const canvas = document.getElementById('resultsChart');
  if (!canvas || !window.Chart || !state.session) return;

  const map = {};
  for (const q of state.session.questions) {
    if (!map[q.subject]) map[q.subject] = { correct: 0, total: 0 };
    map[q.subject].total++;
    if (state.session.answers[q.id] === q.answer) map[q.subject].correct++;
  }

  const keys = Object.keys(map);
  const labels = keys.map(k => SUBJECT_MAP[k].short);
  const data = keys.map(k => Math.round((map[k].correct / map[k].total) * 100));
  const colors = keys.map(k => SUBJECT_MAP[k].color);
  const ink = state.prefs.theme === 'dark' ? '#E9DFCE' : '#2C251D';
  const grid = state.prefs.theme === 'dark' ? 'rgba(255,255,255,0.08)' : 'rgba(31,26,20,0.08)';

  state.chartInstance = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '% de Acertos',
        data,
        backgroundColor: colors,
        borderRadius: 8,
        maxBarThickness: 56
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          beginAtZero: true,
          max: 100,
          ticks: { color: ink, callback: v => `${v}%` },
          grid: { color: grid }
        },
        x: {
          ticks: { color: ink },
          grid: { display: false }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

function bindHistoryEvents() {
  document.getElementById('histRetryWrongBtn')?.addEventListener('click', () => {
    const ids = state.stats.wrongIds || [];
    if (ids.length === 0) return;
    startSession(ids, 'Treino do Caderno de Erros');
  });

  document.querySelectorAll('[data-train-lesson]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [subId, lNumStr] = btn.dataset.trainLesson.split(':');
      const lNum = Number(lNumStr);
      const ids = QUESTION_BANK.filter(q => q.subject === subId && q.lessonNum === lNum).map(q => q.id);
      if (ids.length === 0) return;
      startSession(ids, `Reforço — ${SUBJECT_MAP[subId]?.short || subId} Aula ${lNum}`);
    });
  });

  document.getElementById('exportJsonBtn')?.addEventListener('click', async () => {
    if (!window.IMDQuestDB) return;
    await window.IMDQuestDB.exportJSON();
    showToast('Backup JSON exportado com sucesso.');
  });

  document.getElementById('exportCsvBtn')?.addEventListener('click', async () => {
    if (!window.IMDQuestDB) return;
    await window.IMDQuestDB.exportCSV();
    showToast('Relatório CSV exportado.');
  });

  const importInput = document.getElementById('importJsonInput');
  document.getElementById('importJsonBtn')?.addEventListener('click', () => {
    importInput?.click();
  });

  importInput?.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file || !window.IMDQuestDB) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const added = await window.IMDQuestDB.importJSON(parsed);
      const synced = await window.IMDQuestDB.buildLegacyStatsSync();
      state.stats = Object.assign({}, defaultStats, synced);
      saveStorage(STORAGE_STATS_KEY, state.stats);
      state.analytics = await window.IMDQuestDB.getAnalytics();
      showToast(`Backup restaurado (${added} simulado(s) importado(s)).`);
      render();
    } catch (err) {
      showToast(`Erro ao importar backup: ${err.message || 'arquivo inválido'}`);
    } finally {
      e.target.value = '';
    }
  });

  document.getElementById('clearStatsBtn')?.addEventListener('click', () => {
    openModal({
      title: 'Limpar todo o histórico?',
      body: 'Isso apagará seus simulados anteriores, estatísticas acumuladas, banco local e o caderno de erros.',
      confirmText: 'Apagar histórico',
      onConfirm: async () => {
        state.stats = { history: [], wrongIds: [], seenIds: [], bySubject: {} };
        saveStorage(STORAGE_STATS_KEY, state.stats);
        if (window.IMDQuestDB) {
          await window.IMDQuestDB.clearAll();
          state.analytics = await window.IMDQuestDB.getAnalytics();
        }
        state.activeSavedSession = null;
        showToast('Histórico limpo com sucesso.');
        render();
      }
    });
  });
}

    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#9A4A1C';

    state.trendChartInstance = new Chart(trendCanvas, {
      type: 'line',

        labels: tLabels,
        datasets: [{
          label: 'Assertividade (%)',
          data: tData,
          borderColor: accent,
          backgroundColor: 'rgba(154, 74, 28, 0.14)',
          tension: 0.25,
          fill: true,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, max: 100, ticks: { color: ink, callback: v => `${v}%` }, grid: { color: grid } },
          x: { ticks: { color: ink, maxRotation: 30 }, grid: { display: false } }
        },
        plugins: { legend: { display: false } }
      }
    });

  });

  document.getElementById('navHistoryBtn').addEventListener('click', () => {
    if (state.view === 'quiz' && state.session && !state.session.finished) {
      openModal({
        title: 'Abrir Desempenho?',
        body: 'Isso encerrará a tentativa atual sem salvá-la.',
        confirmText: 'Ir para Desempenho',
        onConfirm: () => {
          clearQuizTimer();
          clearActiveSessionSnapshot();
          state.session = null;
          state.view = 'history';
          render();
        }
      });
      return;
    }
    state.view = 'history';
    render();
  });

  document.getElementById('themeToggleBtn').addEventListener('click', () => {
    state.prefs.theme = state.prefs.theme === 'dark' ? 'paper' : 'dark';
    applyPrefs();
    if (state.view === 'results' || state.view === 'history') render();
  });

  document.getElementById('fontDownBtn').addEventListener('click', () => {
    state.prefs.fontScale = Math.max(0.85, Number((state.prefs.fontScale - 0.08).toFixed(2)));
    applyPrefs();
  });

  document.getElementById('fontUpBtn').addEventListener('click', () => {
    state.prefs.fontScale = Math.min(1.25, Number((state.prefs.fontScale + 0.08).toFixed(2)));
    applyPrefs();
  });

  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalConfirmBtn').addEventListener('click', () => {
    const cb = state.modalCallback;
    closeModal();
    if (cb) cb();
  });

  // Keyboard shortcuts during quiz
  document.addEventListener('keydown', (e) => {
    if (state.view !== 'quiz' || !state.session || state.session.paused || state.session.finished) return;
    if (!document.getElementById('modalOverlay').classList.contains('hidden')) return;

    const key = e.key.toLowerCase();
    const q = state.session.questions[state.session.currentIndex];
    const mapKey = { '1': 0, 'a': 0, '2': 1, 'b': 1, '3': 2, 'c': 2, '4': 3, 'd': 3, '5': 4, 'e': 4 };

    if (mapKey[key] !== undefined && mapKey[key] < q.options.length) {
      e.preventDefault();
      selectOption(mapKey[key]);
    } else if (key === 'enter' || key === 'arrowright') {
      e.preventDefault();
      if (state.session.currentIndex < state.session.questions.length - 1) {
        state.session.currentIndex++;
        render();
      }
    } else if (key === 'arrowleft') {
      e.preventDefault();
      if (state.session.currentIndex > 0) {
        state.session.currentIndex--;
        render();
      }
    } else if (key === 'r') {
      e.preventDefault();
      if (state.session.flagged.has(q.id)) state.session.flagged.delete(q.id);
      else state.session.flagged.add(q.id);
      render();
    }
  });
}

// ============================================================
// 8. BOOTSTRAP
// ============================================================
window.addEventListener('DOMContentLoaded', async () => {
  applyPrefs();
  initGlobalEvents();
  render();

  if (window.IMDQuestDB) {
    try {
      state.dbEngine = await window.IMDQuestDB.init(state.stats);
      const synced = await window.IMDQuestDB.buildLegacyStatsSync();
      if ((synced.history && synced.history.length > 0) || (synced.seenIds && synced.seenIds.length > 0)) {
        state.stats = Object.assign({}, defaultStats, synced);
        saveStorage(STORAGE_STATS_KEY, state.stats);
      }
      state.analytics = await window.IMDQuestDB.getAnalytics();
      state.activeSavedSession = await window.IMDQuestDB.getActiveSession();
      if (state.view === 'config' || state.view === 'history') {
        render();
      }
    } catch (e) {
      // Mantém localStorage se IndexedDB/SQLite falhar
    }
  }
});
</script>
